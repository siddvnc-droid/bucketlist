<title>Our Bucket List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Concept: a passport. "Next up" is a travel document on security paper (guilloche + MRZ lines); completed activities become ink stamps.
   Layout: one 760px column — masthead with a three-part gauge, the document, a composer, a status/category toolbar, then the list (or a page of stamps). */
:root {
  --bg: #EFF0ED;
  --surface: #FFFFFF;
  --surface-2: #F6F7F4;
  --surface-3: #E7E9E5;
  --ink: #0F1311;
  --ink-2: #3B423E;
  --muted: #79807B;
  --faint: #A9AEAA;
  --line: #E1E3DF;
  --line-2: #D0D3CE;
  --primary: #15233F;          /* passport navy */
  --on-primary: #F4F6FA;
  --gold: #8F6E28;             /* foil, used for time */
  --done: #1D6A4D;
  --on-done: #FFFFFF;
  --danger: #B3261E;
  --danger-soft: #FAE9E7;
  --focus: #2F5BD3;
  --doc: #E7ECEE;              /* security paper */
  --doc-ink: #14213B;
  --doc-ink-2: #3E4A60;
  --doc-muted: #6A7487;
  --doc-line: #CCD5DA;
  --guill: rgba(21, 35, 63, 0.085);
  --guill-2: rgba(21, 35, 63, 0.11);
  --stamp-blend: multiply;
  --scrim: rgba(12, 16, 14, 0.34);
  --toast-bg: #121614;
  --toast-ink: #F2F4F1;
  --toast-act: #E2C27A;
  --k1: #2E56B8; --k2: #6D45B0; --k3: #B2552B; --k4: #1E7B5A; --k5: #AE3D69; --k6: #667F1E; --k7: #17809A; --k8: #5F6873;
  --shadow-1: 0 1px 2px rgba(15, 19, 17, .05), 0 1px 1px rgba(15, 19, 17, .03);
  --shadow-2: 0 14px 34px -10px rgba(15, 19, 17, .22), 0 4px 10px -4px rgba(15, 19, 17, .08);
  --shadow-3: 0 30px 80px -20px rgba(15, 19, 17, .35), 0 10px 24px -10px rgba(15, 19, 17, .15);
  --doc-shadow: 0 24px 48px -32px rgba(15, 25, 50, .35);
  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Martian Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C0F; --surface: #12151A; --surface-2: #171B21; --surface-3: #1E232A; --ink: #ECEEF0; --ink-2: #C3C8CE; --muted: #8B929B; --faint: #5D646D;
    --line: #22272E; --line-2: #2E343C; --primary: #E8EBF1; --on-primary: #10141C; --gold: #DDBB72;
    --done: #5CC89B; --on-done: #05140D; --danger: #FF8A80; --danger-soft: #331715; --focus: #8EAEFF;
    --doc: #101A2B; --doc-ink: #EEE8D9; --doc-ink-2: #C9C3B3; --doc-muted: #8D93A1; --doc-line: #243149;
    --guill: rgba(221, 187, 114, 0.085); --guill-2: rgba(221, 187, 114, 0.12); --stamp-blend: normal; --scrim: rgba(0, 0, 0, .6);
    --toast-bg: #ECEEF0; --toast-ink: #111418; --toast-act: #8F6E28;
    --k1: #86A6F5; --k2: #B99CF0; --k3: #F09A6E; --k4: #62CFA2; --k5: #F08DB4; --k6: #B9D162; --k7: #62CBE3; --k8: #9AA3AE;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .5); --shadow-2: 0 16px 40px -10px rgba(0, 0, 0, .7); --shadow-3: 0 30px 80px -20px rgba(0, 0, 0, .8);
    --doc-shadow: 0 24px 48px -28px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C0F; --surface: #12151A; --surface-2: #171B21; --surface-3: #1E232A; --ink: #ECEEF0; --ink-2: #C3C8CE; --muted: #8B929B; --faint: #5D646D;
  --line: #22272E; --line-2: #2E343C; --primary: #E8EBF1; --on-primary: #10141C; --gold: #DDBB72;
  --done: #5CC89B; --on-done: #05140D; --danger: #FF8A80; --danger-soft: #331715; --focus: #8EAEFF;
  --doc: #101A2B; --doc-ink: #EEE8D9; --doc-ink-2: #C9C3B3; --doc-muted: #8D93A1; --doc-line: #243149;
  --guill: rgba(221, 187, 114, 0.085); --guill-2: rgba(221, 187, 114, 0.12); --stamp-blend: normal; --scrim: rgba(0, 0, 0, .6);
  --toast-bg: #ECEEF0; --toast-ink: #111418; --toast-act: #8F6E28;
  --k1: #86A6F5; --k2: #B99CF0; --k3: #F09A6E; --k4: #62CFA2; --k5: #F08DB4; --k6: #B9D162; --k7: #62CBE3; --k8: #9AA3AE;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5); --shadow-2: 0 16px 40px -10px rgba(0, 0, 0, .7); --shadow-3: 0 30px 80px -20px rgba(0, 0, 0, .8);
  --doc-shadow: 0 24px 48px -28px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-ui); letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 56px 112px;
}
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- masthead ---------- */
.masthead { display: flex; flex-direction: column; gap: 14px; }
.mh-top { display: flex; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(46px, 10vw, 72px);
  line-height: .92; letter-spacing: -0.02em; margin: 0; text-wrap: balance;
}
h1 em { font-style: italic; color: var(--ink-2); }
.gauge { display: flex; gap: 3px; height: 6px; margin-top: 8px; }
.gauge i { display: block; border-radius: 3px; min-width: 6px; flex-basis: 0; transition: flex-grow .7s var(--ease); }
.gauge .g-done { background: var(--done); }
.gauge .g-plan { background: var(--gold); }
.gauge .g-todo { background: var(--line-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.legend b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

.notice { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-1); }
.notice svg { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px;
  border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 14px; white-space: nowrap; box-shadow: var(--shadow-1);
  transition: background .15s, border-color .15s, transform .12s var(--ease), box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; }
.btn.sm { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, var(--shadow-1); }
.btn.primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--surface)); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger-text { color: var(--danger); }
.btn.danger-text:hover { background: var(--danger-soft); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--muted); flex: none; transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
.kbd { font-family: var(--font-mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; line-height: 1.5; }

/* picker trigger (custom dropdown) */
.picker {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500;
  max-width: 100%; min-width: 0; transition: background .15s, border-color .15s; box-shadow: var(--shadow-1);
}
.picker:hover { background: var(--surface-2); }
.picker[aria-expanded="true"] { border-color: var(--ink-2); }
.picker .pl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.picker .pl.placeholder { color: var(--muted); font-weight: 400; }
.picker svg { width: 14px; height: 14px; color: var(--muted); margin-left: auto; }
.picker[disabled] { cursor: default; box-shadow: none; }
.picker.bare { border-color: transparent; box-shadow: none; background: transparent; padding-left: 8px; margin-left: -8px; }
.picker.bare:hover, .picker.bare[aria-expanded="true"] { background: var(--surface-2); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, transparent); flex: none; }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }

/* popover */
#pop {
  position: fixed; z-index: 60; min-width: 232px; max-width: min(320px, calc(100vw - 24px)); max-height: min(380px, 60vh); overflow: auto;
  padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-2);
  opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top left; transition: opacity .14s ease, transform .18s var(--ease);
}
#pop.in { opacity: 1; transform: none; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 9px;
  background: none; text-align: left; font-size: 14px; color: var(--ink);
}
.opt:hover, .opt:focus-visible { background: var(--surface-2); outline: none; }
.opt .ol { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .oc { font-family: var(--font-mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.opt svg { width: 15px; height: 15px; color: var(--ink); }
.opt.quiet { color: var(--ink-2); }
.opt.quiet svg { color: var(--muted); }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-head { padding: 8px 10px 6px; }
.swatches { display: grid; grid-template-columns: repeat(4, 36px); gap: 6px; padding: 6px; }
.swatch-opt { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; }
.swatch-opt::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--dot); transition: transform .15s var(--ease); }
.swatch-opt:hover, .swatch-opt:focus-visible { background: var(--surface-2); }
.swatch-opt:hover::before { transform: scale(1.12); }
.swatch-opt[aria-selected="true"]::before { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dot); }

/* ---------- the document (next up) ---------- */
.doc {
  position: relative; isolation: isolate; overflow: hidden; border-radius: 20px; background: var(--doc); color: var(--doc-ink);
  border: 1px solid var(--doc-line); box-shadow: var(--shadow-1), var(--doc-shadow);
}
.doc canvas.guill { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.doc-top { display: flex; justify-content: space-between; gap: 12px; padding: 20px 26px 0; }
.doc-top .label { color: var(--doc-muted); }
.doc-top .label b { color: var(--doc-ink); font-weight: 500; }
.doc-grid { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 26px; padding: 18px 26px 4px; align-items: start; }
.doc-date {
  border: 1px solid var(--doc-line); border-radius: 14px; text-align: center; padding: 16px 0 14px;
  background: color-mix(in srgb, var(--doc) 55%, var(--surface)); display: flex; flex-direction: column; gap: 6px;
}
.dd-day { font-family: var(--font-display); font-size: 60px; line-height: .82; letter-spacing: -0.03em; }
.dd-mon { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .24em; padding-left: .24em; }
.dd-dow { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; color: var(--doc-muted); text-transform: uppercase; }
.doc-date.tbd .dd-day { font-size: 34px; line-height: 1; color: var(--doc-muted); font-style: italic; }
.doc-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.doc h2 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 46px); line-height: 1; letter-spacing: -0.015em;
  margin: 0; text-wrap: balance; overflow-wrap: anywhere;
}
.doc p.lede { margin: 0; color: var(--doc-ink-2); font-size: 15px; overflow-wrap: anywhere; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px 22px; margin: 8px 0 0; }
.fields div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fields dt { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--doc-muted); }
.fields dd { margin: 0; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; min-width: 0; }
.fields dd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fields dd.time { color: var(--gold); }
.fields dd.late { color: var(--danger); }
.doc-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 26px 0; }
.doc .btn:not(.primary):not(.ghost) { background: color-mix(in srgb, var(--surface) 70%, transparent); border-color: var(--doc-line); color: var(--doc-ink); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.doc .btn.ghost { color: var(--doc-ink-2); }
.doc .btn.ghost:hover { background: color-mix(in srgb, var(--doc-ink) 8%, transparent); color: var(--doc-ink); }
.mrz {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.75; letter-spacing: .2em; color: var(--doc-muted);
  white-space: pre; overflow: hidden; padding: 22px 26px 18px; user-select: none; opacity: .85;
}
.doc-idle { padding: 18px 26px 0; display: flex; flex-direction: column; gap: 10px; max-width: 580px; }
.doc-idle h2 { font-size: clamp(36px, 7vw, 52px); }
.doc-idle h2 em { font-style: italic; }
.doc-idle p { margin: 0; color: var(--doc-ink-2); }

/* the stub: tear-off section holding the checklist */
.stub { position: relative; background: var(--surface); color: var(--ink); padding: 22px 26px 24px; border-top: 1.5px dashed var(--doc-line); }
.stub::before, .stub::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--doc-line); }
.stub::before { left: -11px; } .stub::after { right: -11px; }
.hero-stamp { position: absolute; right: 30px; top: 52px; z-index: 3; pointer-events: none; }

/* ---------- checklist ---------- */
.cl { display: flex; flex-direction: column; gap: 12px; }
.cl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cl-title { font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -0.01em; }
.cl-prog { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cl-bar { width: 84px; height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.cl-bar i { display: block; height: 100%; background: var(--done); border-radius: inherit; transition: width .5s var(--ease); }
.steps { list-style: none; margin: 0 -8px; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; min-height: 40px; padding: 4px 6px 4px 8px; border-radius: 10px; transition: background .12s; }
.step:hover { background: var(--surface-2); }
.sbox { width: 20px; height: 20px; padding: 0; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s, color .15s; }
.sbox svg { width: 12px; height: 12px; }
.sbox:hover { border-color: var(--done); color: color-mix(in srgb, var(--done) 55%, transparent); }
.sbox[disabled] { cursor: default; }
.step.done .sbox { background: var(--done); border-color: var(--done); color: var(--on-done); }
.stext { font-size: 14.5px; overflow-wrap: anywhere; line-height: 1.4; transition: color .2s; }
.step.done .stext { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
.claim { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 0; border-radius: 7px; background: none; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.claim:hover { background: var(--surface-3); color: var(--ink); }
.claim.on { padding: 0 3px; }
.claim .av { width: 22px; height: 22px; }
.step .claim:not(.on), .step .sdel { opacity: 0; transition: opacity .12s; }
.step:hover .claim, .step:focus-within .claim, .step:hover .sdel, .step:focus-within .sdel { opacity: 1; }
@media (hover: none) { .step .claim:not(.on), .step .sdel { opacity: 1; } }
.step-add { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line-2); border-radius: 11px; padding: 0 5px 0 12px; height: 42px; transition: border-color .15s, background .15s; }
.step-add:focus-within { border-style: solid; border-color: var(--ink-2); background: var(--surface); }
.step-add > svg { width: 15px; height: 15px; color: var(--muted); }
.step-add input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 100%; font-size: 14px; }
.step-add input::placeholder { color: var(--faint); }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; }
.idea { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); transition: background .15s, border-color .15s; }
.idea:hover { background: var(--surface); border-color: var(--line-2); color: var(--ink); }

/* ---------- composer ---------- */
.composer {
  display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 7px 7px 7px 16px; box-shadow: var(--shadow-1); transition: border-color .15s, box-shadow .2s;
}
.composer:focus-within { border-color: var(--line-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 12%, transparent), var(--shadow-1); }
.composer > svg { width: 18px; height: 18px; color: var(--muted); }
.composer input { flex: 1 1 auto; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; font-size: 16px; }
.composer input::placeholder { color: var(--faint); }
.composer .picker { flex: 0 1 auto; max-width: 180px; }
.composer:focus-within .kbd { display: none; }
@media (hover: none) { .kbd { display: none; } }
.paste { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 10px; margin-top: -16px; }
.paste-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.paste-head strong { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.paste-head span { font-size: 13px; color: var(--muted); }
.paste ol { margin: 0; padding-left: 22px; color: var(--ink-2); font-size: 14px; display: grid; gap: 2px; }
.paste ol li::marker { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }

  const CB_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="10.25"/><path class="tick" d="M7.6 12.4l3 2.9 5.9-6.2"/></svg>';

  const state = {

    filter: safeGet("bucketlist.filter") || "todo",
    catFilter: safeGet("bucketlist.cat") || "",     // "" all, "none" uncategorized, or a category id

    sheet: null, sheetConfirm: false,
    manager: false, managerReturn: null, catConfirm: null,
    dialogFresh: false,

  if (!["todo", "planned", "done", "all"].includes(state.filter)) state.filter = "todo";
  let dbNs = null, userNs = null, toastTimer = null, undoFn = null;
  const profiles = {};

  /* ---------- helpers ---------- */
  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function statusOf(x) { return x.status === "done" ? "done" : x.status === "planned" ? "planned" : "todo"; }
  function byCreated(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); }
  function byPlanned(a, b) {
    const ap = validISO(a.plannedFor), bp = validISO(b.plannedFor);
    if (ap && bp) return a.plannedFor.localeCompare(b.plannedFor) || byCreated(a, b);
    return ap ? -1 : bp ? 1 : byCreated(a, b);

  function newId() { return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function taskId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id) { return state.items.find((x) => x && x.id === id); }
  function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }

  /* ---------- categories ---------- */
  function sortedCats() {
    return state.cats.filter((c) => c && typeof c.name === "string" && c.name.trim())
      .sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
  }
  function colorIndex(c) { const n = Number(c && c.color); return n >= 1 && n <= COLORS ? Math.round(n) : COLORS; }
  function hashColor(name) { return (hash(name.toLowerCase()) % COLORS) + 1; }
  function catVar(c) { return `var(--k${c.legacy ? hashColor(c.name) : colorIndex(c)})`; }
  function catById(id) { return id ? state.cats.find((c) => c && c.id === id && typeof c.name === "string") : null; }
  function catByName(name) { const n = name.trim().toLowerCase(); return state.cats.find((c) => c && typeof c.name === "string" && c.name.trim().toLowerCase() === n); }
  // Activities point at a category by id. Older ones may still carry a plain name.
  function resolveCat(item) {
    if (!item) return null;
    if (item.categoryId) { const c = catById(item.categoryId); if (c) return c; }
    if (typeof item.category === "string" && item.category.trim()) return catByName(item.category) || { id: null, name: item.category.trim(), legacy: true };

  /* ---------- checklist ---------- */
  function tasksOf(item) {

    if (!cl || typeof cl !== "object" || Array.isArray(cl)) return [];

      .filter(([, t]) => t && typeof t === "object" && typeof t.text === "string" && t.text.trim())
      .map(([id, t]) => ({ ...t, id }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));

  /* ---------- storage: shared db when available, this browser otherwise ---------- */

  function readLocal(coll) { try { const v = JSON.parse(localStorage.getItem(LKEYS[coll])); return Array.isArray(v) ? v : null; } catch { return null; } }
  function writeLocal(coll, list, quiet) {

  /* ---------- checklist component ---------- */

  /* ---------- the document ---------- */
  function renderNext(c) {

    $("#legend").innerHTML = loading ? "&nbsp;" : `<span><i style="background:var(--done)"></i><b>${d}</b> done</span><span><i style="background:var(--gold)"></i><b>${p}</b> planned</span><span><i style="background:var(--line-2)"></i><b>${t}</b> to go</span>`;
    $("#pct").textContent = c.total ? `${Math.round((d / c.total) * 100)}% complete` : "";
    const first = c.items.reduce((m, x) => (x.createdAt && x.createdAt < m ? x.createdAt : m), Infinity);
    $("#since").textContent = isFinite(first) ? `Since ${new Date(first).toLocaleDateString(undefined, { month: "short", year: "numeric" })}` : "";

    // notice
    let n = "";
    if (state.mode === "local") n = "Saved in this browser only. Publish this page as a Claude artifact to share the list with your friend.";
    else if (state.mode === "unavailable") n = "The shared list isn't available in this view. Open it on claude.ai while signed in.";
    else if (state.mode === "db" && !state.canWrite) n = "You can view this list. To add or tick off activities, ask the owner to share it with you as an Editor.";
    $("#notice").innerHTML = n ? `${ICON.info}<span>${esc(n)}</span>` : ""; $("#notice").hidden = !n;

    // composer + paste
    $("#add-area").hidden = !state.canWrite || loading || state.mode === "unavailable";
    $("#composer-cat").innerHTML = catLabel(catById(state.composerCat), "Category") + ICON.chev;
    renderPaste();

    // toolbar
    const fil = (arr) => arr.filter(matchesCat).length;
    const counts = { todo: fil(c.by.todo), planned: fil(c.by.planned), done: fil(c.by.done) };
    counts.all = counts.todo + counts.planned + counts.done;
    $$("#tabs [data-act='tab']").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.v === state.filter)));
    $$("#tabs [data-n]").forEach((s) => (s.textContent = loading ? "" : counts[s.dataset.n]));
    syncSeg($("#tabs"));
    const fc = state.catFilter === "none" ? null : catById(state.catFilter);
    $("#filter-cat").innerHTML = (state.catFilter === "none" ? `<i class="dot hollow"></i><span class="pl">No category</span>` : fc ? catLabel(fc) : `<span class="pl">All categories</span>`) + ICON.chev;
    $("#filter-cat").hidden = loading || state.mode === "unavailable";

    renderNext(c);
    renderList(c);
    renderDialog(c);
    restoreDrafts(drafts);
    refreshPop(c);
    syncAnchors();
    fillAvatars();
  }
  function renderPaste() {
    const el = $("#paste");
    if (!state.paste || !state.paste.length) { el.hidden = true; el.innerHTML = ""; return; }
    const lines = state.paste, cat = catById(state.composerCat);
    el.hidden = false;
    el.innerHTML = `<div class="paste-head"><strong>Add ${plural(lines.length, "activity", "activities")}?</strong><span>From your paste${cat ? ` · into ${esc(cat.name)}` : ""}</span></div>
      <ol>${lines.slice(0, 6).map((l) => `<li>${esc(l)}</li>`).join("")}${lines.length > 6 ? `<li class="more">and ${lines.length - 6} more</li>` : ""}</ol>
      <div class="paste-actions"><button type="button" class="btn sm ghost" data-act="paste-cancel">Cancel</button><button type="button" class="btn sm primary" data-act="paste-add">Add all ${lines.length}</button></div>`;
  }

  /* ---------- actions ---------- */
  function baseItem(title, categoryId, i = 0) {
    return { title, categoryId: categoryId || null, category: "", notes: "", status: "todo", plannedFor: null, planNote: "", doneOn: null, doneAt: null, memory: "", createdAt: Date.now() + i, addedBy: state.me || null, doneBy: null };
  }
  async function complete(item, from) {
    const prev = { status: item.status || "todo", doneOn: item.doneOn ?? null, doneAt: item.doneAt ?? null, doneBy: item.doneBy ?? null };
    const now = Date.now();
    state.fresh.set(item.id, now);
    if (from) { state.linger.set(item.id, { from, t0: now }); setTimeout(() => { state.linger.delete(item.id); render(); }, 1100); }
    setTimeout(() => state.fresh.delete(item.id), 2000);
    render();
    if (await updateItem(item.id, { status: "done", doneOn: todayISO(), doneAt: now, doneBy: state.me || null })) {
      toast(`Ticked off “${item.title}”`, () => updateItem(item.id, prev));
    } else { state.linger.delete(item.id); state.fresh.delete(item.id); render(); }
  }
  async function uncomplete(item) {
    const prev = { status: "done", doneOn: item.doneOn ?? null, doneAt: item.doneAt ?? null, doneBy: item.doneBy ?? null };
    const back = validISO(item.plannedFor) ? "planned" : "todo";
    if (await updateItem(item.id, { status: back, doneOn: null, doneAt: null, doneBy: null })) toast(`Moved back to ${back === "planned" ? "Planned" : "To do"}`, () => updateItem(item.id, prev));
  }
  async function addTask(item, text) {
    const clean = String(text || "").trim().slice(0, 140); if (!clean) return false;
    return updateItem(item.id, { checklist: { [taskId()]: { text: clean, done: false, order: Date.now(), who: null, doneBy: null } } });
  }
  async function saveField(el) {
    const item = find(state.sheet); if (!item || !state.canWrite) return;
    const f = el.dataset.field;
    let v = el.value;
    if (f === "title") {
      v = v.replace(/\s+/g, " ").trim().slice(0, 200);
      if (!v) { el.value = item.title; grow(el); toast("An activity needs a name."); return; }
    } else if (f === "plannedFor") v = validISO(v) ? v : null;
    else if (f === "doneOn") v = validISO(v) ? v : (item.doneOn || todayISO());
    else v = v.trim();
    if ((item[f] ?? "") === (v ?? "")) return;
    el.defaultValue = v ?? "";
    await updateItem(item.id, { [f]: v });
  }
  async function saveCatName(input) {
    const id = input.dataset.catName, k = catById(id); if (!k || !state.canWrite) return;
    const name = input.value.trim().slice(0, 40);
    if (name === k.name) return;
    if (!name) { input.value = k.name; toast("A category needs a name."); return; }
    const clash = catByName(name);
    if (clash && clash.id !== id) { input.value = k.name; toast(`There's already a category called “${clash.name}”.`); return; }
    input.defaultValue = name;
    await update("categories", id, { name });
  }
  function focusKey(key) { const i = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (i) i.focus({ preventScroll: true }); }

  document.addEventListener("click", async (ev) => {
    const tgt = ev.target;
    if (!tgt.closest) return;
    if (tgt.closest("#toast-undo")) { const fn = undoFn; hideToast(); if (fn) await fn(); return; }
    if (state.pop && !tgt.closest("#pop") && !tgt.closest("[data-pop-anchor]")) closePop();
    const b = tgt.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "scrim") { if (tgt === b) closeDialog(); return; }
    ev.preventDefault();
    const id = b.dataset.id, item = id ? find(id) : null;
    const tid = b.dataset.task, task = item && tid ? tasksOf(item).find((x) => x.id === tid) : null;
    switch (act) {
      case "tab":
        state.filter = b.dataset.v; safeSet("bucketlist.filter", state.filter); render();
        if (b.closest("#next")) $("#toolbar").scrollIntoView({ behavior: "smooth", block: "start" });
        break;
      case "clear-cat": state.catFilter = ""; safeSet("bucketlist.cat", ""); render(); break;
      case "pop":
        if (state.pop && state.pop.anchor === b.dataset.popAnchor) closePop(true); else openPop(b.dataset.kind, b.dataset.popAnchor, b.dataset.cat);
        break;
      case "opt": {
        const p = state.pop, v = b.dataset.v; if (!p) break;
        closePop(true);
        if (p.kind === "composer-cat") { state.composerCat = v; render(); $("#new-title").focus(); }
        else if (p.kind === "filter-cat") { state.catFilter = v; safeSet("bucketlist.cat", v); state.suggestion = null; render(); }
        else if (p.kind === "sheet-cat") { const it = find(state.sheet); if (it) await updateItem(it.id, { categoryId: v || null, category: "" }); }
        break;
      }
      case "color": { const p = state.pop; if (!p) break; closePop(true); await update("categories", p.cat, { color: Number(b.dataset.v) }); break; }
      case "open-manager": openManager(); break;
      case "open-sheet": if (item) openSheet(id); break;
      case "close-dialog": closeDialog(); break;
      case "complete": if (item) complete(item, state.filter === "all" ? null : statusOf(item)); break;
      case "uncomplete": if (item) { state.linger.delete(id); uncomplete(item); } break;
      case "hero-done": {
        if (!item) break;
        state.heroStamp = id; state.heroT0 = Date.now();
        setTimeout(() => { if (state.heroStamp === id) { state.heroStamp = null; render(); } }, 1700);
        complete(item, null); break;
      }
      case "pick": {
        const todo = state.items.filter((x) => x && typeof x.title === "string" && statusOf(x) === "todo" && matchesCat(x));
        const pool = todo.length > 1 ? todo.filter((x) => x.id !== state.suggestion) : todo;
        state.suggestion = pool.length ? pool[Math.floor(Math.random() * pool.length)].id : null;
        render(); break;
      }
      case "clear-pick": state.suggestion = null; render(); break;
      case "plan-pick": if (item) { state.suggestion = null; if (await updateItem(id, { status: "planned" })) openSheet(id); } break;
      case "set-status": {
        const it = find(state.sheet), v = b.dataset.v; if (!it || statusOf(it) === v) break;
        const seg = b.closest(".seg"); $$("button", seg).forEach((x) => x.setAttribute("aria-checked", String(x === b))); syncSeg(seg);
        if (v === "done") { state.fresh.set(it.id, Date.now()); setTimeout(() => state.fresh.delete(it.id), 2000); await updateItem(it.id, { status: "done", doneOn: it.doneOn || todayISO(), doneAt: Date.now(), doneBy: state.me || null }); }
        else await updateItem(it.id, statusOf(it) === "done" ? { status: v, doneOn: null, doneAt: null, doneBy: null } : { status: v });
        break;
      }
      case "quick-date": {
        const input = $('#dialog-root [data-field="plannedFor"]'); if (!input) break;
        const dt = new Date();
        if (b.dataset.v === "weekend") { const day = dt.getDay(); dt.setDate(dt.getDate() + (day === 0 ? 0 : 6 - day)); input.value = iso(dt); }
        else if (b.dataset.v === "month") { dt.setMonth(dt.getMonth() + 1); input.value = iso(dt); }
        else input.value = "";
        await saveField(input); break;
      }
      case "sheet-delete": state.sheetConfirm = true; render(); break;
      case "sheet-delete-cancel": state.sheetConfirm = false; render(); break;
      case "sheet-delete-confirm": {
        if (!item) break;
        const { id: _drop, ...data } = item;
        closeDialog();
        if (state.suggestion === id) state.suggestion = null;
        if (await remove("activities", id)) toast(`Deleted “${item.title}”`, () => setDoc("activities", id, data));
        break;
      }
      case "paste-cancel": state.paste = null; render(); $("#new-title").focus(); break;
      case "paste-add": {
        const lines = state.paste || []; state.paste = null; render();
        let ok = 0;
        for (let i = 0; i < lines.length; i++) { if (await add("activities", baseItem(lines[i], state.composerCat, i))) ok++; else break; }
        if (ok) { toast(`Added ${plural(ok, "activity", "activities")}`); if (state.filter !== "all") { state.filter = "todo"; safeSet("bucketlist.filter", "todo"); render(); } }
        break;
      }

      /* checklist */
      case "task-add": {
        if (!item) break;
        const key = `task:${b.dataset.where}:${id}`, input = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
        const text = input ? input.value.trim() : "";
        if (!text) { if (input) input.focus(); break; }
        input.value = ""; input.defaultValue = "";
        if (!(await addTask(item, text))) { const i = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (i) i.value = text; }
        focusKey(key); break;
      }
      case "task-suggest": if (item) await addTask(item, b.dataset.text); break;
      case "task-toggle": if (task) await updateItem(id, { checklist: { [tid]: { done: !task.done, doneBy: !task.done ? state.me || null : null } } }); break;
      case "task-claim": if (task && state.me) await updateItem(id, { checklist: { [tid]: { who: task.who === state.me ? null : state.me } } }); break;
      case "task-del": if (task) await updateItem(id, { checklist: { [tid]: null } }); break;

      /* categories */
      case "cat-add": {
        const input = $("#cat-new"), name = input ? input.value.trim().slice(0, 40) : "";
        if (!name) { if (input) input.focus(); break; }
        const clash = catByName(name);
        if (clash) { toast(`There's already a category called “${clash.name}”.`); break; }
        const used = new Set(state.cats.map(colorIndex));
        let color = 1; while (used.has(color) && color < COLORS) color++;
        if (used.has(color)) color = (state.cats.length % COLORS) + 1;
        const order = state.cats.reduce((m, k) => Math.max(m, Number(k.order) || 0), 0) + 1;
        input.value = ""; input.defaultValue = "";
        if (!(await add("categories", { name, color, order }))) { const i = $("#cat-new"); if (i) i.value = name; }
        focusKey("cat:new"); break;
      }
      case "cat-del": state.catConfirm = b.dataset.cat; render(); break;
      case "cat-keep": state.catConfirm = null; render(); break;
      case "cat-confirm-del": {
        const cid = b.dataset.cat; state.catConfirm = null;
        if (state.catFilter === cid) { state.catFilter = ""; safeSet("bucketlist.cat", ""); }
        if (state.composerCat === cid) state.composerCat = "";
        await remove("categories", cid); render(); break;
      }
    }
  });

  document.addEventListener("keydown", (ev) => {
    const t = ev.target;
    if (ev.key === "Escape") {
      if (state.pop) { ev.preventDefault(); closePop(true); }
      else if (state.catConfirm) { state.catConfirm = null; render(); }
      else if (state.sheetConfirm) { state.sheetConfirm = false; render(); }
      else if (state.sheet || state.manager) closeDialog();
      else if (state.paste) { state.paste = null; render(); }
      return;
    }
    if (state.pop && t.closest && t.closest("#pop")) {
      const btns = $$("#pop button"), i = btns.indexOf(t);
      if (ev.key === "ArrowDown" || ev.key === "ArrowRight") { ev.preventDefault(); btns[(i + 1) % btns.length].focus(); }
      else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") { ev.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
      else if (ev.key === "Tab") closePop();
      return;
    }
    const typing = t.matches && t.matches("input, textarea, select, [contenteditable]");
    if (!typing && !ev.metaKey && !ev.ctrlKey && !ev.altKey && (ev.key === "n" || ev.key === "N") && !state.sheet && !state.manager && !$("#add-area").hidden) {
      ev.preventDefault(); $("#new-title").focus(); return;
    }
    if (ev.key !== "Enter" || !t.matches) return;
    if (t.matches("[data-key^='task:']")) { ev.preventDefault(); const btn = t.parentElement.querySelector("[data-act='task-add']"); if (btn) btn.click(); }
    else if (t.id === "cat-new") { ev.preventDefault(); const btn = $("[data-act='cat-add']"); if (btn) btn.click(); }
    else if (t.matches("[data-cat-name], .title-input, input.fp")) { ev.preventDefault(); t.blur(); }
  });
  document.addEventListener("change", (ev) => { if (ev.target.matches && ev.target.matches("#dialog-root [data-field]")) saveField(ev.target); });
  document.addEventListener("focusout", (ev) => { if (ev.target.matches && ev.target.matches("[data-cat-name]")) saveCatName(ev.target); });
  document.addEventListener("input", (ev) => { if (ev.target.classList && ev.target.classList.contains("autogrow")) grow(ev.target); });
  document.addEventListener("scroll", () => placePop(), true);
  addEventListener("resize", () => { placePop(); $$(".seg").forEach(syncSeg); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { $$(".seg").forEach(syncSeg); redrawAll(); });

  $("#composer").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const inp = $("#new-title"), title = inp.value.replace(/\s+/g, " ").trim();
    if (!title) { inp.focus(); return; }
    inp.value = "";
    if (await add("activities", baseItem(title.slice(0, 200), state.composerCat))) {
      if (state.filter === "planned" || state.filter === "done") { state.filter = "todo"; safeSet("bucketlist.filter", "todo"); render(); }
    } else inp.value = title;
    inp.focus();
  });
  $("#new-title").addEventListener("paste", (ev) => {
    const text = (ev.clipboardData && ev.clipboardData.getData("text")) || "";
    const lines = text.split(/\r?\n/).map(cleanLine).filter(Boolean).map((l) => l.slice(0, 200));
    if (lines.length < 2) return;
    ev.preventDefault(); state.paste = lines; renderPaste();
  });

  /* ---------- boot ---------- */
  function startLocal() {
    state.mode = "local";
    let cats = readLocal("categories");
    if (!cats) cats = LOCAL_STARTER_CATS.map(([name, color], i) => ({ id: newId(), name, color, order: i + 1 }));
    let items = readLocal("activities") || [];
    // Move older free-text categories onto the category list.
    items = items.map((it) => {
      if (it.categoryId || !it.category || !String(it.category).trim()) return it;
      const name = String(it.category).trim();
      let k = cats.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!k) { k = { id: newId(), name, color: (cats.length % COLORS) + 1, order: cats.length + 1 }; cats.push(k); }
      return { ...it, categoryId: k.id, category: "" };
    });
    state.catsLoaded = true;
    writeLocal("categories", cats, true);
    writeLocal("activities", items, true);
    render();
  }
  function subscribe(coll, onData, retried) {
    dbNs.collection(coll).onSnapshot((snap) => onData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), (err) => {
      if (err && err.code === "unavailable" && !retried) { setTimeout(() => subscribe(coll, onData, true), 2000); return; }
      if (err && err.code === "revoked") { state.canWrite = false; render(); return; }
      toast("Lost the connection to your shared list. Reload the page to reconnect.");
    });
  }
  async function boot() {
    render();
    if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    userNs = user;
    if (!db) { state.mode = "unavailable"; state.canWrite = false; render(); return; }
    if (user) {
      state.me = await user.id();
      if ((await user.can("data.write")) === false) state.canWrite = false;
    }
    dbNs = db;
    subscribe("categories", (list) => { state.cats = list; state.catsLoaded = true; render(); });
    subscribe("activities", (list) => { state.items = list; if (state.mode === "loading") state.mode = "db"; render(); });
  }
  boot();
})();
</script>
