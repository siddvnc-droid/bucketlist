<title>Our Bucket List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 720px column — header with progress ring, a "next up" card with a calendar tile and its planning checklist, then one panel holding add bar, filters, category manager and list. Amber is the single accent; green only means done; --c1..--c8 are category dots. */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --surface-2: #F1F3F6;
  --ink: #121721;
  --ink-2: #3A4250;
  --muted: #6B7380;
  --line: #E3E6EB;
  --line-strong: #CDD2DA;
  --accent: #EBA21A;
  --accent-soft: #FDF2DC;
  --accent-ink: #7A4E00;
  --on-accent: #3D2800;
  --done: #16835A;
  --done-soft: #E2F3EB;
  --on-done: #FFFFFF;
  --danger: #C4321F;
  --danger-soft: #FCEAE7;
  --on-danger: #FFFFFF;
  --focus: #3B6FE0;
  --c1: #3B6FE0; --c2: #8B4FD8; --c3: #D9541A; --c4: #0D9A72; --c5: #D6407A; --c6: #6E8F1A; --c7: #0E8FB0; --c8: #6B7380;
  --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .07);
  --shadow-pop: 0 10px 30px rgb(16 24 40 / .14), 0 2px 6px rgb(16 24 40 / .08);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --surface: #151B23; --surface-2: #1C232D; --ink: #E8ECF1; --ink-2: #C2C9D2; --muted: #8C96A3;
    --line: #262E39; --line-strong: #364050; --accent: #F2B13A; --accent-soft: #33270F; --accent-ink: #F5C86E; --on-accent: #2A1B00;
    --done: #3FC48A; --done-soft: #12291E; --on-done: #05200F; --danger: #FF7B6B; --danger-soft: #3A1A16; --on-danger: #2A0A06;
    --focus: #7EA2FF; --c1: #7EA2FF; --c2: #B88CF5; --c3: #FF8A57; --c4: #3CCB9E; --c5: #F27CA8; --c6: #A9C94A; --c7: #4FC6E6; --c8: #8C96A3;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-pop: 0 12px 32px rgb(0 0 0 / .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #151B23; --surface-2: #1C232D; --ink: #E8ECF1; --ink-2: #C2C9D2; --muted: #8C96A3;
  --line: #262E39; --line-strong: #364050; --accent: #F2B13A; --accent-soft: #33270F; --accent-ink: #F5C86E; --on-accent: #2A1B00;
  --done: #3FC48A; --done-soft: #12291E; --on-done: #05200F; --danger: #FF7B6B; --danger-soft: #3A1A16; --on-danger: #2A0A06;
  --focus: #7EA2FF; --c1: #7EA2FF; --c2: #B88CF5; --c3: #FF8A57; --c4: #3CCB9E; --c5: #F27CA8; --c6: #A9C94A; --c7: #4FC6E6; --c8: #8C96A3;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-pop: 0 12px 32px rgb(0 0 0 / .5); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 72px;
}
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg { flex: none; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 8px; }
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.05; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.summary { margin: 0; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink-2); font-weight: 600; }
.ring { position: relative; width: 60px; height: 60px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .fill { stroke: var(--done); transition: stroke-dashoffset .6s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; font-variant-numeric: tabular-nums; }

/* ---------- shared surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 0.82rem; color: var(--muted); }

.notice { display: flex; gap: 10px; align-items: flex-start; font-size: 0.875rem; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.notice svg { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 0.875rem; white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }
.btn.sm { height: 32px; padding: 0 12px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.success { background: var(--done); border-color: var(--done); color: var(--on-done); }
.btn.success:hover { filter: brightness(1.06); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--muted); flex: none; }
.icon-btn:hover, .icon-btn[aria-expanded="true"], .icon-btn[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.sm { width: 28px; height: 28px; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
.text-btn { border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 500; font-size: 0.85rem; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.text-btn:hover { color: var(--ink); text-decoration-color: currentColor; }

/* ---------- form fields ---------- */
.field {
  width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); min-width: 0; transition: border-color .12s, box-shadow .12s;
}
.field.sm { height: 32px; font-size: 0.875rem; padding: 0 10px; }
.field::placeholder { color: var(--muted); }
.field:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
select.field { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer; text-overflow: ellipsis; }
.select-wrap { position: relative; min-width: 0; }
.select-wrap > svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
.select-wrap .dot { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: var(--dot, transparent); pointer-events: none; }
.select-wrap select.field { padding-right: 34px; }
.select-wrap.has-dot select { padding-left: 28px; }
.editor .select-wrap { display: block; }
textarea.field { height: auto; min-height: 132px; padding: 10px 12px; resize: vertical; line-height: 1.55; }

/* ---------- next up ---------- */
.next { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
.cal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: center; background: var(--surface); }
.cal-mon { background: var(--accent); color: var(--on-accent); font-size: 0.7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 4px 0; }
.cal-day { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; padding: 10px 0 4px; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.cal-dow { font-size: 0.72rem; color: var(--muted); padding-bottom: 8px; }
.cal.tbd .cal-day { font-size: 1.1rem; padding: 16px 0 12px; color: var(--muted); }
.next-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.next-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.next h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.35rem, 4vw, 1.65rem); line-height: 1.15; letter-spacing: -0.015em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.next p { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--accent-soft); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.pill.late { background: var(--danger-soft); color: var(--danger); }
.next .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.next.empty { grid-template-columns: 44px minmax(0, 1fr); align-items: center; }
.empty-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.empty-icon svg { width: 22px; height: 22px; }
.next.empty .row { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.next.empty p { color: var(--muted); }
.next .editor { grid-column: 1 / -1; margin: 4px 0 0; }
.next-cl { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 16px; }

/* ---------- planning checklist ---------- */
.checklist { display: flex; flex-direction: column; gap: 10px; }
.cl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cl-count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cl-bar { flex: 0 1 120px; height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
.cl-bar i { display: block; height: 100%; background: var(--done); border-radius: inherit; transition: width .3s ease; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; align-items: center; gap: 4px 10px; padding: 5px 4px 5px 2px; border-radius: 8px; min-height: 36px; }
.task:hover { background: var(--surface-2); }
.tcheck { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; color: transparent; padding: 0; transition: all .12s; }
.tcheck:hover { border-color: var(--done); color: var(--done); }
.tcheck svg { width: 11px; height: 11px; }
.tcheck[disabled] { cursor: default; }
.task.done .tcheck { background: var(--done); border-color: var(--done); color: var(--on-done); }
.ttext { font-size: 0.92rem; overflow-wrap: anywhere; line-height: 1.4; }
.task.done .ttext { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.claim { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; font-size: 0.78rem; font-weight: 500; color: var(--muted); height: 26px; padding: 0 8px; border-radius: 6px; white-space: nowrap; }
.claim:hover { background: var(--surface); color: var(--ink); }
.claim.on { padding: 0 4px; }
.claim .av { width: 20px; height: 20px; }
.task .claim:not(.on), .task .tdel { opacity: 0; transition: opacity .12s; }
.task:hover .claim, .task:focus-within .claim, .task:hover .tdel, .task:focus-within .tdel { opacity: 1; }
@media (hover: none) { .task .claim:not(.on), .task .tdel { opacity: 1; } }
.task-add { display: flex; gap: 8px; }
.task-add .field { flex: 1 1 auto; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px dashed var(--line-strong); background: transparent; border-radius: 999px; height: 28px; padding: 0 11px; font-size: 0.8rem; color: var(--ink-2); }
.chip:hover { border-style: solid; background: var(--surface-2); color: var(--ink); }

/* ---------- panel: add + filter + list ---------- */
.add { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; }
.input-wrap { position: relative; flex: 3 1 260px; min-width: 0; }
.input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.input-wrap .field { padding-left: 36px; }
#new-cat-wrap { flex: 1 1 170px; }
.add-row .btn { height: 38px; }
.add-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; min-height: 22px; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 7px; font-size: 0.85rem; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg .n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; gap: 6px; min-width: 0; }
#cat-filter-wrap { width: 190px; }

/* category manager */
.cat-manager { padding: 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; gap: 12px; }
.cm-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.cm-head strong { display: block; font-weight: 600; }
.cm-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 16px; }
.cm-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 6px; align-items: center; }
.dot-btn { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
.dot-btn::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
.dot-btn:hover { background: var(--surface); }
.dot-btn[disabled] { cursor: default; background: transparent; }
.cm-count { font-size: 0.78rem; color: var(--muted); min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }
.cm-confirm { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.85rem; color: var(--ink-2); padding: 4px 0 6px 34px; }
.cm-add { display: flex; gap: 8px; max-width: 420px; }

/* list */
.list { list-style: none; margin: 0; padding: 0; }
.item {
  position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 2px 14px; align-items: start;
  padding: 14px 12px 14px 16px; border-top: 1px solid var(--line); transition: background .12s;
}
.item:first-child { border-top: 0; }
.item:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.list > .item:last-child { border-radius: 0 0 14px 14px; }
.check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface);
  display: grid; place-items: center; padding: 0; margin-top: 1px; color: transparent; transition: all .12s;
}
.check svg { width: 12px; height: 12px; }
.check:hover { border-color: var(--done); color: var(--done); background: var(--done-soft); }
.item.done .check { background: var(--done); border-color: var(--done); color: var(--on-done); }
.check[disabled] { cursor: default; }
.body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.title { font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
.item.done .title { color: var(--ink-2); }
.notes { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.memory { color: var(--ink-2); font-size: 0.875rem; overflow-wrap: anywhere; white-space: pre-wrap; padding-left: 10px; border-left: 2px solid var(--done-soft); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 0.8rem; color: var(--muted); }
.cat { display: inline-flex; align-items: center; gap: 6px; }
.cat i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--c8)); }
.when { display: inline-flex; align-items: center; gap: 5px; color: var(--accent-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.when svg { width: 13px; height: 13px; }
.when.late { color: var(--danger); }
.cl-chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; height: 22px; padding: 0 7px; font-size: 0.78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cl-chip svg { width: 12px; height: 12px; }
.cl-chip:hover, .cl-chip[aria-expanded="true"] { border-color: var(--line-strong); color: var(--ink); }
.cl-chip.complete { color: var(--done); }
.av { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; background: var(--line); }
.side { display: flex; align-items: center; gap: 6px; }
.quick { opacity: 0; transition: opacity .12s; height: 30px; padding: 0 10px; }
.item:hover .quick, .item:focus-within .quick { opacity: 1; }
@media (hover: none) { .quick { display: none; } }
.stamp {
  font-family: var(--font-mono); font-weight: 600; font-size: 0.66rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--done); border: 1.5px solid var(--done); border-radius: 5px; padding: 2px 7px; transform: rotate(-4deg);
  white-space: nowrap; font-variant-numeric: tabular-nums; margin-right: 4px;
}
.stamp.fresh { animation: thunk .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes thunk { from { transform: rotate(-16deg) scale(1.8); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }
.item-cl { grid-column: 2 / -1; margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }

/* row menu */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 15; min-width: 184px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column;
}
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font-size: 0.875rem; color: var(--ink); }
.menu button svg { width: 15px; height: 15px; color: var(--muted); }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.menu .danger, .menu .danger svg { color: var(--danger); }

/* inline editor */
.editor {
  grid-column: 2 / -1; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; padding: 14px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
}
.editor label { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; font-weight: 500; color: var(--ink-2); }
.editor .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.editor .btns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.editor .hint { margin-right: auto; align-self: center; }
.editor p { margin: 0; color: var(--ink-2); }

.empty-state { text-align: center; padding: 44px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 0.9rem; }
.empty-state strong { color: var(--ink); font-weight: 600; font-size: 1rem; }
.skeleton { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.skeleton i { display: block; height: 14px; border-radius: 6px; background: var(--surface-2); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 0.875rem;
  max-width: min(92vw, 520px); box-shadow: var(--shadow-pop);
}

@media (max-width: 560px) {
  body { padding-block: 24px 64px; }
  .next { grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 16px; }
  .next .actions .btn { flex: 1 1 auto; justify-content: center; }
  .item { padding: 14px 8px 14px 14px; gap: 2px 12px; }
  .item-cl { grid-column: 1 / -1; }
  .stamp { display: none; }
  .input-wrap { flex: 1 1 100%; }
  #new-cat-wrap { flex: 1 1 0; }
  .add-row .btn { flex: 0 0 auto; }
  .toolbar { padding: 10px 12px; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 0; justify-content: center; padding: 0 6px; }
  .tools { width: 100%; }
  #cat-filter-wrap { flex: 1 1 auto; width: auto; }
  .cat-manager { padding: 14px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Our Bucket List</h1>
      <p class="summary" id="summary">Loading…</p>
    </div>
    <div class="ring" id="ring" role="img" aria-label="0% done">
      <svg viewBox="0 0 60 60" aria-hidden="true"><circle class="track" cx="30" cy="30" r="25" fill="none" stroke-width="5"/><circle class="fill" id="ring-fill" cx="30" cy="30" r="25" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="157.08" stroke-dashoffset="157.08"/></svg>
      <span id="ring-pct">0%</span>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="next" aria-label="Next up"></section>

  <section class="card panel" aria-label="Activities">
    <form id="add" class="add" autocomplete="off" hidden>
      <div class="add-row" id="single-row">
        <div class="input-wrap">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          <input id="new-title" class="field" placeholder="Add an activity, e.g. See the northern lights" aria-label="Activity" maxlength="200">
        </div>
        <div class="select-wrap has-dot" id="new-cat-wrap">
          <i class="dot" id="new-cat-dot"></i>
          <select id="new-cat" class="field" aria-label="Category"><option value="">No category</option></select>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </div>
        <button class="btn primary" type="submit">Add</button>
      </div>
      <div id="bulk-row" hidden>
        <textarea id="bulk-text" class="field" aria-label="Paste your list" placeholder="Paste your list here, one activity per line.&#10;Bullets and numbers are removed for you."></textarea>
      </div>
      <div class="add-foot">
        <button type="button" class="text-btn" id="toggle-bulk">Paste a whole list</button>
        <span class="hint" id="bulk-hint" hidden></span>
        <button type="button" class="btn primary" id="bulk-add" hidden>Add all</button>
      </div>
    </form>
    <div class="toolbar">
      <div class="seg" role="tablist" id="tabs" aria-label="Filter by status"></div>
      <div class="tools">
        <div class="select-wrap has-dot" id="cat-filter-wrap">
          <i class="dot" id="cat-filter-dot"></i>
          <select id="cat-filter" class="field sm" aria-label="Filter by category"><option value="">All categories</option></select>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
        </div>
        <button type="button" class="icon-btn" id="manage-btn" data-act="manage" aria-pressed="false" aria-label="Manage categories" title="Manage categories">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.6V4a1 1 0 011-1h6.6a1 1 0 01.7.3l5.4 5.4a1 1 0 010 1.4l-6.6 6.6a1 1 0 01-1.4 0L3.3 11.3a1 1 0 01-.3-.7z"/><circle cx="7" cy="7" r="1.3"/></svg>
        </button>
      </div>
    </div>
    <div id="cats-panel"></div>
    <ul class="list" id="list"></ul>
    <div id="list-empty" class="empty-state" hidden></div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const LKEYS = { activities: "bucketlist.items.v1", categories: "bucketlist.categories.v1" };
  // Starter categories for the browser-only copy. The shared list keeps its categories in the database.
  const LOCAL_STARTER_CATS = [["Travel", 1], ["Food and Drinks", 3], ["Outdoors", 4], ["Adventure", 2], ["Culture & Events", 5], ["Learn Something", 7], ["Just for Fun", 6]];
  const STEP_IDEAS = ["Pick a date", "Set a budget", "Book tickets", "Book a place to stay", "Book time off", "Pack"];
  const COLORS = 8;
  const ICON = {
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
    dots: '<svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="4.5" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="15.5" cy="10" r="1.6"/></svg>',
    cal: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></svg>',
    list: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5l1.2 1.2L6 3.5M2.5 10.5l1.2 1.2L6 9.5M8.5 4.8h5M8.5 10.8h5"/></svg>',
    edit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3L6 13H3v-3z"/></svg>',
    trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4 4.5l.7 9h6.6l.7-9"/></svg>',
    undo: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3L2 6l3 3"/><path d="M2 6h7.5a4 4 0 010 8H6"/></svg>',
    x: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    dice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 01-8 0zM8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8.5 20h7"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.2V11M8 5v.01"/></svg>',
  };

  const state = {
    mode: "loading",        // loading | db | local | unavailable
    items: [],
    cats: [],
    catsLoaded: false,
    canWrite: true,
    me: null,
    filter: safeGet("bucketlist.filter") || "todo",
    catFilter: safeGet("bucketlist.cat") || "",   // "" all, "none" uncategorized, or a category id
    editor: null,            // { id, kind: plan|done|edit|delete, where: hero|list }
    menu: null,              // id of the row whose menu is open
    expanded: new Set(),     // planned rows with their checklist open
    managing: false,         // category manager open
    catConfirm: null,        // category id awaiting delete confirmation
    suggestion: null,        // id picked by "Pick one for us"
    fresh: new Set(),        // ids just marked done (stamp animation)
  };
  let dbNs = null, userNs = null;
  const profiles = {};

  /* ---------- helpers ---------- */
  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function validISO(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function daysUntil(s) { return Math.round((parseISO(s) - parseISO(todayISO())) / 86400000); }
  function fmtDate(s, withDay) {
    const d = parseISO(s), sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString(undefined, { weekday: withDay ? "short" : undefined, day: "numeric", month: "short", year: sameYear ? undefined : "numeric" });
  }
  function countdown(s) {
    const n = daysUntil(s);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    return n > 0 ? `In ${n} days` : `${-n} days ago`;
  }
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4200);
  }
  function cleanLine(l) { return l.replace(/^\s*(?:[-*•–]|\d+[.)]|\[[ xX]?\])\s*/, "").replace(/^\[[ xX]?\]\s*/, "").trim(); }
  function byCreated(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); }
  function byPlanned(a, b) {
    const ap = validISO(a.plannedFor), bp = validISO(b.plannedFor);
    if (ap && bp) return a.plannedFor.localeCompare(b.plannedFor) || byCreated(a, b);
    return ap ? -1 : bp ? 1 : byCreated(a, b);
  }
  function byDone(a, b) { return String(b.doneOn || "").localeCompare(String(a.doneOn || "")) || (b.doneAt || 0) - (a.doneAt || 0); }
  function newId() { return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function taskId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- categories ---------- */
  function sortedCats() {
    return state.cats.filter((c) => c && typeof c.name === "string" && c.name.trim())
      .sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
  }
  function colorIndex(c) { const n = Number(c && c.color); return n >= 1 && n <= COLORS ? Math.round(n) : COLORS; }
  function hashColor(name) { let h = 0; for (const ch of name.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return (h % COLORS) + 1; }
  function catVar(c) { return `var(--c${c.legacy ? hashColor(c.name) : colorIndex(c)})`; }
  function catByName(name) { const n = name.trim().toLowerCase(); return state.cats.find((c) => c && typeof c.name === "string" && c.name.trim().toLowerCase() === n); }
  // Activities point at a category by id. Older ones may still carry a plain name.
  function resolveCat(item) {
    if (item.categoryId) { const c = state.cats.find((x) => x && x.id === item.categoryId); if (c && typeof c.name === "string") return c; }
    if (typeof item.category === "string" && item.category.trim()) return catByName(item.category) || { id: null, name: item.category.trim(), legacy: true };
    return null;
  }
  function matchesCat(item) {
    if (!state.catFilter) return true;
    const c = resolveCat(item);
    return state.catFilter === "none" ? !c : !!c && c.id === state.catFilter;
  }

  /* ---------- checklist ---------- */
  function tasksOf(item) {
    const cl = item.checklist;
    if (!cl || typeof cl !== "object" || Array.isArray(cl)) return [];
    return Object.entries(cl)
      .filter(([, t]) => t && typeof t === "object" && typeof t.text === "string" && t.text.trim())
      .map(([id, t]) => ({ ...t, id }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));
  }

  /* ---------- storage: shared db when available, this browser otherwise ---------- */
  function listOf(coll) { return coll === "activities" ? state.items : state.cats; }
  function readLocal(coll) { try { const v = JSON.parse(localStorage.getItem(LKEYS[coll])); return Array.isArray(v) ? v : null; } catch { return null; } }
  function writeLocal(coll, list, quiet) {
    try { localStorage.setItem(LKEYS[coll], JSON.stringify(list)); } catch {}
    if (coll === "activities") state.items = list; else state.cats = list;
    if (!quiet) render();
  }
  // Same rule as the shared store: nested objects merge, everything else replaces.
  function merge(a, b) {
    const out = { ...a };
    for (const [k, v] of Object.entries(b)) {
      const cur = out[k];
      out[k] = v && typeof v === "object" && !Array.isArray(v) && cur && typeof cur === "object" && !Array.isArray(cur) ? merge(cur, v) : v;
    }
    return out;
  }

  async function guarded(fn) {
    if (!state.canWrite) { toast("You can view this list but not change it."); return false; }
    try { await fn(); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === "unavailable") {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        try { await fn(); return true; } catch {}
        toast("Couldn't save just now. Check your connection and try again.");
      } else if (code === "invalid_argument") {
        state.canWrite = false; render();
        toast("You can view this list but not change it. Ask the owner to share it with you as an Editor.");
      } else if (code === "quota_exceeded") {
        toast("The list is full. Delete a few old activities to make room.");
      } else {
        toast("Couldn't save that change. Try again in a moment.");
      }
      return false;
    }
  }
  function add(coll, data) {
    return guarded(async () => {
      if (dbNs) await dbNs.collection(coll).add(data);
      else writeLocal(coll, [...listOf(coll), { id: newId(), ...data }]);
    });
  }
  function update(coll, id, patch) {
    return guarded(async () => {
      if (dbNs) await dbNs.collection(coll).doc(id).update(patch);
      else writeLocal(coll, listOf(coll).map((x) => (x.id === id ? merge(x, patch) : x)));
    });
  }
  function remove(coll, id) {
    return guarded(async () => {
      if (dbNs) await dbNs.collection(coll).doc(id).delete();
      else writeLocal(coll, listOf(coll).filter((x) => x.id !== id));
    });
  }

  /* ---------- people ---------- */
  function avatar(uid, fmt) {
    if (!uid || !userNs) return "";
    const p = profiles[uid];
    const label = p && p.name ? fmt.replace("{name}", p.name) : "";
    return `<img class="av" data-uid="${esc(uid)}" data-fmt="${esc(fmt)}" alt="${esc(label)}" title="${esc(label)}"${p ? ` src="${esc(p.avatarUrl)}"` : ""}>`;
  }
  async function fillAvatars() {
    if (!userNs) return;
    const ids = [...new Set([...document.querySelectorAll("img.av[data-uid]")].map((i) => i.dataset.uid))];
    if (!ids.length) return;
    const ps = await userNs.profiles(ids);
    Object.assign(profiles, ps);
    for (const img of document.querySelectorAll("img.av[data-uid]")) {
      const p = ps[img.dataset.uid]; if (!p) continue;
      img.src = p.avatarUrl;
      const label = p.name ? img.dataset.fmt.replace("{name}", p.name) : "";
      img.alt = label; img.title = label;
    }
  }

  /* ---------- rendering ---------- */
  function catOptions(selectedId, noneLabel) {
    return `<option value="">${esc(noneLabel)}</option>` + sortedCats().map((c) => `<option value="${esc(c.id)}"${c.id === selectedId ? " selected" : ""}>${esc(c.name)}</option>`).join("");
  }

  function editorHTML(item, kind) {
    const id = esc(item.id);
    const cancel = `<button type="button" class="btn ghost" data-act="cancel">Cancel</button>`;
    if (kind === "plan") return `
      <div class="editor" data-editor="${id}">
        <div class="grid">
          <label>Date<input type="date" class="field" name="date" value="${esc(item.plannedFor || "")}" min="${todayISO()}"></label>
          <label>Plan notes<input class="field" name="planNote" maxlength="200" placeholder="Where, who books what…" value="${esc(item.planNote || "")}"></label>
        </div>
        <div class="btns"><span class="hint">No date yet? Leave it empty.</span>${cancel}<button type="button" class="btn primary" data-act="save-plan" data-id="${id}">Save plan</button></div>
      </div>`;
    if (kind === "done") {
      const def = item.doneOn || (validISO(item.plannedFor) && daysUntil(item.plannedFor) <= 0 ? item.plannedFor : todayISO());
      return `
      <div class="editor" data-editor="${id}">
        <div class="grid">
          <label>Done on<input type="date" class="field" name="date" value="${esc(def)}" max="${todayISO()}"></label>
          <label>How was it?<input class="field" name="memory" maxlength="300" placeholder="A line to remember it by (optional)" value="${esc(item.memory || "")}"></label>
        </div>
        <div class="btns">${cancel}<button type="button" class="btn success" data-act="save-done" data-id="${id}">${ICON.check} Mark as done</button></div>
      </div>`;
    }
    if (kind === "edit") {
      const c = resolveCat(item);
      return `
      <div class="editor" data-editor="${id}">
        <div class="grid">
          <label>Activity<input class="field" name="title" maxlength="200" value="${esc(item.title)}"></label>
          <label>Category
            <span class="select-wrap"><select class="field" name="categoryId">${catOptions(c && c.id, "No category")}</select>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></span>
          </label>
        </div>
        <label>Notes<input class="field" name="notes" maxlength="500" placeholder="Ideas, links, costs…" value="${esc(item.notes || "")}"></label>
        ${item.status === "done" ? `<label>How was it?<input class="field" name="memory" maxlength="300" value="${esc(item.memory || "")}"></label>` : ""}
        <div class="btns">${cancel}<button type="button" class="btn primary" data-act="save-edit" data-id="${id}">Save changes</button></div>
      </div>`;
    }
    if (kind === "delete") return `
      <div class="editor" data-editor="${id}">
        <p>Delete “${esc(item.title)}”? It disappears for both of you.</p>
        <div class="btns"><button type="button" class="btn ghost" data-act="cancel">Keep it</button><button type="button" class="btn danger" data-act="confirm-delete" data-id="${id}">Delete</button></div>
      </div>`;
    return "";
  }
  function editorFor(item, where) {
    const e = state.editor;
    return e && e.id === item.id && e.where === where ? editorHTML(item, e.kind) : "";
  }

  function taskHTML(item, t) {
    const w = state.canWrite, id = esc(item.id), tid = esc(t.id);
    let claim = "";
    if (userNs && state.me) {
      if (t.who) {
        const mine = t.who === state.me;
        const av = avatar(t.who, mine ? "You're on it" : "{name} is on it");
        claim = w ? `<button type="button" class="claim on" data-act="task-claim" data-id="${id}" data-task="${tid}" aria-label="${mine ? "Unassign yourself" : "Take this step over"}">${av}</button>` : `<span class="claim on">${av}</span>`;
      } else if (w) {
        claim = `<button type="button" class="claim" data-act="task-claim" data-id="${id}" data-task="${tid}">I'll do it</button>`;
      }
    }
    return `
      <li class="task${t.done ? " done" : ""}">
        <button type="button" class="tcheck" ${w ? "" : "disabled"} data-act="task-toggle" data-id="${id}" data-task="${tid}" aria-pressed="${!!t.done}" aria-label="${t.done ? "Mark step not done" : "Mark step done"}: ${esc(t.text)}">${ICON.check}</button>
        <span class="ttext">${esc(t.text)}</span>
        ${claim || "<span></span>"}
        ${w ? `<button type="button" class="icon-btn sm danger tdel" data-act="task-del" data-id="${id}" data-task="${tid}" aria-label="Remove step: ${esc(t.text)}">${ICON.x}</button>` : "<span></span>"}
      </li>`;
  }

  function checklistHTML(item, where) {
    const w = state.canWrite, id = esc(item.id);
    const tasks = tasksOf(item), done = tasks.filter((t) => t.done).length;
    const have = new Set(tasks.map((t) => t.text.trim().toLowerCase()));
    const ideas = STEP_IDEAS.filter((s) => !have.has(s.toLowerCase()) && !(s === "Pick a date" && validISO(item.plannedFor)));
    if (!w && !tasks.length) return "";
    return `
      <div class="checklist">
        <div class="cl-head">
          <span class="eyebrow">Planning checklist</span>
          ${tasks.length ? `<span class="cl-count">${done} of ${tasks.length} done</span><span class="cl-bar" aria-hidden="true"><i style="width:${Math.round((done / tasks.length) * 100)}%"></i></span>` : ""}
        </div>
        ${tasks.length ? `<ul class="tasks">${tasks.map((t) => taskHTML(item, t)).join("")}</ul>` : ""}
        ${w ? `<div class="task-add">
          <input class="field sm" data-key="task:${where}:${id}" maxlength="140" placeholder="${tasks.length ? "Add another step" : "Add a step, e.g. Book flights"}" aria-label="Add a step to ${esc(item.title)}">
          <button type="button" class="btn sm" data-act="task-add" data-id="${id}" data-where="${where}">Add</button>
        </div>` : ""}
        ${w && tasks.length < 3 && ideas.length ? `<div class="suggest"><span class="hint">Quick add:</span>${ideas.slice(0, 5).map((s) => `<button type="button" class="chip" data-act="task-suggest" data-id="${id}" data-text="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>` : ""}
      </div>`;
  }

  function calTile(iso) {
    if (!validISO(iso)) return `<div class="cal tbd" aria-label="Date to be decided"><div class="cal-mon">Date</div><div class="cal-day">TBD</div></div>`;
    const d = parseISO(iso);
    const yr = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : "";
    return `<div class="cal" aria-label="${esc(fmtDate(iso, true))}"><div class="cal-mon">${esc(d.toLocaleDateString(undefined, { month: "short" }))}${yr}</div><div class="cal-day">${d.getDate()}</div><div class="cal-dow">${esc(d.toLocaleDateString(undefined, { weekday: "short" }))}</div></div>`;
  }

  function renderNext(todo, planned, total) {
    const el = $("#next");
    const w = state.canWrite;
    if (state.mode === "loading") { el.innerHTML = `<div class="card next empty"><div class="empty-icon">${ICON.flag}</div><div class="next-body"><span class="eyebrow">Next up</span><p>Loading your list…</p></div></div>`; return; }
    const next = planned[0];
    if (next) {
      const dated = validISO(next.plannedFor);
      const late = dated && daysUntil(next.plannedFor) < 0;
      const more = planned.length - 1;
      const cl = checklistHTML(next, "hero");
      el.innerHTML = `
        <div class="card next">
          ${calTile(next.plannedFor)}
          <div class="next-body">
            <div class="next-head"><span class="eyebrow">Next up</span>${dated ? `<span class="pill${late ? " late" : ""}">${countdown(next.plannedFor)}</span>` : ""}</div>
            <h2>${esc(next.title)}</h2>
            ${next.planNote ? `<p>${esc(next.planNote)}</p>` : ""}
            ${late ? `<p>That date has passed. Did you go?</p>` : ""}
            ${w ? `<div class="actions">
              <button type="button" class="btn success" data-act="open" data-kind="done" data-where="hero" data-id="${esc(next.id)}">${ICON.check} We did it</button>
              <button type="button" class="btn" data-act="open" data-kind="plan" data-where="hero" data-id="${esc(next.id)}">${ICON.cal} ${dated ? "Change date" : "Pick a date"}</button>
              <button type="button" class="btn ghost" data-act="unplan" data-id="${esc(next.id)}">Unplan</button>
            </div>` : ""}
            ${more > 0 ? `<button type="button" class="text-btn" data-act="filter" data-filter="planned" style="align-self:flex-start;margin-top:6px">${more} more planned</button>` : ""}
          </div>
          ${editorFor(next, "hero")}
          ${cl ? `<div class="next-cl">${cl}</div>` : ""}
        </div>`;
      return;
    }
    const sug = state.suggestion && todo.find((x) => x.id === state.suggestion);
    if (sug) {
      const fc = state.catFilter && state.catFilter !== "none" ? state.cats.find((c) => c.id === state.catFilter) : null;
      el.innerHTML = `
        <div class="card next">
          <div class="cal tbd"><div class="cal-mon">Pick</div><div class="cal-day" style="color:var(--accent-ink)">${ICON.dice.replace("<svg ", '<svg style="width:26px;height:26px" ')}</div></div>
          <div class="next-body">
            <div class="next-head"><span class="eyebrow">How about this one?</span><span class="pill">Random pick of ${todo.length}${fc ? ` in ${esc(fc.name)}` : ""}</span></div>
            <h2>${esc(sug.title)}</h2>
            ${sug.notes ? `<p>${esc(sug.notes)}</p>` : ""}
            ${w ? `<div class="actions">
              <button type="button" class="btn primary" data-act="open" data-kind="plan" data-where="hero" data-id="${esc(sug.id)}">${ICON.cal} Plan this one</button>
              ${todo.length > 1 ? `<button type="button" class="btn" data-act="pick">Pick another</button>` : ""}
              <button type="button" class="btn ghost" data-act="clear-pick">Not now</button>
            </div>` : ""}
          </div>
          ${editorFor(sug, "hero")}
        </div>`;
      return;
    }
    let title, msg, icon = ICON.flag, action = "";
    if (!total) { title = "Start your list"; msg = "Add the things you want to do together below. Your next adventure will show up here."; }
    else if (!state.items.some((x) => x.status !== "done" && x.status !== "planned")) { title = "All done!"; msg = "You've ticked off everything on the list. Time to dream up more."; icon = ICON.trophy; }
    else if (!todo.length) { title = "Nothing planned yet"; msg = "Nothing left to do in this category. Show all categories to pick from everything."; }
    else {
      title = "Nothing planned yet";
      msg = `${todo.length} ${todo.length === 1 ? "activity is" : "activities are"} waiting for a date.`;
      if (w) action = `<button type="button" class="btn primary" data-act="pick">${ICON.dice.replace("<svg ", '<svg style="width:16px;height:16px" ')} Pick one for us</button>`;
    }
    el.innerHTML = `<div class="card next empty"><div class="empty-icon">${icon}</div><div class="row"><div class="next-body"><strong>${title}</strong><p>${msg}</p></div>${action}</div></div>`;
  }

  function menuHTML(item) {
    const id = esc(item.id), done = item.status === "done", planned = item.status === "planned";
    const b = (act, icon, label, extra = "", cls = "") => `<button type="button" role="menuitem" class="${cls}" data-act="${act}" data-id="${id}" ${extra}>${icon}${label}</button>`;
    const items = done
      ? [b("open", ICON.edit, "Edit", 'data-kind="edit" data-where="list"'), b("undo", ICON.undo, "Mark as not done")]
      : [
          b("open", ICON.check, "Mark as done", 'data-kind="done" data-where="list"'),
          b("open", ICON.cal, planned ? "Change date" : "Plan it", 'data-kind="plan" data-where="list"'),
          planned ? b("toggle-cl", ICON.list, state.expanded.has(item.id) ? "Hide checklist" : "Show checklist") : "",
          planned ? b("unplan", ICON.x, "Unplan") : "",
          b("open", ICON.edit, "Edit", 'data-kind="edit" data-where="list"'),
        ];
    return `<div class="menu" role="menu">${items.join("")}<div class="sep"></div>${b("open", ICON.trash, "Delete", 'data-kind="delete" data-where="list"', "danger")}</div>`;
  }

  function itemHTML(item) {
    const w = state.canWrite, id = esc(item.id), done = item.status === "done", planned = item.status === "planned";
    const meta = [];
    const c = resolveCat(item);
    if (c) meta.push(`<span class="cat" style="--dot:${catVar(c)}"><i></i>${esc(c.name)}</span>`);
    if (planned) {
      const late = validISO(item.plannedFor) && daysUntil(item.plannedFor) < 0;
      meta.push(`<span class="when${late ? " late" : ""}">${ICON.cal}${validISO(item.plannedFor) ? `${esc(fmtDate(item.plannedFor, true))} · ${countdown(item.plannedFor)}` : "Planned · date TBD"}</span>`);
      const tasks = tasksOf(item), td = tasks.filter((t) => t.done).length, open = state.expanded.has(item.id);
      if (tasks.length || w) meta.push(`<button type="button" class="cl-chip${tasks.length && td === tasks.length ? " complete" : ""}" data-act="toggle-cl" data-id="${id}" aria-expanded="${open}">${ICON.list}${tasks.length ? `${td}/${tasks.length} steps` : "Add checklist"}</button>`);
    }
    if (done && validISO(item.doneOn)) meta.push(`<span>Done ${esc(fmtDate(item.doneOn))}</span>`);
    const who = done ? avatar(item.doneBy || item.addedBy, "Ticked off by {name}") : avatar(item.addedBy, "Added by {name}");
    if (who) meta.push(who);
    const menuOpen = state.menu === item.id;
    const cl = planned && state.expanded.has(item.id) ? checklistHTML(item, "list") : "";
    return `
      <li class="item${done ? " done" : ""}">
        <button type="button" class="check" ${w ? "" : "disabled"} data-act="${done ? "undo" : "open"}" data-kind="done" data-where="list" data-id="${id}" aria-label="${done ? "Mark as not done" : "Mark as done"}: ${esc(item.title)}">${ICON.check}</button>
        <div class="body">
          <span class="title">${esc(item.title)}</span>
          ${item.notes ? `<span class="notes">${esc(item.notes)}</span>` : ""}
          ${done && item.memory ? `<span class="memory">${esc(item.memory)}</span>` : ""}
          ${meta.length ? `<span class="meta">${meta.join("")}</span>` : ""}
        </div>
        <div class="side">
          ${done ? `<span class="stamp${state.fresh.has(item.id) ? " fresh" : ""}">Done</span>` : ""}
          ${w && !done && !planned ? `<button type="button" class="btn ghost quick" data-act="open" data-kind="plan" data-where="list" data-id="${id}">${ICON.cal} Plan</button>` : ""}
          ${w ? `<div class="menu-wrap">
            <button type="button" class="icon-btn" data-act="menu" data-id="${id}" aria-haspopup="menu" aria-expanded="${menuOpen}" aria-label="More actions for ${esc(item.title)}">${ICON.dots}</button>
            ${menuOpen ? menuHTML(item) : ""}
          </div>` : ""}
        </div>
        ${editorFor(item, "list")}
        ${cl ? `<div class="item-cl">${cl}</div>` : ""}
      </li>`;
  }

  function renderManager(cats, counts) {
    const el = $("#cats-panel");
    if (!state.managing) { el.innerHTML = ""; return; }
    const w = state.canWrite;
    const rows = cats.map((c) => {
      const id = esc(c.id), n = counts[c.id] || 0;
      const confirm = state.catConfirm === c.id ? `
        <div class="cm-confirm">
          <span>Delete “${esc(c.name)}”?${n ? ` ${n} ${n === 1 ? "activity" : "activities"} will have no category.` : ""}</span>
          <button type="button" class="btn sm ghost" data-act="cat-keep">Keep</button>
          <button type="button" class="btn sm danger" data-act="cat-confirm-del" data-cat="${id}">Delete</button>
        </div>` : "";
      return `
        <li class="cm-row">
          <button type="button" class="dot-btn" style="--dot:${catVar(c)}" ${w ? "" : "disabled"} data-act="cat-color" data-cat="${id}" aria-label="Change color of ${esc(c.name)}" title="Change color"></button>
          <input class="field sm" data-key="cat:${id}" data-cat-name="${id}" value="${esc(c.name)}" maxlength="40" aria-label="Category name" ${w ? "" : "readonly"}>
          <span class="cm-count" title="Activities in this category">${n}</span>
          ${w ? `<button type="button" class="icon-btn sm danger" data-act="cat-del" data-cat="${id}" aria-label="Delete ${esc(c.name)}">${ICON.trash}</button>` : "<span></span>"}
          ${confirm}
        </li>`;
    }).join("");
    el.innerHTML = `
      <div class="cat-manager">
        <div class="cm-head">
          <div><strong>Categories</strong><span class="hint">Shared by both of you. Click a dot to change its color, or edit a name to rename it.</span></div>
          <button type="button" class="icon-btn sm" data-act="manage" aria-label="Close categories">${ICON.x}</button>
        </div>
        ${cats.length ? `<ul class="cm-list">${rows}</ul>` : `<span class="hint">No categories yet. Add your first one below.</span>`}
        ${w ? `<div class="cm-add">
          <input class="field sm" data-key="cat:new" id="cat-new" maxlength="40" placeholder="New category, e.g. Road Trips" aria-label="New category name">
          <button type="button" class="btn sm primary" data-act="cat-add">Add category</button>
        </div>` : ""}
      </div>`;
  }

  // Rebuild a <select> only when its options change, so an open picker isn't disturbed.
  function syncSelect(sel, html, value) {
    if (sel.dataset.sig !== html) { sel.innerHTML = html; sel.dataset.sig = html; }
    sel.value = [...sel.options].some((o) => o.value === value) ? value : "";
  }
  function syncDot(dot, wrap, catId) {
    const c = catId && catId !== "none" ? state.cats.find((x) => x.id === catId) : null;
    dot.style.setProperty("--dot", c ? catVar(c) : "transparent");
    wrap.classList.toggle("has-dot", !!c);
  }

  function keyOf(i) {
    if (i.dataset.key) return i.dataset.key;
    const ed = i.closest("[data-editor]");
    return ed ? ed.dataset.editor + "|" + i.name : null;
  }
  function captureDrafts() {
    const drafts = {};
    document.querySelectorAll("#next input, #next select, #list input, #list select, #cats-panel input").forEach((i) => {
      const k = keyOf(i); if (!k) return;
      if (i.tagName === "SELECT" || i.value !== i.defaultValue) drafts[k] = i.value;
    });
    const a = document.activeElement;
    return { drafts, focus: a && a.matches && a.matches("input, select") ? keyOf(a) : null };
  }
  function restoreDrafts({ drafts, focus }) {
    document.querySelectorAll("#next input, #next select, #list input, #list select, #cats-panel input").forEach((i) => {
      const k = keyOf(i); if (!k) return;
      if (k in drafts) i.value = drafts[k];
      if (k === focus) i.focus();
    });
  }

  function render() {
    const saved = captureDrafts();
    const items = state.items.filter((x) => x && typeof x.title === "string");
    const cats = sortedCats();
    if (state.catFilter && state.catFilter !== "none" && state.catsLoaded && !cats.some((c) => c.id === state.catFilter)) { state.catFilter = ""; safeSet("bucketlist.cat", ""); }
    const all = {
      todo: items.filter((x) => x.status !== "done" && x.status !== "planned"),
      planned: items.filter((x) => x.status === "planned"),
      done: items.filter((x) => x.status === "done"),
    };
    const fil = (arr) => arr.filter(matchesCat);
    const todo = fil(all.todo).sort(byCreated);
    const planned = fil(all.planned).sort(byPlanned);
    const done = fil(all.done).sort(byDone);
    const total = items.length;
    if (state.menu && !items.some((x) => x.id === state.menu)) state.menu = null;

    const pct = total ? Math.round((all.done.length / total) * 100) : 0;
    $("#ring-fill").setAttribute("stroke-dashoffset", (157.08 * (1 - pct / 100)).toFixed(2));
    $("#ring-pct").textContent = pct + "%";
    $("#ring").setAttribute("aria-label", `${all.done.length} of ${total} done`);
    $("#summary").innerHTML = state.mode === "loading" ? "Loading…"
      : total ? `<b>${all.done.length}</b> of <b>${total}</b> done · <b>${all.planned.length}</b> planned · <b>${all.todo.length}</b> to go`
      : "Things we want to do together";

    const notice = $("#notice");
    let n = "";
    if (state.mode === "local") n = "Saved in this browser only. Publish this page as a Claude artifact to share the list with your friend.";
    else if (state.mode === "unavailable") n = "The shared list isn't available in this view. Open it on claude.ai while signed in.";
    else if (state.mode === "db" && !state.canWrite) n = "You can view this list. To add or tick off activities, ask the owner to share it with you as an Editor.";
    notice.innerHTML = n ? `${ICON.info}<span>${esc(n)}</span>` : ""; notice.hidden = !n;

    $("#add").hidden = !state.canWrite || state.mode === "unavailable" || state.mode === "loading";

    // Category pickers
    const counts = {};
    for (const it of items) { const c = resolveCat(it); if (c && c.id) counts[c.id] = (counts[c.id] || 0) + 1; }
    const uncategorized = items.filter((it) => !resolveCat(it)).length;
    const newCat = $("#new-cat");
    syncSelect(newCat, catOptions(null, "No category"), newCat.value);
    syncDot($("#new-cat-dot"), $("#new-cat-wrap"), newCat.value);
    const filterHTML = `<option value="">All categories</option>` + cats.map((c) => `<option value="${esc(c.id)}">${esc(c.name)} (${counts[c.id] || 0})</option>`).join("") + `<option value="none">No category (${uncategorized})</option>`;
    syncSelect($("#cat-filter"), filterHTML, state.catFilter);
    syncDot($("#cat-filter-dot"), $("#cat-filter-wrap"), state.catFilter);
    $("#manage-btn").setAttribute("aria-pressed", String(state.managing));
    $("#manage-btn").hidden = state.mode === "loading" || state.mode === "unavailable";
    renderManager(cats, counts);

    renderNext(todo, all.planned.slice().sort(byPlanned), total);

    const tabs = [["todo", "To do", todo.length], ["planned", "Planned", planned.length], ["done", "Done", done.length], ["all", "All", todo.length + planned.length + done.length]];
    $("#tabs").innerHTML = tabs.map(([k, label, c]) => `<button type="button" role="tab" data-act="filter" data-filter="${k}" aria-selected="${state.filter === k}">${label}<span class="n">${c}</span></button>`).join("");

    const shown = state.filter === "todo" ? todo : state.filter === "planned" ? planned : state.filter === "done" ? done : [...planned, ...todo, ...done];
    $("#list").innerHTML = state.mode === "loading"
      ? `<li class="skeleton" aria-hidden="true"><i style="width:62%"></i><i style="width:44%"></i><i style="width:55%"></i></li>`
      : shown.map(itemHTML).join("");

    const empty = $("#list-empty");
    let e = "";
    if (state.mode !== "loading" && !shown.length) {
      if (!total) e = `<strong>Your list is empty</strong><span>Add activities one at a time above, or paste your whole list in one go.</span>`;
      else if (state.catFilter) {
        const name = state.catFilter === "none" ? "without a category" : `in ${esc((cats.find((c) => c.id === state.catFilter) || {}).name || "this category")}`;
        e = `<strong>Nothing here ${name}</strong><span>Try another tab, or <button type="button" class="text-btn" data-act="clear-cat">show all categories</button>.</span>`;
      }
      else if (state.filter === "todo") e = `<strong>Nothing left to do</strong><span>Everything is planned or done.</span>`;
      else if (state.filter === "planned") e = `<strong>Nothing planned</strong><span>Open the ⋯ menu on any activity and choose “Plan it”.</span>`;
      else if (state.filter === "done") e = `<strong>Nothing ticked off yet</strong><span>Mark your first activity as done and it shows up here.</span>`;
    }
    empty.innerHTML = e; empty.hidden = !e;

    restoreDrafts(saved);
    fillAvatars();
  }

  /* ---------- actions ---------- */
  function find(id) { return state.items.find((x) => x.id === id); }
  function editorValues(id) {
    const box = document.querySelector(`[data-editor="${CSS.escape(id)}"]`);
    const v = {}; if (box) box.querySelectorAll("input, select").forEach((i) => (v[i.name] = i.value.trim()));
    return v;
  }
  function openEditor(id, kind, where) {
    state.editor = { id, kind, where }; state.menu = null; render();
    const box = document.querySelector(`[data-editor="${CSS.escape(id)}"]`);
    const first = box && box.querySelector("input, select, button"); if (first) first.focus();
  }
  function focusKey(key) { const i = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (i) i.focus(); }

  async function addTask(item, text, where) {
    const clean = text.trim().slice(0, 140); if (!clean) return false;
    const tid = taskId();
    return update("activities", item.id, { checklist: { [tid]: { text: clean, done: false, order: Date.now(), who: null, doneBy: null } } });
  }
  async function saveCatName(input) {
    const id = input.dataset.catName, c = state.cats.find((x) => x.id === id); if (!c) return;
    const name = input.value.trim().slice(0, 40);
    if (name === c.name) return;
    if (!name) { input.value = c.name; toast("A category needs a name."); return; }
    const clash = catByName(name);
    if (clash && clash.id !== id) { input.value = c.name; toast(`There's already a category called “${clash.name}”.`); return; }
    input.defaultValue = name;
    await update("categories", id, { name });
  }

  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-act]");
    if (state.menu && !ev.target.closest(".menu-wrap")) { state.menu = null; if (!b) render(); }
    if (!b) return;
    ev.preventDefault();
    const act = b.dataset.act, id = b.dataset.id, item = id && find(id);
    const tid = b.dataset.task, task = item && tid ? tasksOf(item).find((t) => t.id === tid) : null;
    switch (act) {
      case "menu": {
        state.menu = state.menu === id ? null : id; render();
        const first = state.menu && document.querySelector(".menu button"); if (first) first.focus();
        break;
      }
      case "filter": state.filter = b.dataset.filter; safeSet("bucketlist.filter", state.filter); state.editor = null; render(); break;
      case "clear-cat": state.catFilter = ""; safeSet("bucketlist.cat", ""); render(); break;
      case "open": if (item) openEditor(id, b.dataset.kind, b.dataset.where); break;
      case "cancel": state.editor = null; render(); break;
      case "pick": {
        const todo = state.items.filter((x) => x.status !== "done" && x.status !== "planned" && matchesCat(x));
        const pool = todo.length > 1 ? todo.filter((x) => x.id !== state.suggestion) : todo;
        state.suggestion = pool.length ? pool[Math.floor(Math.random() * pool.length)].id : null;
        state.editor = null; render(); break;
      }
      case "clear-pick": state.suggestion = null; state.editor = null; render(); break;
      case "save-plan": {
        const v = editorValues(id);
        const date = validISO(v.date) ? v.date : null;
        state.editor = null; state.suggestion = null;
        if (await updateItem(id, { status: "planned", plannedFor: date, planNote: v.planNote || "" })) toast(date ? `Planned for ${fmtDate(date, true)}. Add steps to its checklist.` : "Added to your plans.");
        render(); break;
      }
      case "unplan": state.editor = null; state.menu = null; state.expanded.delete(id); await updateItem(id, { status: "todo", plannedFor: null, planNote: "" }); render(); break;
      case "save-done": {
        const v = editorValues(id);
        const date = validISO(v.date) ? v.date : todayISO();
        state.editor = null; state.fresh.add(id); state.expanded.delete(id);
        if (await updateItem(id, { status: "done", doneOn: date, doneAt: Date.now(), memory: v.memory || "", doneBy: state.me || null })) toast(`Ticked off: ${item ? item.title : "activity"}.`);
        render(); setTimeout(() => state.fresh.delete(id), 1500); break;
      }
      case "undo": state.editor = null; state.menu = null; await updateItem(id, { status: "todo", doneOn: null, doneAt: null, doneBy: null, plannedFor: null }); render(); break;
      case "save-edit": {
        const v = editorValues(id);
        if (!v.title) { toast("Give the activity a name first."); break; }
        const patch = { title: v.title, categoryId: v.categoryId || null, category: "", notes: v.notes || "" };
        if ("memory" in v) patch.memory = v.memory;
        state.editor = null; await updateItem(id, patch); render(); break;
      }
      case "confirm-delete": state.editor = null; if (state.suggestion === id) state.suggestion = null; await remove("activities", id); render(); break;

      /* checklist */
      case "toggle-cl": state.menu = null; if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id); render();
        if (state.expanded.has(id) && item && !tasksOf(item).length) focusKey(`task:list:${id}`);
        break;
      case "task-add": {
        if (!item) break;
        const key = `task:${b.dataset.where}:${id}`;
        const input = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
        const text = input ? input.value.trim() : "";
        if (!text) { if (input) input.focus(); break; }
        input.value = ""; input.defaultValue = "";
        if (!(await addTask(item, text))) { render(); const i = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (i) i.value = text; }
        focusKey(key); break;
      }
      case "task-suggest": if (item) await addTask(item, b.dataset.text); break;
      case "task-toggle": if (task) await updateItem(id, { checklist: { [tid]: { done: !task.done, doneBy: !task.done ? state.me || null : null } } }); break;
      case "task-claim": if (task && state.me) await updateItem(id, { checklist: { [tid]: { who: task.who === state.me ? null : state.me } } }); break;
      case "task-del": if (task) await updateItem(id, { checklist: { [tid]: null } }); break;

      /* categories */
      case "manage": state.managing = !state.managing; state.catConfirm = null; render(); if (state.managing) focusKey("cat:new"); break;
      case "cat-add": {
        const input = $("#cat-new"); const name = input ? input.value.trim().slice(0, 40) : "";
        if (!name) { if (input) input.focus(); break; }
        const clash = catByName(name);
        if (clash) { toast(`There's already a category called “${clash.name}”.`); break; }
        const used = new Set(state.cats.map(colorIndex));
        let color = 1; while (used.has(color) && color < COLORS) color++;
        if (used.has(color)) color = (state.cats.length % COLORS) + 1;
        const order = state.cats.reduce((m, c) => Math.max(m, Number(c.order) || 0), 0) + 1;
        input.value = ""; input.defaultValue = "";
        if (await add("categories", { name, color, order })) toast(`Added “${name}”.`); else { render(); const i = $("#cat-new"); if (i) i.value = name; }
        focusKey("cat:new"); break;
      }
      case "cat-color": {
        const c = state.cats.find((x) => x.id === b.dataset.cat); if (!c) break;
        await update("categories", c.id, { color: (colorIndex(c) % COLORS) + 1 }); break;
      }
      case "cat-del": state.catConfirm = b.dataset.cat; render(); break;
      case "cat-keep": state.catConfirm = null; render(); break;
      case "cat-confirm-del": {
        const cid = b.dataset.cat; state.catConfirm = null;
        if (state.catFilter === cid) { state.catFilter = ""; safeSet("bucketlist.cat", ""); }
        await remove("categories", cid); render(); break;
      }
    }
  });
  function updateItem(id, patch) { return update("activities", id, patch); }

  document.addEventListener("keydown", (ev) => {
    const t = ev.target;
    if (ev.key === "Escape") {
      if (state.menu) { const id = state.menu; state.menu = null; render(); const m = document.querySelector(`[data-act="menu"][data-id="${CSS.escape(id)}"]`); if (m) m.focus(); }
      else if (state.editor) { state.editor = null; render(); }
      else if (state.catConfirm) { state.catConfirm = null; render(); }
      return;
    }
    if (ev.key !== "Enter" || !t.matches || !t.matches("input")) return;
    if (t.matches("[data-editor] input")) {
      ev.preventDefault();
      const save = t.closest("[data-editor]").querySelector("[data-act^='save'], [data-act='confirm-delete']"); if (save) save.click();
    } else if (t.matches("[data-key^='task:']")) {
      ev.preventDefault(); const btn = t.parentElement.querySelector("[data-act='task-add']"); if (btn) btn.click();
    } else if (t.id === "cat-new") {
      ev.preventDefault(); const btn = document.querySelector("[data-act='cat-add']"); if (btn) btn.click();
    } else if (t.matches("[data-cat-name]")) {
      ev.preventDefault(); t.blur();
    }
  });
  document.addEventListener("focusout", (ev) => { if (ev.target.matches && ev.target.matches("[data-cat-name]")) saveCatName(ev.target); });

  $("#new-cat").addEventListener("change", () => syncDot($("#new-cat-dot"), $("#new-cat-wrap"), $("#new-cat").value));
  $("#cat-filter").addEventListener("change", (ev) => {
    state.catFilter = ev.target.value; safeSet("bucketlist.cat", state.catFilter);
    state.suggestion = null; state.editor = null; render();
  });

  function baseItem(title, categoryId, i = 0) {
    return { title, categoryId: categoryId || null, category: "", notes: "", status: "todo", plannedFor: null, planNote: "", doneOn: null, doneAt: null, memory: "", createdAt: Date.now() + i, addedBy: state.me || null, doneBy: null };
  }
  $("#add").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!$("#bulk-row").hidden) return $("#bulk-add").click();
    const t = $("#new-title"), c = $("#new-cat");
    const title = t.value.trim(); if (!title) { t.focus(); return; }
    t.value = "";
    if (await add("activities", baseItem(title.slice(0, 200), c.value))) {
      if (state.filter !== "todo" && state.filter !== "all") { state.filter = "todo"; safeSet("bucketlist.filter", "todo"); render(); }
    } else t.value = title;
    t.focus();
  });

  function bulkLines() { return $("#bulk-text").value.split(/\r?\n/).map(cleanLine).filter(Boolean).map((l) => l.slice(0, 200)); }
  function setBulk(on) {
    $("#bulk-row").hidden = !on; $("#single-row").hidden = on; $("#bulk-add").hidden = !on; $("#bulk-hint").hidden = !on;
    $("#toggle-bulk").textContent = on ? "Add one at a time" : "Paste a whole list";
    if (on) { $("#bulk-text").focus(); updateBulkHint(); } else $("#new-title").focus();
  }
  function updateBulkHint() { const n = bulkLines().length; $("#bulk-hint").textContent = n ? `${n} ${n === 1 ? "activity" : "activities"} found` : "One per line"; $("#bulk-add").disabled = !n; }
  $("#toggle-bulk").addEventListener("click", () => setBulk($("#bulk-row").hidden));
  $("#bulk-text").addEventListener("input", updateBulkHint);
  $("#bulk-add").addEventListener("click", async () => {
    const lines = bulkLines(); if (!lines.length) return;
    const btn = $("#bulk-add"); btn.disabled = true; btn.textContent = "Adding…";
    let ok = 0;
    for (let i = 0; i < lines.length; i++) { if (await add("activities", baseItem(lines[i], "", i))) ok++; else break; }
    btn.textContent = "Add all";
    if (ok) { $("#bulk-text").value = ""; toast(`Added ${ok} ${ok === 1 ? "activity" : "activities"}.`); setBulk(false); state.filter = "todo"; render(); }
    updateBulkHint();
  });

  /* ---------- boot ---------- */
  function startLocal() {
    state.mode = "local";
    let cats = readLocal("categories");
    if (!cats) cats = LOCAL_STARTER_CATS.map(([name, color], i) => ({ id: newId(), name, color, order: i + 1 }));
    let items = readLocal("activities") || [];
    // Move older free-text categories onto the category list.
    items = items.map((it) => {
      if (it.categoryId || !it.category || !String(it.category).trim()) return it;
      const name = String(it.category).trim();
      let c = cats.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!c) { c = { id: newId(), name, color: (cats.length % COLORS) + 1, order: cats.length + 1 }; cats.push(c); }
      return { ...it, categoryId: c.id, category: "" };
    });
    state.catsLoaded = true;
    writeLocal("categories", cats, true);
    writeLocal("activities", items, true);
    render();
  }

  function subscribe(coll, onData, retried) {
    dbNs.collection(coll).onSnapshot((snap) => onData(snap.docs.map((d) => ({ id: d.id, ...d.data() }))), (err) => {
      if (err && err.code === "unavailable" && !retried) { setTimeout(() => subscribe(coll, onData, true), 2000); return; }
      if (err && err.code === "revoked") { state.canWrite = false; render(); return; }
      toast("Lost the connection to your shared list. Reload the page to reconnect.");
    });
  }

  async function boot() {
    render();
    if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    userNs = user;
    if (!db) { state.mode = "unavailable"; state.canWrite = false; render(); return; }
    if (user) {
      state.me = await user.id();
      if ((await user.can("data.write")) === false) state.canWrite = false;
    }
    dbNs = db;
    subscribe("categories", (list) => { state.cats = list; state.catsLoaded = true; render(); });
    subscribe("activities", (list) => {
      state.items = list;
      if (state.mode === "loading") state.mode = "db";
      render();
    });
  }
  boot();
})();
</script>
