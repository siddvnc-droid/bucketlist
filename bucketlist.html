<title>Our Bucket List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: one 720px column — header with progress ring, a "next up" card with a calendar tile, then one panel holding add bar, filter and list. Amber is the single accent; green only means done. */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --surface-2: #F1F3F6;
  --ink: #121721;
  --ink-2: #3A4250;
  --muted: #6B7380;
  --line: #E3E6EB;
  --line-strong: #CDD2DA;
  --accent: #EBA21A;
  --accent-soft: #FDF2DC;
  --accent-ink: #7A4E00;
  --on-accent: #3D2800;
  --done: #16835A;
  --done-soft: #E2F3EB;
  --on-done: #FFFFFF;
  --danger: #C4321F;
  --danger-soft: #FCEAE7;
  --on-danger: #FFFFFF;
  --focus: #3B6FE0;
  --c1: #3B6FE0; --c2: #8B4FD8; --c3: #D9541A; --c4: #0D9A72; --c5: #D6407A; --c6: #6B7380;
  --shadow: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .07);
  --shadow-pop: 0 10px 30px rgb(16 24 40 / .14), 0 2px 6px rgb(16 24 40 / .08);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1117; --surface: #151B23; --surface-2: #1C232D; --ink: #E8ECF1; --ink-2: #C2C9D2; --muted: #8C96A3;
    --line: #262E39; --line-strong: #364050; --accent: #F2B13A; --accent-soft: #33270F; --accent-ink: #F5C86E; --on-accent: #2A1B00;
    --done: #3FC48A; --done-soft: #12291E; --on-done: #05200F; --danger: #FF7B6B; --danger-soft: #3A1A16; --on-danger: #2A0A06;
    --focus: #7EA2FF; --c1: #7EA2FF; --c2: #B88CF5; --c3: #FF8A57; --c4: #3CCB9E; --c5: #F27CA8; --c6: #8C96A3;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-pop: 0 12px 32px rgb(0 0 0 / .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #151B23; --surface-2: #1C232D; --ink: #E8ECF1; --ink-2: #C2C9D2; --muted: #8C96A3;
  --line: #262E39; --line-strong: #364050; --accent: #F2B13A; --accent-soft: #33270F; --accent-ink: #F5C86E; --on-accent: #2A1B00;
  --done: #3FC48A; --done-soft: #12291E; --on-done: #05200F; --danger: #FF7B6B; --danger-soft: #3A1A16; --on-danger: #2A0A06;
  --focus: #7EA2FF; --c1: #7EA2FF; --c2: #B88CF5; --c3: #FF8A57; --c4: #3CCB9E; --c5: #F27CA8; --c6: #8C96A3;
  --shadow: 0 1px 2px rgb(0 0 0 / .4); --shadow-pop: 0 12px 32px rgb(0 0 0 / .5); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 72px;
}
.app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg { flex: none; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 8px; }
.brand { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.05; letter-spacing: -0.025em; margin: 0; text-wrap: balance; }
.summary { margin: 0; color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink-2); font-weight: 600; }
.ring { position: relative; width: 60px; height: 60px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .fill { stroke: var(--done); transition: stroke-dashoffset .6s ease; }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; font-variant-numeric: tabular-nums; }

/* ---------- shared surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.notice { display: flex; gap: 10px; align-items: flex-start; font-size: 0.875rem; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.notice svg { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 0.875rem; white-space: nowrap; transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.success { background: var(--done); border-color: var(--done); color: var(--on-done); }
.btn.success:hover { filter: brightness(1.06); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--muted); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.text-btn { border: 0; background: none; padding: 0; color: var(--ink-2); font-weight: 500; font-size: 0.85rem; text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.text-btn:hover { color: var(--ink); text-decoration-color: currentColor; }

/* ---------- next up ---------- */
.next { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 20px; padding: 20px; align-items: start; }
.cal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; text-align: center; background: var(--surface); }
.cal-mon { background: var(--accent); color: var(--on-accent); font-size: 0.7rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 4px 0; }
.cal-day { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; padding: 10px 0 4px; font-variant-numeric: tabular-nums; }
.cal-dow { font-size: 0.72rem; color: var(--muted); padding-bottom: 8px; }
.cal.tbd .cal-day { font-size: 1.1rem; padding: 16px 0 10px; color: var(--muted); }
.next-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.next-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.next h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.35rem, 4vw, 1.65rem); line-height: 1.15; letter-spacing: -0.015em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.next p { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--accent-soft); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.pill.late { background: var(--danger-soft); color: var(--danger); }
.next .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.next.empty { grid-template-columns: 44px minmax(0, 1fr); align-items: center; }
.empty-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
.empty-icon svg { width: 22px; height: 22px; }
.next.empty .row { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
.next.empty p { color: var(--muted); }
.next .editor { grid-column: 1 / -1; margin: 4px 0 0; }

/* ---------- panel: add + filter + list ---------- */
.panel { overflow: visible; }
.add { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.add-row { display: flex; gap: 8px; flex-wrap: wrap; }
.input-wrap { position: relative; flex: 3 1 260px; min-width: 0; }
.input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.field {
  width: 100%; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong);
  background: var(--surface); min-width: 0; transition: border-color .12s, box-shadow .12s;
}
.field::placeholder { color: var(--muted); }
.field:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.input-wrap .field { padding-left: 36px; }
#new-cat { flex: 1 1 140px; width: auto; }
.add-row .btn { height: 38px; }
textarea.field { height: auto; min-height: 132px; padding: 10px 12px; resize: vertical; line-height: 1.55; }
.add-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; min-height: 22px; }
.hint { font-size: 0.82rem; color: var(--muted); }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 7px; font-size: 0.85rem; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg .n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.list { list-style: none; margin: 0; padding: 0; }
.item {
  position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 2px 14px; align-items: start;
  padding: 14px 12px 14px 16px; border-top: 1px solid var(--line); transition: background .12s;
}
.item:first-child { border-top: 0; }
.item:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.list > .item:last-child { border-radius: 0 0 14px 14px; }
.check {
  width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); background: var(--surface);
  display: grid; place-items: center; padding: 0; margin-top: 1px; color: transparent; transition: all .12s;
}
.check svg { width: 12px; height: 12px; }
.check:hover { border-color: var(--done); color: var(--done); background: var(--done-soft); }
.item.done .check { background: var(--done); border-color: var(--done); color: var(--on-done); }
.check[disabled] { cursor: default; }
.body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.title { font-weight: 500; overflow-wrap: anywhere; line-height: 1.4; }
.item.done .title { color: var(--ink-2); }
.notes { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.memory { color: var(--ink-2); font-size: 0.875rem; overflow-wrap: anywhere; white-space: pre-wrap; padding-left: 10px; border-left: 2px solid var(--done-soft); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 0.8rem; color: var(--muted); }
.cat { display: inline-flex; align-items: center; gap: 6px; }
.cat i { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--c6)); }
.when { display: inline-flex; align-items: center; gap: 5px; color: var(--accent-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.when svg { width: 13px; height: 13px; }
.when.late { color: var(--danger); }
.av { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; background: var(--line); }
.side { display: flex; align-items: center; gap: 6px; }
.quick { opacity: 0; transition: opacity .12s; height: 30px; padding: 0 10px; }
.item:hover .quick, .item:focus-within .quick { opacity: 1; }
@media (hover: none) { .quick { display: none; } }
.stamp {
  font-family: var(--font-mono); font-weight: 600; font-size: 0.66rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--done); border: 1.5px solid var(--done); border-radius: 5px; padding: 2px 7px; transform: rotate(-4deg);
  white-space: nowrap; font-variant-numeric: tabular-nums; margin-right: 4px;
}
.stamp.fresh { animation: thunk .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes thunk { from { transform: rotate(-16deg) scale(1.8); opacity: 0; } to { transform: rotate(-4deg) scale(1); opacity: 1; } }

/* row menu */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 15; min-width: 176px; padding: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column;
}
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; font-size: 0.875rem; color: var(--ink); }
.menu button svg { width: 15px; height: 15px; color: var(--muted); }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
.menu .danger, .menu .danger svg { color: var(--danger); }

/* inline editor */
.editor {
  grid-column: 2 / -1; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; padding: 14px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
}
.editor label { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; font-weight: 500; color: var(--ink-2); }
.editor .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.editor .btns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.editor .hint { margin-right: auto; align-self: center; }
.editor p { margin: 0; color: var(--ink-2); }

.empty-state { text-align: center; padding: 44px 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 0.9rem; }
.empty-state strong { color: var(--ink); font-weight: 600; font-size: 1rem; }
.skeleton { padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.skeleton i { display: block; height: 14px; border-radius: 6px; background: var(--surface-2); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 0.875rem;
  max-width: min(92vw, 520px); box-shadow: var(--shadow-pop);
}

@media (max-width: 560px) {
  body { padding-block: 24px 64px; }
  .next { grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 16px; }
  .next .actions .btn { flex: 1 1 auto; justify-content: center; }
  .item { grid-template-columns: 24px minmax(0, 1fr) auto; padding: 14px 8px 14px 14px; gap: 2px 12px; }
  .stamp { display: none; }
  .add-row .btn { flex: 1 1 100%; justify-content: center; }
  .toolbar { padding: 10px 12px; }
  .seg { width: 100%; }
  .seg button { flex: 1 1 0; justify-content: center; padding: 0 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Our Bucket List</h1>
      <p class="summary" id="summary">Loading…</p>
    </div>
    <div class="ring" id="ring" role="img" aria-label="0% done">
      <svg viewBox="0 0 60 60" aria-hidden="true"><circle class="track" cx="30" cy="30" r="25" fill="none" stroke-width="5"/><circle class="fill" id="ring-fill" cx="30" cy="30" r="25" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="157.08" stroke-dashoffset="157.08"/></svg>
      <span id="ring-pct">0%</span>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <section id="next" aria-label="Next up"></section>

  <section class="card panel" aria-label="Activities">
    <form id="add" class="add" autocomplete="off" hidden>
      <div class="add-row" id="single-row">
        <div class="input-wrap">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          <input id="new-title" class="field" placeholder="Add an activity, e.g. See the northern lights" aria-label="Activity" maxlength="200">
        </div>
        <input id="new-cat" class="field" placeholder="Category" aria-label="Category (optional)" list="cats" maxlength="40">
        <button class="btn primary" type="submit">Add</button>
      </div>
      <div id="bulk-row" hidden>
        <textarea id="bulk-text" class="field" aria-label="Paste your list" placeholder="Paste your list here, one activity per line.&#10;Bullets and numbers are removed for you."></textarea>
      </div>
      <div class="add-foot">
        <button type="button" class="text-btn" id="toggle-bulk">Paste a whole list</button>
        <span class="hint" id="bulk-hint" hidden></span>
        <button type="button" class="btn primary" id="bulk-add" hidden>Add all</button>
      </div>
      <datalist id="cats"></datalist>
    </form>
    <div class="toolbar">
      <div class="seg" role="tablist" id="tabs" aria-label="Filter activities"></div>
    </div>
    <ul class="list" id="list"></ul>
    <div id="list-empty" class="empty-state" hidden></div>
  </section>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 01-8 0zM8 6H5a3 3 0 003 4M16 6h3a3 3 0 01-3 4M12 13v4M8.5 20h7"/></svg>',
    info: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.2V11M8 5v.01"/></svg>',
  };

  const state = {
    mode: "loading",       // loading | db | local | unavailable
    items: [],
    canWrite: true,
    me: null,
    filter: safeGet("bucketlist.filter") || "todo",
    editor: null,           // { id, kind: plan|done|edit|delete, where: hero|list }
    menu: null,             // id of the row whose menu is open
    suggestion: null,       // id picked by "Pick one for us"
    fresh: new Set(),       // ids just marked done (stamp animation)
  };
  let col = null, userNs = null;
  const profiles = {};

  /* ---------- helpers ---------- */
  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function validISO(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function daysUntil(s) { return Math.round((parseISO(s) - parseISO(todayISO())) / 86400000); }
  function fmtDate(s, withDay) {
    const d = parseISO(s), sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString(undefined, { weekday: withDay ? "short" : undefined, day: "numeric", month: "short", year: sameYear ? undefined : "numeric" });
  }
  function countdown(s) {
    const n = daysUntil(s);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    return n > 0 ? `In ${n} days` : `${-n} days ago`;
  }
  function catColor(c) { let h = 0; for (const ch of c.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `var(--c${(h % 6) + 1})`; }
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 4200);
  }
  function cleanLine(l) { return l.replace(/^\s*(?:[-*•–]|\d+[.)]|\[[ xX]?\])\s*/, "").replace(/^\[[ xX]?\]\s*/, "").trim(); }
  function byCreated(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); }
  function byPlanned(a, b) {
    const ap = validISO(a.plannedFor), bp = validISO(b.plannedFor);
    if (ap && bp) return a.plannedFor.localeCompare(b.plannedFor) || byCreated(a, b);
    return ap ? -1 : bp ? 1 : byCreated(a, b);
  }
  function byDone(a, b) { return String(b.doneOn || "").localeCompare(String(a.doneOn || "")) || (b.doneAt || 0) - (a.doneAt || 0); }

  /* ---------- storage: shared db when available, this device otherwise ---------- */
  function readLocal() { try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; } }
  function writeLocal(list) { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch {} state.items = list; render(); }
  function newId() { return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36) + Math.random().toString(36).slice(2); }

  async function guarded(fn) {
    if (!state.canWrite) { toast("You can view this list but not change it."); return false; }
    try { await fn(); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === "unavailable") {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        try { await fn(); return true; } catch {}
        toast("Couldn't save just now. Check your connection and try again.");
      } else if (code === "invalid_argument") {
        state.canWrite = false; render();
        toast("You can view this list but not change it. Ask the owner to share it with you as an Editor.");
      } else if (code === "quota_exceeded") {
        toast("The list is full. Delete a few old activities to make room.");
      } else {
        toast("Couldn't save that change. Try again in a moment.");
      }
      return false;
    }
  }
  function addItem(data) {
    return guarded(async () => {
      if (col) await col.add(data);
      else writeLocal([...readLocal(), { id: newId(), ...data }]);
    });
  }
  function updateItem(id, patch) {
    return guarded(async () => {
      if (col) await col.doc(id).update(patch);
      else writeLocal(readLocal().map((x) => (x.id === id ? { ...x, ...patch } : x)));
    });
  }
  function removeItem(id) {
    return guarded(async () => {
      if (col) await col.doc(id).delete();
      else writeLocal(readLocal().filter((x) => x.id !== id));
    });
  }

  /* ---------- people ---------- */
  function avatar(uid, verb) {
    if (!uid || !userNs) return "";
    const p = profiles[uid];
    const label = p && p.name ? `${verb} by ${p.name}` : "";
    return `<img class="av" data-uid="${esc(uid)}" data-verb="${esc(verb)}" alt="${esc(label)}" title="${esc(label)}"${p ? ` src="${esc(p.avatarUrl)}"` : ""}>`;
  }
  async function fillAvatars() {
    if (!userNs) return;
    const ids = [...new Set([...document.querySelectorAll("img.av[data-uid]")].map((i) => i.dataset.uid))];
    if (!ids.length) return;
    const ps = await userNs.profiles(ids);
    Object.assign(profiles, ps);
    for (const img of document.querySelectorAll("img.av[data-uid]")) {
      const p = ps[img.dataset.uid]; if (!p) continue;
      img.src = p.avatarUrl;
      const label = p.name ? `${img.dataset.verb} by ${p.name}` : "";
      img.alt = label; img.title = label;
    }
  }

  /* ---------- rendering ---------- */
  function editorHTML(item, kind) {
    const id = esc(item.id);
    const cancel = `<button type="button" class="btn ghost" data-act="cancel">Cancel</button>`;
    if (kind === "plan") return `
      <div class="editor" data-editor="${id}">
        <div class="grid">
          <label>Date<input type="date" class="field" name="date" value="${esc(item.plannedFor || "")}" min="${todayISO()}"></label>
          <label>Plan notes<input class="field" name="planNote" maxlength="200" placeholder="Where, who books what…" value="${esc(item.planNote || "")}"></label>
        </div>
        <div class="btns"><span class="hint">No date yet? Leave it empty.</span>${cancel}<button type="button" class="btn primary" data-act="save-plan" data-id="${id}">Save plan</button></div>
      </div>`;
    if (kind === "done") {
      const def = item.doneOn || (validISO(item.plannedFor) && daysUntil(item.plannedFor) <= 0 ? item.plannedFor : todayISO());
      return `
      <div class="editor" data-editor="${id}">
        <div class="grid">
          <label>Done on<input type="date" class="field" name="date" value="${esc(def)}" max="${todayISO()}"></label>
          <label>How was it?<input class="field" name="memory" maxlength="300" placeholder="A line to remember it by (optional)" value="${esc(item.memory || "")}"></label>
        </div>
        <div class="btns">${cancel}<button type="button" class="btn success" data-act="save-done" data-id="${id}">${ICON.check} Mark as done</button></div>
      </div>`;
    }
    if (kind === "edit") return `
      <div class="editor" data-editor="${id}">
        <div class="grid">
          <label>Activity<input class="field" name="title" maxlength="200" value="${esc(item.title)}"></label>
          <label>Category<input class="field" name="category" maxlength="40" list="cats" value="${esc(item.category || "")}"></label>
        </div>
        <label>Notes<input class="field" name="notes" maxlength="500" placeholder="Ideas, links, costs…" value="${esc(item.notes || "")}"></label>
        ${item.status === "done" ? `<label>How was it?<input class="field" name="memory" maxlength="300" value="${esc(item.memory || "")}"></label>` : ""}
        <div class="btns">${cancel}<button type="button" class="btn primary" data-act="save-edit" data-id="${id}">Save changes</button></div>
      </div>`;
    if (kind === "delete") return `
      <div class="editor" data-editor="${id}">
        <p>Delete “${esc(item.title)}”? It disappears for both of you.</p>
        <div class="btns"><button type="button" class="btn ghost" data-act="cancel">Keep it</button><button type="button" class="btn danger" data-act="confirm-delete" data-id="${id}">Delete</button></div>
      </div>`;
    return "";
  }
  function editorFor(item, where) {
    const e = state.editor;
    return e && e.id === item.id && e.where === where ? editorHTML(item, e.kind) : "";
  }

  function calTile(iso) {
    if (!validISO(iso)) return `<div class="cal tbd" aria-label="Date to be decided"><div class="cal-mon">Date</div><div class="cal-day">TBD</div></div>`;
    const d = parseISO(iso);
    const yr = d.getFullYear() !== new Date().getFullYear() ? ` ’${String(d.getFullYear()).slice(2)}` : "";
    return `<div class="cal" aria-label="${esc(fmtDate(iso, true))}"><div class="cal-mon">${esc(d.toLocaleDateString(undefined, { month: "short" }))}${yr}</div><div class="cal-day">${d.getDate()}</div><div class="cal-dow">${esc(d.toLocaleDateString(undefined, { weekday: "short" }))}</div></div>`;
  }

  function renderNext(todo, planned, total) {
    const el = $("#next");
    const w = state.canWrite;
    if (state.mode === "loading") { el.innerHTML = `<div class="card next empty"><div class="empty-icon">${ICON.flag}</div><div class="next-body"><span class="eyebrow">Next up</span><p>Loading your list…</p></div></div>`; return; }
    const next = planned[0];
    if (next) {
      const dated = validISO(next.plannedFor);
      const late = dated && daysUntil(next.plannedFor) < 0;
      const more = planned.length - 1;
      el.innerHTML = `
        <div class="card next">
          ${calTile(next.plannedFor)}
          <div class="next-body">
            <div class="next-head"><span class="eyebrow">Next up</span>${dated ? `<span class="pill${late ? " late" : ""}">${countdown(next.plannedFor)}</span>` : ""}</div>
            <h2>${esc(next.title)}</h2>
            ${next.planNote ? `<p>${esc(next.planNote)}</p>` : ""}
            ${late ? `<p>That date has passed. Did you go?</p>` : ""}
            ${w ? `<div class="actions">
              <button type="button" class="btn success" data-act="open" data-kind="done" data-where="hero" data-id="${esc(next.id)}">${ICON.check} We did it</button>
              <button type="button" class="btn" data-act="open" data-kind="plan" data-where="hero" data-id="${esc(next.id)}">${ICON.cal} ${dated ? "Change date" : "Pick a date"}</button>
              <button type="button" class="btn ghost" data-act="unplan" data-id="${esc(next.id)}">Unplan</button>
            </div>` : ""}
            ${more > 0 ? `<button type="button" class="text-btn" data-act="filter" data-filter="planned" style="align-self:flex-start;margin-top:6px">${more} more planned</button>` : ""}
          </div>
          ${editorFor(next, "hero")}
        </div>`;
      return;
    }
    const sug = state.suggestion && todo.find((x) => x.id === state.suggestion);
    if (sug) {
      el.innerHTML = `
        <div class="card next">
          <div class="cal tbd"><div class="cal-mon">Pick</div><div class="cal-day" style="color:var(--accent-ink)">${ICON.dice.replace('<svg ', '<svg style="width:26px;height:26px" ')}</div></div>
          <div class="next-body">
            <div class="next-head"><span class="eyebrow">How about this one?</span><span class="pill">Random pick of ${todo.length}</span></div>
            <h2>${esc(sug.title)}</h2>
            ${sug.notes ? `<p>${esc(sug.notes)}</p>` : ""}
            ${w ? `<div class="actions">
              <button type="button" class="btn primary" data-act="open" data-kind="plan" data-where="hero" data-id="${esc(sug.id)}">${ICON.cal} Plan this one</button>
              ${todo.length > 1 ? `<button type="button" class="btn" data-act="pick">Pick another</button>` : ""}
              <button type="button" class="btn ghost" data-act="clear-pick">Not now</button>
            </div>` : ""}
          </div>
          ${editorFor(sug, "hero")}
        </div>`;
      return;
    }
    let title, msg, icon = ICON.flag, action = "";
    if (!total) { title = "Start your list"; msg = "Add the things you want to do together below. Your next adventure will show up here."; }
    else if (!todo.length) { title = "All done!"; msg = "You've ticked off everything on the list. Time to dream up more."; icon = ICON.trophy; }
    else {
      title = "Nothing planned yet";
      msg = `${todo.length} ${todo.length === 1 ? "activity is" : "activities are"} waiting for a date.`;
      if (w) action = `<button type="button" class="btn primary" data-act="pick">${ICON.dice.replace('<svg ', '<svg style="width:16px;height:16px" ')} Pick one for us</button>`;
    }
    el.innerHTML = `<div class="card next empty"><div class="empty-icon">${icon}</div><div class="row"><div class="next-body"><strong>${title}</strong><p>${msg}</p></div>${action}</div></div>`;
  }

  function menuHTML(item) {
    const id = esc(item.id), done = item.status === "done", planned = item.status === "planned";
    const b = (act, icon, label, extra = "", cls = "") => `<button type="button" role="menuitem" class="${cls}" data-act="${act}" data-id="${id}" ${extra}>${icon}${label}</button>`;
    const items = done
      ? [b("open", ICON.edit, "Edit", 'data-kind="edit" data-where="list"'), b("undo", ICON.undo, "Mark as not done")]
      : [
          b("open", ICON.check, "Mark as done", 'data-kind="done" data-where="list"'),
          b("open", ICON.cal, planned ? "Change date" : "Plan it", 'data-kind="plan" data-where="list"'),
          planned ? b("unplan", ICON.x, "Unplan") : "",
          b("open", ICON.edit, "Edit", 'data-kind="edit" data-where="list"'),
        ];
    return `<div class="menu" role="menu">${items.join("")}<div class="sep"></div>${b("open", ICON.trash, "Delete", 'data-kind="delete" data-where="list"', "danger")}</div>`;
  }

  function itemHTML(item) {
    const w = state.canWrite, id = esc(item.id), done = item.status === "done", planned = item.status === "planned";
    const meta = [];
    if (item.category) meta.push(`<span class="cat" style="--dot:${catColor(item.category)}"><i></i>${esc(item.category)}</span>`);
    if (planned) {
      const late = validISO(item.plannedFor) && daysUntil(item.plannedFor) < 0;
      meta.push(`<span class="when${late ? " late" : ""}">${ICON.cal}${validISO(item.plannedFor) ? `${esc(fmtDate(item.plannedFor, true))} · ${countdown(item.plannedFor)}` : "Planned · date TBD"}</span>`);
    }
    if (done && validISO(item.doneOn)) meta.push(`<span>Done ${esc(fmtDate(item.doneOn))}</span>`);
    const who = done ? avatar(item.doneBy || item.addedBy, "Ticked off") : avatar(item.addedBy, "Added");
    if (who) meta.push(who);
    const menuOpen = state.menu === item.id;
    return `
      <li class="item${done ? " done" : ""}">
        <button type="button" class="check" ${w ? "" : "disabled"} data-act="${done ? "undo" : "open"}" data-kind="done" data-where="list" data-id="${id}" aria-label="${done ? "Mark as not done" : "Mark as done"}: ${esc(item.title)}">${ICON.check}</button>
        <div class="body">
          <span class="title">${esc(item.title)}</span>
          ${item.notes ? `<span class="notes">${esc(item.notes)}</span>` : ""}
          ${done && item.memory ? `<span class="memory">${esc(item.memory)}</span>` : ""}
          ${meta.length ? `<span class="meta">${meta.join("")}</span>` : ""}
        </div>
        <div class="side">
          ${done ? `<span class="stamp${state.fresh.has(item.id) ? " fresh" : ""}">Done</span>` : ""}
          ${w && !done && !planned ? `<button type="button" class="btn ghost quick" data-act="open" data-kind="plan" data-where="list" data-id="${id}">${ICON.cal} Plan</button>` : ""}
          ${w ? `<div class="menu-wrap">
            <button type="button" class="icon-btn" data-act="menu" data-id="${id}" aria-haspopup="menu" aria-expanded="${menuOpen}" aria-label="More actions for ${esc(item.title)}">${ICON.dots}</button>
            ${menuOpen ? menuHTML(item) : ""}
          </div>` : ""}
        </div>
        ${editorFor(item, "list")}
      </li>`;
  }

  function captureDrafts() {
    const drafts = {};
    document.querySelectorAll("[data-editor] input").forEach((i) => { drafts[i.closest("[data-editor]").dataset.editor + "|" + i.name] = i.value; });
    const a = document.activeElement;
    const focus = a && a.closest && a.closest("[data-editor]") ? a.closest("[data-editor]").dataset.editor + "|" + a.name : null;
    return { drafts, focus };
  }
  function restoreDrafts({ drafts, focus }) {
    document.querySelectorAll("[data-editor] input").forEach((i) => {
      const k = i.closest("[data-editor]").dataset.editor + "|" + i.name;
      if (k in drafts) i.value = drafts[k];
      if (k === focus) i.focus();
    });
  }

  function render() {
    const saved = captureDrafts();
    const items = state.items.filter((x) => x && typeof x.title === "string");
    const todo = items.filter((x) => x.status !== "done" && x.status !== "planned").sort(byCreated);
    const planned = items.filter((x) => x.status === "planned").sort(byPlanned);
    const done = items.filter((x) => x.status === "done").sort(byDone);
    const total = items.length;
    if (state.menu && !items.some((x) => x.id === state.menu)) state.menu = null;

    const pct = total ? Math.round((done.length / total) * 100) : 0;
    $("#ring-fill").setAttribute("stroke-dashoffset", (157.08 * (1 - pct / 100)).toFixed(2));
    $("#ring-pct").textContent = pct + "%";
    $("#ring").setAttribute("aria-label", `${done.length} of ${total} done`);
    $("#summary").innerHTML = state.mode === "loading" ? "Loading…"
      : total ? `<b>${done.length}</b> of <b>${total}</b> done · <b>${planned.length}</b> planned · <b>${todo.length}</b> to go`
      : "Things we want to do together";

    const notice = $("#notice");
    let n = "";
    if (state.mode === "local") n = "Saved in this browser only. Publish this page as a Claude artifact to share the list with your friend.";
    else if (state.mode === "unavailable") n = "The shared list isn't available in this view. Open it on claude.ai while signed in.";
    else if (state.mode === "db" && !state.canWrite) n = "You can view this list. To add or tick off activities, ask the owner to share it with you as an Editor.";
    notice.innerHTML = n ? `${ICON.info}<span>${esc(n)}</span>` : ""; notice.hidden = !n;

    $("#add").hidden = !state.canWrite || state.mode === "unavailable" || state.mode === "loading";
    $("#cats").innerHTML = [...new Set(items.map((x) => (x.category || "").trim()).filter(Boolean))].sort().map((c) => `<option value="${esc(c)}">`).join("");

    renderNext(todo, planned, total);

    const tabs = [["todo", "To do", todo.length], ["planned", "Planned", planned.length], ["done", "Done", done.length], ["all", "All", total]];
    $("#tabs").innerHTML = tabs.map(([k, label, c]) => `<button type="button" role="tab" data-act="filter" data-filter="${k}" aria-selected="${state.filter === k}">${label}<span class="n">${c}</span></button>`).join("");

    const shown = state.filter === "todo" ? todo : state.filter === "planned" ? planned : state.filter === "done" ? done : [...planned, ...todo, ...done];
    $("#list").innerHTML = state.mode === "loading"
      ? `<li class="skeleton" aria-hidden="true"><i style="width:62%"></i><i style="width:44%"></i><i style="width:55%"></i></li>`
      : shown.map(itemHTML).join("");

    const empty = $("#list-empty");
    let e = "";
    if (state.mode !== "loading" && !shown.length) {
      if (!total) e = `<strong>Your list is empty</strong><span>Add activities one at a time above, or paste your whole list in one go.</span>`;
      else if (state.filter === "todo") e = `<strong>Nothing left to do</strong><span>Everything is planned or done.</span>`;
      else if (state.filter === "planned") e = `<strong>Nothing planned</strong><span>Open the ⋯ menu on any activity and choose “Plan it”.</span>`;
      else if (state.filter === "done") e = `<strong>Nothing ticked off yet</strong><span>Mark your first activity as done and it shows up here.</span>`;
    }
    empty.innerHTML = e; empty.hidden = !e;

    restoreDrafts(saved);
    fillAvatars();
  }

  /* ---------- actions ---------- */
  function find(id) { return state.items.find((x) => x.id === id); }
  function editorValues(id) {
    const box = document.querySelector(`[data-editor="${CSS.escape(id)}"]`);
    const v = {}; if (box) box.querySelectorAll("input").forEach((i) => (v[i.name] = i.value.trim()));
    return v;
  }
  function openEditor(id, kind, where) {
    state.editor = { id, kind, where }; state.menu = null; render();
    const box = document.querySelector(`[data-editor="${CSS.escape(id)}"]`);
    const first = box && box.querySelector("input, button"); if (first) first.focus();
  }

  document.addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-act]");
    if (state.menu && !ev.target.closest(".menu-wrap")) { state.menu = null; if (!b) render(); }
    if (!b) return;
    ev.preventDefault();
    const act = b.dataset.act, id = b.dataset.id, item = id && find(id);
    switch (act) {
      case "menu": {
        state.menu = state.menu === id ? null : id; render();
        const first = state.menu && document.querySelector(".menu button"); if (first) first.focus();
        break;
      }
      case "filter": state.filter = b.dataset.filter; safeSet("bucketlist.filter", state.filter); state.editor = null; render(); break;
      case "open": if (item) openEditor(id, b.dataset.kind, b.dataset.where); break;
      case "cancel": state.editor = null; render(); break;
      case "pick": {
        const todo = state.items.filter((x) => x.status !== "done" && x.status !== "planned");
        const pool = todo.length > 1 ? todo.filter((x) => x.id !== state.suggestion) : todo;
        state.suggestion = pool.length ? pool[Math.floor(Math.random() * pool.length)].id : null;
        state.editor = null; render(); break;
      }
      case "clear-pick": state.suggestion = null; state.editor = null; render(); break;
      case "save-plan": {
        const v = editorValues(id);
        const date = validISO(v.date) ? v.date : null;
        state.editor = null; state.suggestion = null;
        if (await updateItem(id, { status: "planned", plannedFor: date, planNote: v.planNote || "" })) toast(date ? `Planned for ${fmtDate(date, true)}.` : "Added to your plans.");
        render(); break;
      }
      case "unplan": state.editor = null; state.menu = null; await updateItem(id, { status: "todo", plannedFor: null, planNote: "" }); render(); break;
      case "save-done": {
        const v = editorValues(id);
        const date = validISO(v.date) ? v.date : todayISO();
        state.editor = null; state.fresh.add(id);
        if (await updateItem(id, { status: "done", doneOn: date, doneAt: Date.now(), memory: v.memory || "", doneBy: state.me || null })) toast(`Ticked off: ${item ? item.title : "activity"}.`);
        render(); setTimeout(() => state.fresh.delete(id), 1500); break;
      }
      case "undo": state.editor = null; state.menu = null; await updateItem(id, { status: "todo", doneOn: null, doneAt: null, doneBy: null, plannedFor: null }); render(); break;
      case "save-edit": {
        const v = editorValues(id);
        if (!v.title) { toast("Give the activity a name first."); break; }
        const patch = { title: v.title, category: v.category || "", notes: v.notes || "" };
        if ("memory" in v) patch.memory = v.memory;
        state.editor = null; await updateItem(id, patch); render(); break;
      }
      case "confirm-delete": state.editor = null; if (state.suggestion === id) state.suggestion = null; await removeItem(id); render(); break;
    }
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (state.menu) { const id = state.menu; state.menu = null; render(); const t = document.querySelector(`[data-act="menu"][data-id="${CSS.escape(id)}"]`); if (t) t.focus(); }
      else if (state.editor) { state.editor = null; render(); }
    }
    if (ev.key === "Enter" && ev.target.matches("[data-editor] input")) {
      ev.preventDefault();
      const save = ev.target.closest("[data-editor]").querySelector("[data-act^='save'], [data-act='confirm-delete']"); if (save) save.click();
    }
  });

  function baseItem(title, category, i = 0) {
    return { title, category, notes: "", status: "todo", plannedFor: null, planNote: "", doneOn: null, doneAt: null, memory: "", createdAt: Date.now() + i, addedBy: state.me || null, doneBy: null };
  }
  $("#add").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!$("#bulk-row").hidden) return $("#bulk-add").click();
    const t = $("#new-title"), c = $("#new-cat");
    const title = t.value.trim(); if (!title) { t.focus(); return; }
    t.value = "";
    if (await addItem(baseItem(title.slice(0, 200), c.value.trim().slice(0, 40)))) {
      if (state.filter !== "todo" && state.filter !== "all") { state.filter = "todo"; safeSet("bucketlist.filter", "todo"); render(); }
    } else t.value = title;
    t.focus();
  });

  function bulkLines() { return $("#bulk-text").value.split(/\r?\n/).map(cleanLine).filter(Boolean).map((l) => l.slice(0, 200)); }
  function setBulk(on) {
    $("#bulk-row").hidden = !on; $("#single-row").hidden = on; $("#bulk-add").hidden = !on; $("#bulk-hint").hidden = !on;
    $("#toggle-bulk").textContent = on ? "Add one at a time" : "Paste a whole list";
    if (on) { $("#bulk-text").focus(); updateBulkHint(); } else $("#new-title").focus();
  }
  function updateBulkHint() { const n = bulkLines().length; $("#bulk-hint").textContent = n ? `${n} ${n === 1 ? "activity" : "activities"} found` : "One per line"; $("#bulk-add").disabled = !n; }
  $("#toggle-bulk").addEventListener("click", () => setBulk($("#bulk-row").hidden));
  $("#bulk-text").addEventListener("input", updateBulkHint);
  $("#bulk-add").addEventListener("click", async () => {
    const lines = bulkLines(); if (!lines.length) return;
    const btn = $("#bulk-add"); btn.disabled = true; btn.textContent = "Adding…";
    let ok = 0;
    for (let i = 0; i < lines.length; i++) { if (await addItem(baseItem(lines[i], "", i))) ok++; else break; }
    btn.textContent = "Add all";
    if (ok) { $("#bulk-text").value = ""; toast(`Added ${ok} ${ok === 1 ? "activity" : "activities"}.`); setBulk(false); state.filter = "todo"; render(); }
    updateBulkHint();
  });

  /* ---------- boot ---------- */
  function startLocal() { state.mode = "local"; state.items = readLocal(); render(); }

  function subscribe(retried) {
    col.onSnapshot((snap) => {
      state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (state.mode === "loading") state.mode = "db";
      render();
    }, (err) => {
      if (err && err.code === "unavailable" && !retried) { setTimeout(() => subscribe(true), 2000); return; }
      if (err && err.code === "revoked") { state.canWrite = false; render(); return; }
      toast("Lost the connection to your shared list. Reload the page to reconnect.");
    });
  }

  async function boot() {
    render();
    if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    userNs = user;
    if (!db) { state.mode = "unavailable"; state.canWrite = false; render(); return; }
    if (user) {
      state.me = await user.id();
      if ((await user.can("data.write")) === false) state.canWrite = false;
    }
    col = db.collection("activities");
    subscribe(false);
  }
  boot();
})();
</script>
