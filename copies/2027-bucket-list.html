        break;
      }
      case "color": { const p = state.pop; if (!p) break; closePop(true); await update("categories", p.cat, { color: Number(b.dataset.v) }); break; }
      case "open-manager": openManager(); break;
      case "open-sheet": if (item) openSheetFrom(id, b); break;
      case "changes-seen": state.changes.dismissed = true; markSeen(); render(); break;
      case "changes-more": state.changes.all = true; render(); break;
      case "close-dialog": closeDialog(); break;
      case "complete": if (item) complete(item, state.filter === "all" ? null : statusOf(item)); break;
      case "uncomplete": if (item) { state.linger.delete(id); uncomplete(item); } break;
      case "unstamp": if (item && statusOf(item) === "done") uncomplete(item); break;
      case "cancel-plan": if (item && statusOf(item) === "planned") cancelPlan(item); break;
      case "reschedule": if (item) openSheet(id, "plannedFor"); break;
      case "hero-done": {
        if (!item) break;
        state.heroStamp = id; state.heroT0 = Date.now(); state.heroLeave = 0;
        setTimeout(() => { if (state.heroStamp === id) { state.heroLeave = Date.now(); render(); } }, 1500);
        setTimeout(() => { if (state.heroStamp === id) { state.heroStamp = null; state.heroLeave = 0; state.docEnter = Date.now(); render(); } }, 1780);
        complete(item, null); break;
      }
      case "pick": {
        const todo = state.items.filter((x) => x && typeof x.title === "string" && statusOf(x) === "todo" && matchesCat(x));
        const pool = todo.length > 1 ? todo.filter((x) => x.id !== state.suggestion) : todo;
        const chosen = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
        state.suggestion = chosen ? chosen.id : null;
        if (chosen && todo.length > 1 && !reduceMotion()) {
          // Spin through other names, land on the pick; one more name peeks in as the reel overshoots.
          const others = todo.filter((x) => x.id !== chosen.id), names = [];
          let last = null;
          for (let i = 0; i < 11; i++) {
            let n; do { n = others[Math.floor(Math.random() * others.length)]; } while (others.length > 1 && n === last);
            names.push(n.title); last = n;
          }
          names.push(chosen.title, others[Math.floor(Math.random() * others.length)].title);
          const t0 = Date.now();
          state.shuffle = { t0, names };
          setTimeout(() => { if (state.shuffle && state.shuffle.t0 === t0) { state.shuffle = null; state.landedAt = Date.now(); render(); } }, 1350);
        }
        render(); break;
      }
      case "clear-pick": state.suggestion = null; render(); break;
      case "plan-pick": if (item) { state.suggestion = null; if (await updateItem(id, { status: "planned" })) openSheet(id); } break;
      case "set-status": {
        const it = find(state.sheet), v = b.dataset.v; if (!it || statusOf(it) === v) break;
        state.cal.open = null;
        // Planning from the sheet opens the calendar, the same as the Plan button on a row.
        if (v === "planned" && !validISO(it.plannedFor)) openCal("plannedFor", null);
        // Keep anything typed but not yet saved (a date, plan notes) by saving it with the status.
        const edits = sheetChanges();
        if ("title" in edits && !edits.title) delete edits.title;
        if (v === "done") { state.fresh.set(it.id, Date.now()); setTimeout(() => state.fresh.delete(it.id), 2000); await updateItem(it.id, { ...edits, status: "done", doneOn: edits.doneOn || it.doneOn || todayISO(), doneAt: Date.now(), doneBy: state.me || null }); }
        else await updateItem(it.id, { ...edits, ...(statusOf(it) === "done" ? { status: v, doneOn: null, doneAt: null, doneBy: null } : { status: v }) });
        break;
      }
      case "quick-date": {
        const input = $('#dialog-root [data-field="plannedFor"]'); if (!input) break;
        const dt = new Date();
        if (b.dataset.v === "weekend") { const day = dt.getDay(); dt.setDate(dt.getDate() + (day === 0 ? 0 : 6 - day)); input.value = iso(dt); }
        else if (b.dataset.v === "month") { dt.setMonth(dt.getMonth() + 1); input.value = iso(dt); }
        else input.value = "";
        if (state.cal.open === "plannedFor") openCal("plannedFor", input.value);
        renderCalendars(); updateSaveState(); break;
      }
      case "cal-toggle": {
        const f = b.dataset.for, inp = $(`#dialog-root [data-field="${f}"]`);
        if (state.cal.open === f) state.cal.open = null; else openCal(f, inp && inp.value);
        renderCalendars(); break;
      }
      case "cal-prev": case "cal-next": {
        const step = act === "cal-next" ? 1 : -1, d0 = new Date(state.cal.y, state.cal.m + step, 1);
        state.cal.y = d0.getFullYear(); state.cal.m = d0.getMonth(); renderCalendars(); break;
      }
      case "cal-today": { const t = new Date(); state.cal.y = t.getFullYear(); state.cal.m = t.getMonth(); renderCalendars(); break; }
      case "cal-pick": {
        const f = b.dataset.for, inp = $(`#dialog-root [data-field="${f}"]`); if (!inp) break;
        inp.value = b.dataset.v; state.cal.open = null;
        renderCalendars(); updateSaveState();
        const trig = $(`#dialog-root .dp-trigger[data-for="${f}"]`); if (trig) trig.focus({ preventScroll: true });
        break;
      }
      case "plan-row": {
        if (!item) break;
        const prev = statusOf(item);
        state.filter = "planned"; safeSet("bucketlist.filter", "planned");
        if (prev !== "planned" && !(await updateItem(id, { status: "planned" }))) { render(); break; }
        openSheet(id, "plannedFor");
        if (prev !== "planned") toast(`Moved “${item.title}” to Planned`, () => updateItem(id, { status: prev }));
        break;
      }
      case "swipe-delete": {
        const li = b.closest("li.row"); if (item && li) swipeDelete(id, li);
        break;
      }
      case "sheet-save": saveSheet(b.dataset.close === "1"); break;
      case "sheet-discard": closeDialog(true); break;
      case "paste-cancel": state.paste = null; render(); $("#new-title").focus(); break;
      case "paste-add": {
        if (needsCategory()) { askForCategory("paste"); break; }
        const lines = state.paste || [], cat = state.composerCat;
        state.paste = null; state.composerCat = ""; render();
        let ok = 0;
        for (let i = 0; i < lines.length; i++) { if (await add("activities", baseItem(lines[i], cat, i))) ok++; else break; }
        if (ok) { toast(`Added ${plural(ok, "activity", "activities")}`); if (state.filter !== "all") { state.filter = "todo"; safeSet("bucketlist.filter", "todo"); render(); } }
        break;
      }

      /* checklist */
      case "task-add": {
        if (!item) break;
        const key = `task:${b.dataset.where}:${id}`, input = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
        const text = input ? input.value.trim() : "";
        if (!text) { if (input) input.focus(); break; }
        input.value = ""; input.defaultValue = "";
        if (!(await addTask(item, text))) { const i = document.querySelector(`[data-key="${CSS.escape(key)}"]`); if (i) i.value = text; }
        focusKey(key); break;
      }
      case "task-suggest": if (item) await addTask(item, b.dataset.text); break;
      case "task-toggle": if (task) await updateItem(id, { checklist: { [tid]: { done: !task.done, doneBy: !task.done ? state.me || null : null } } }); break;
      case "task-del": if (task) await updateItem(id, { checklist: { [tid]: null } }); break;

      /* categories */
      case "cat-add": {
        const input = $("#cat-new"), name = input ? input.value.trim().slice(0, 40) : "";
        if (!name) { if (input) input.focus(); break; }
        const clash = catByName(name);
        if (clash) { toast(`There's already a category called “${clash.name}”.`); break; }
        const used = new Set(state.cats.map(colorIndex));
        let color = 1; while (used.has(color) && color < COLORS) color++;
        if (used.has(color)) color = (state.cats.length % COLORS) + 1;
        const order = state.cats.reduce((m, k) => Math.max(m, Number(k.order) || 0), 0) + 1;
        input.value = ""; input.defaultValue = "";
        if (!(await add("categories", { name, color, order }))) { const i = $("#cat-new"); if (i) i.value = name; }
        focusKey("cat:new"); break;
      }
      case "cat-del": state.catConfirm = b.dataset.cat; render(); break;
      case "cat-keep": state.catConfirm = null; render(); break;
      case "cat-confirm-del": {
        const cid = b.dataset.cat; state.catConfirm = null;
        if (state.catFilter === cid) { state.catFilter = ""; safeSet("bucketlist.cat", ""); }
        if (state.composerCat === cid) state.composerCat = "";
        await remove("categories", cid); render(); break;
      }
    }
  });

  document.addEventListener("keydown", (ev) => {
    const t = ev.target;
    if (ev.key === "Escape") {
      if (state.swipeOpen && !state.sheet && !state.manager) { closeSwipe(); return; }
      if (state.pop) { ev.preventDefault(); closePop(true); }
      else if (state.catConfirm) { state.catConfirm = null; render(); }
      else if (state.sheetLeave) { state.sheetLeave = false; render(); }
      else if (state.sheet || state.manager) closeDialog();
      else if (state.paste) { state.paste = null; render(); }
      return;
    }
    if (state.pop && t.closest && t.closest("#pop")) {
      const btns = $$("#pop button"), i = btns.indexOf(t);
      if (ev.key === "ArrowDown" || ev.key === "ArrowRight") { ev.preventDefault(); btns[(i + 1) % btns.length].focus(); }
      else if (ev.key === "ArrowUp" || ev.key === "ArrowLeft") { ev.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
      else if (ev.key === "Tab") closePop();
      return;
    }
    if ((ev.metaKey || ev.ctrlKey) && (ev.key === "s" || ev.key === "S") && state.sheet) { ev.preventDefault(); saveSheet(false); return; }
    const typing = t.matches && t.matches("input, textarea, select, [contenteditable]");
    if (!typing && !ev.metaKey && !ev.ctrlKey && !ev.altKey && (ev.key === "n" || ev.key === "N") && !state.sheet && !state.manager && !$("#add-area").hidden) {
      ev.preventDefault(); $("#new-title").focus(); return;
    }
    if (ev.key !== "Enter" || !t.matches) return;
    if (t.matches("[data-key^='task:']")) { ev.preventDefault(); const btn = t.parentElement.querySelector("[data-act='task-add']"); if (btn) btn.click(); }
    else if (t.id === "cat-new") { ev.preventDefault(); const btn = $("[data-act='cat-add']"); if (btn) btn.click(); }
    else if (t.matches("[data-cat-name]")) { ev.preventDefault(); t.blur(); }
    else if (t.matches("#dialog-root .title-input, #dialog-root input.fp")) { ev.preventDefault(); saveSheet(false); }
  });
  document.addEventListener("change", (ev) => { if (ev.target.matches && ev.target.matches("#dialog-root [data-field]")) updateSaveState(); });
  document.addEventListener("focusout", (ev) => { if (ev.target.matches && ev.target.matches("[data-cat-name]")) saveCatName(ev.target); });
  document.addEventListener("input", (ev) => {
    if (ev.target.classList && ev.target.classList.contains("autogrow")) grow(ev.target);
    if (ev.target.matches && ev.target.matches("#dialog-root [data-field]")) updateSaveState();
  });
  document.addEventListener("scroll", () => placePop(), true);
  addEventListener("resize", () => { placePop(); $$(".seg").forEach(syncSeg); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { $$(".seg").forEach(syncSeg); redrawAll(); });

  $("#composer").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const inp = $("#new-title"), title = inp.value.replace(/\s+/g, " ").trim();
    if (!title) { inp.focus(); return; }
    if (needsCategory()) { askForCategory("single"); return; }
    inp.value = "";
    if (await add("activities", baseItem(title.slice(0, 200), state.composerCat))) {
      state.composerCat = "";
      if (state.filter === "planned" || state.filter === "done") { state.filter = "todo"; safeSet("bucketlist.filter", "todo"); }
      render();
    } else inp.value = title;
    inp.focus();
  });
  $("#new-title").addEventListener("paste", (ev) => {
    const text = (ev.clipboardData && ev.clipboardData.getData("text")) || "";
    const lines = text.split(/\r?\n/).map(cleanLine).filter(Boolean).map((l) => l.slice(0, 200));
    if (lines.length < 2) return;
    ev.preventDefault(); state.paste = lines; renderPaste();
  });

  /* ---------- swipe left to delete, like Apple's lists ---------- */
  const SWIPE_W = 88;
  let sw = null, wh = null, suppressClick = false;
  function closeSwipe() {
    if (!state.swipeOpen) return;
    state.swipeOpen = null;
    $$("#list li.swiped").forEach((li) => { li.classList.add("swiping"); li.classList.remove("swiped"); setTimeout(() => li.classList.remove("swiping"), 360); });
  }
  async function deleteWithUndo(item) {
    const { id, ...data } = item;
    if (state.suggestion === id) state.suggestion = null;
    const ok = await remove("activities", id);
    if (ok) toast(`Deleted “${item.title}”`, () => setDoc("activities", id, data));
    return ok;
  }
  function swipeDelete(id, li) {
    const item = find(id); if (!item || state.swipeGone.has(id)) return;
    state.swipeOpen = null; state.swipeGone.add(id);
    li.classList.remove("swiped"); li.classList.add("swipe-gone");
    setTimeout(async () => { const ok = await deleteWithUndo(item); state.swipeGone.delete(id); if (!ok) render(); }, 460);
  }
  function startSwipe(li) {
    const id = li.dataset.row;
    if (state.swipeOpen && state.swipeOpen !== id) closeSwipe();
    const inner = li.querySelector(".row-inner");
    inner.style.transition = "none";
    li.classList.add("swiping");
    return { id, li, inner, base: li.classList.contains("swiped") ? -SWIPE_W : 0, x: 0 };
  }
  function dragTo(s, x) {
    const W = s.li.offsetWidth;
    s.x = Math.max(-W, Math.min(0, x));
    s.inner.style.transform = `translateX(${s.x}px)`;
    s.li.style.setProperty("--reveal", `${-s.x}px`);
    s.li.classList.toggle("swipe-full", -s.x > W * 0.55);
  }
  function settleSwipe(s) {
    const { id, li, inner, x } = s, W = li.offsetWidth;
    inner.style.transition = ""; void inner.offsetWidth;
    inner.style.transform = ""; li.style.removeProperty("--reveal"); li.classList.remove("swipe-full");
    if (-x > W * 0.55) { swipeDelete(id, li); return; }
    if (-x > SWIPE_W / 2) { state.swipeOpen = id; li.classList.add("swiped"); }
    else { if (state.swipeOpen === id) state.swipeOpen = null; li.classList.remove("swiped"); }
    setTimeout(() => li.classList.remove("swiping"), 360);
  }
  const listEl = $("#list");
  listEl.addEventListener("pointerdown", (e) => {
    if (!state.canWrite || (e.pointerType === "mouse" && e.button !== 0)) return;
    const li = e.target.closest("li.row[data-row]");
    if (!li || e.target.closest(".swipe-del") || state.swipeGone.has(li.dataset.row)) return;
    sw = { li, x0: e.clientX, y0: e.clientY, pid: e.pointerId, s: null };
  });
  listEl.addEventListener("pointermove", (e) => {
    if (!sw || e.pointerId !== sw.pid) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.s) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.3) { sw.s = startSwipe(sw.li); try { sw.li.setPointerCapture(e.pointerId); } catch {} }
      else if (Math.abs(dy) > 10) { sw = null; return; }
      else return;
    }
    e.preventDefault();
    dragTo(sw.s, sw.s.base + dx);
  });
  const endSwipe = (e) => {
    if (!sw || e.pointerId !== sw.pid) return;
    const s = sw.s; sw = null;
    if (!s) return;
    suppressClick = true; setTimeout(() => (suppressClick = false), 80);
    settleSwipe(s);
  };
  listEl.addEventListener("pointerup", endSwipe);
  listEl.addEventListener("pointercancel", endSwipe);
  // Two-finger swipes on a trackpad arrive as sideways scrolling.
  listEl.addEventListener("wheel", (e) => {
    if (!state.canWrite || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    const li = e.target.closest("li.row[data-row]");
    if (!li || state.swipeGone.has(li.dataset.row)) return;
    e.preventDefault();
    if (!wh || wh.li !== li) { if (wh) { clearTimeout(wh.t); settleSwipe(wh); } wh = startSwipe(li); wh.acc = 0; }
    wh.acc += e.deltaX;
    dragTo(wh, wh.base - wh.acc);
    clearTimeout(wh.t);
    wh.t = setTimeout(() => { const s = wh; wh = null; settleSwipe(s); }, 160);
  }, { passive: false });
  // A drag shouldn't also count as a click, and tapping elsewhere closes an open swipe.
  listEl.addEventListener("click", (e) => {
    if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); return; }
    if (state.swipeOpen && !e.target.closest(".swipe-del")) { closeSwipe(); e.stopPropagation(); e.preventDefault(); }
  }, true);

  /* ---------- boot ---------- */
  function startLocal() {
    state.mode = "local";
    let cats = readLocal("categories");
    if (!cats) cats = LOCAL_STARTER_CATS.map(([name, color], i) => ({ id: newId(), name, color, order: i + 1 }));
    let items = readLocal("activities") || [];
    // Move older free-text categories onto the category list.
    items = items.map((it) => {
      if (it.categoryId || !it.category || !String(it.category).trim()) return it;
      const name = String(it.category).trim();
      let k = cats.find((x) => x.name.toLowerCase() === name.toLowerCase());
      if (!k) { k = { id: newId(), name, color: (cats.length % COLORS) + 1, order: cats.length + 1 }; cats.push(k); }
      return { ...it, categoryId: k.id, category: "" };
    });
    state.catsLoaded = true;
    writeLocal("categories", cats, true);
    writeLocal("activities", items, true);
    render();
  }
  const reduceMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  /* ---------- no pinch zoom on phones ---------- */
  // The layout already fits the screen. Safari ignores the page's no-zoom setting, so the
  // pinch itself is blocked here (two fingers moving, or Safari's own gesture events).
  for (const type of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  /* ---------- pull a sheet down to close it (phones) ---------- */
  // Only from the strip at the top with the handle, so scrolling or tapping the content
  // never moves the panel. Closing goes through the sheet's own close button, so unsaved
  // changes still ask first.
  const HANDLE_ZONE = 32;  // px from the top of the sheet: about a fingertip around the handle
  const pull = { sheet: null };
  const phoneLayout = () => window.matchMedia && matchMedia("(max-width: 600px)").matches;
  document.addEventListener("touchstart", (e) => {
    pull.sheet = null;
    if (e.touches.length !== 1 || !phoneLayout()) return;
    const sheet = e.target.closest && e.target.closest(".scrim.open > .sheet");
    if (!sheet) return;
    const t = e.touches[0];
    if (t.clientY - sheet.getBoundingClientRect().top > HANDLE_ZONE) return;
    Object.assign(pull, { sheet, scrim: sheet.parentElement, x0: t.clientX, y0: t.clientY, dy: 0, on: false, samples: [[performance.now(), t.clientY]] });
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    const d = pull; if (!d.sheet) return;
    const t = e.touches[0], dx = t.clientX - d.x0, dy = t.clientY - d.y0;
    if (!d.on) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      // Only a downward pull.
      if (dy <= 0 || Math.abs(dx) > Math.abs(dy)) { d.sheet = null; return; }
      d.on = true;
      d.sheet.style.transition = "none"; d.scrim.style.transition = "none";
    }
    e.preventDefault();
    d.dy = Math.max(0, t.clientY - d.y0);
    d.sheet.style.transform = `translateY(${d.dy}px)`;
    d.scrim.style.opacity = String(Math.max(0.3, 1 - d.dy / (d.sheet.offsetHeight * 1.4)));
    d.samples.push([performance.now(), t.clientY]); if (d.samples.length > 5) d.samples.shift();
  }, { passive: false });
  function endPull() {
    const d = pull, sheet = d.sheet; pull.sheet = null;
    if (!sheet || !d.on) return;
    const [[t1, y1], [t2, y2]] = [d.samples[0], d.samples[d.samples.length - 1]];
    const speed = t2 > t1 ? (y2 - y1) / (t2 - t1) : 0;  // px per ms, downward is positive
    const close = d.dy > Math.min(140, sheet.offsetHeight * 0.25) || (speed > 0.5 && d.dy > 20);
    sheet.style.transition = ""; d.scrim.style.transition = "";
    const btn = close && sheet.querySelector('[data-act="close-dialog"], [data-fb-close]');
    if (btn && btn.matches("[data-fb-close]")) {
      // This panel closes without its own animation, so slide it away first.
      sheet.style.transform = "translateY(100%)"; d.scrim.style.opacity = "0";
      setTimeout(() => btn.click(), 220);
      return;
    }
    sheet.style.transform = ""; d.scrim.style.opacity = "";
    if (btn) { pull.closing = true; btn.click(); pull.closing = false; }  // slides away, or springs back while asking to save changes
  }
  document.addEventListener("touchend", endPull);
  document.addEventListener("touchcancel", endPull);

  function subscribe(coll, onData, retried) {
    dbNs.collection(coll).onSnapshot((snap) => onData(snap.docs.map((d) => ({ id: d.id, ...d.data() })), snap.metadata || {}), (err) => {
      if (err && err.code === "unavailable" && !retried) { setTimeout(() => subscribe(coll, onData, true), 2000); return; }
      if (err && err.code === "revoked") { state.canWrite = false; render(); return; }
      toast("Lost the connection to your shared list. Reload the page to reconnect.");
    });
  }
  async function boot() {
    render();
    if (!window.claude || typeof window.claude.use !== "function") { startLocal(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    userNs = user;
    if (!db) { state.mode = "unavailable"; state.canWrite = false; render(); return; }
    if (user) {
      state.me = await user.id();
      if ((await user.can("data.write")) === false) state.canWrite = false;
    }
    dbNs = db;
    subscribe("categories", (list) => { state.cats = list; state.catsLoaded = true; render(); });
    subscribe("activities", (list, meta) => { state.items = list; if (state.mode === "loading") state.mode = "db"; render(); checkNew(list, !!meta.fromCache); if (!meta.fromCache) foldPlanNotes(list); });
    if (state.me) watchChanges();
  }
  boot();
})();
</script>
