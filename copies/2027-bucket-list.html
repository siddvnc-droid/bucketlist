<title>2027 Bucket List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Concept: a passport. "Next up" is a travel document on security paper (guilloche + MRZ lines); completed activities become ink stamps.
   Layout: one 760px column — masthead with a three-part gauge, the document, a composer, a status/category toolbar, then the list (or a page of stamps). */
:root {
  --bg: #EFF0ED;
  --surface: #FFFFFF;
  --surface-2: #F6F7F4;
  --surface-3: #E7E9E5;
  --ink: #0F1311;
  --ink-2: #3B423E;
  --muted: #79807B;
  --faint: #A9AEAA;
  --line: #E1E3DF;
  --line-2: #D0D3CE;
  --primary: #15233F;          /* passport navy */
  --on-primary: #F4F6FA;
  --gold: #8F6E28;             /* foil, used for time */
  --done: #1D6A4D;
  --on-done: #FFFFFF;
  --danger: #B3261E;
  --danger-soft: #FAE9E7;
  --focus: #2F5BD3;
  --doc: #E7ECEE;              /* security paper */
  --doc-ink: #14213B;
  --doc-ink-2: #3E4A60;
  --doc-muted: #6A7487;
  --doc-line: #CCD5DA;
  --guill: rgba(21, 35, 63, 0.085);
  --guill-2: rgba(21, 35, 63, 0.11);
  --stamp-blend: multiply;
  --scrim: rgba(12, 16, 14, 0.34);
  --toast-bg: #121614;
  --toast-ink: #F2F4F1;
  --toast-act: #E2C27A;
  --snow: rgba(112, 142, 184, 0.72);
  --cal-bg: #FFFFFF; --cal-ink: #111111; --cal-red: #FF3B30; --swipe-red: #FF3B30;
  --k1: #2E56B8; --k2: #6D45B0; --k3: #B2552B; --k4: #1E7B5A; --k5: #AE3D69; --k6: #667F1E; --k7: #17809A; --k8: #5F6873;
  --shadow-1: 0 1px 2px rgba(15, 19, 17, .05), 0 1px 1px rgba(15, 19, 17, .03);
  --shadow-2: 0 14px 34px -10px rgba(15, 19, 17, .22), 0 4px 10px -4px rgba(15, 19, 17, .08);
  --shadow-3: 0 30px 80px -20px rgba(15, 19, 17, .35), 0 10px 24px -10px rgba(15, 19, 17, .15);
  --doc-shadow: 0 24px 48px -32px rgba(15, 25, 50, .35);
  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Martian Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0C0F; --surface: #12151A; --surface-2: #171B21; --surface-3: #1E232A; --ink: #ECEEF0; --ink-2: #C3C8CE; --muted: #8B929B; --faint: #5D646D;
    --line: #22272E; --line-2: #2E343C; --primary: #E8EBF1; --on-primary: #10141C; --gold: #DDBB72;
    --done: #5CC89B; --on-done: #05140D; --danger: #FF8A80; --danger-soft: #331715; --focus: #8EAEFF;
    --doc: #101A2B; --doc-ink: #EEE8D9; --doc-ink-2: #C9C3B3; --doc-muted: #8D93A1; --doc-line: #243149;
    --guill: rgba(221, 187, 114, 0.085); --guill-2: rgba(221, 187, 114, 0.12); --stamp-blend: normal; --scrim: rgba(0, 0, 0, .6);
    --toast-bg: #ECEEF0; --toast-ink: #111418; --toast-act: #8F6E28; --snow: rgba(255, 255, 255, 0.9); --cal-bg: #1C1C1E; --cal-ink: #FFFFFF; --cal-red: #FF453A; --swipe-red: #FF453A;
    --k1: #86A6F5; --k2: #B99CF0; --k3: #F09A6E; --k4: #62CFA2; --k5: #F08DB4; --k6: #B9D162; --k7: #62CBE3; --k8: #9AA3AE;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .5); --shadow-2: 0 16px 40px -10px rgba(0, 0, 0, .7); --shadow-3: 0 30px 80px -20px rgba(0, 0, 0, .8);
    --doc-shadow: 0 24px 48px -28px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0C0F; --surface: #12151A; --surface-2: #171B21; --surface-3: #1E232A; --ink: #ECEEF0; --ink-2: #C3C8CE; --muted: #8B929B; --faint: #5D646D;
  --line: #22272E; --line-2: #2E343C; --primary: #E8EBF1; --on-primary: #10141C; --gold: #DDBB72;
  --done: #5CC89B; --on-done: #05140D; --danger: #FF8A80; --danger-soft: #331715; --focus: #8EAEFF;
  --doc: #101A2B; --doc-ink: #EEE8D9; --doc-ink-2: #C9C3B3; --doc-muted: #8D93A1; --doc-line: #243149;
  --guill: rgba(221, 187, 114, 0.085); --guill-2: rgba(221, 187, 114, 0.12); --stamp-blend: normal; --scrim: rgba(0, 0, 0, .6);
  --toast-bg: #ECEEF0; --toast-ink: #111418; --toast-act: #8F6E28; --snow: rgba(255, 255, 255, 0.9); --cal-bg: #1C1C1E; --cal-ink: #FFFFFF; --cal-red: #FF453A; --swipe-red: #FF453A;
  --k1: #86A6F5; --k2: #B99CF0; --k3: #F09A6E; --k4: #62CFA2; --k5: #F08DB4; --k6: #B9D162; --k7: #62CBE3; --k8: #9AA3AE;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .5); --shadow-2: 0 16px 40px -10px rgba(0, 0, 0, .7); --shadow-3: 0 30px 80px -20px rgba(0, 0, 0, .8);
  --doc-shadow: 0 24px 48px -28px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* no double-tap zoom: the layout is already sized for the screen */
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 var(--font-ui); letter-spacing: -0.003em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 56px 112px;
}
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.label { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- masthead ---------- */
.masthead { display: flex; flex-direction: column; gap: 14px; }
.mh-top { display: flex; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(46px, 10vw, 72px);
  line-height: .92; letter-spacing: -0.02em; margin: 0; text-wrap: balance;
}
h1 em { font-style: italic; color: var(--ink-2); }
.gauge { display: flex; gap: 3px; height: 6px; margin-top: 8px; }
.gauge i { display: block; border-radius: 3px; min-width: 6px; flex-basis: 0; transition: flex-grow .7s var(--ease); }
.gauge .g-done { background: var(--done); }
.gauge .g-plan { background: var(--gold); }
.gauge .g-todo { background: var(--line-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 7px; height: 7px; border-radius: 50%; }
.legend b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

.notice { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow-1); }
.notice svg { width: 16px; height: 16px; margin-top: 2px; color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 16px;
  border-radius: 11px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 14px; white-space: nowrap; box-shadow: var(--shadow-1);
  transition: background .15s, border-color .15s, transform .12s var(--ease), box-shadow .15s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.97); }
.btn svg { width: 16px; height: 16px; }
.btn.sm { height: 32px; padding: 0 12px; border-radius: 9px; font-size: 13px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, var(--shadow-1); }
.btn.primary:hover { background: color-mix(in srgb, var(--primary) 88%, var(--surface)); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger-text { color: var(--danger); }
.btn.danger-text:hover { background: var(--danger-soft); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--muted); flex: none; transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.sm svg { width: 15px; height: 15px; }
.icon-btn.danger:hover { color: var(--danger); background: var(--danger-soft); }
.kbd { font-family: var(--font-mono); font-size: 10px; color: var(--faint); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; line-height: 1.5; }

/* picker trigger (custom dropdown) */
.picker {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px 0 12px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 500;
  max-width: 100%; min-width: 0; transition: background .15s, border-color .15s; box-shadow: var(--shadow-1);
}
.picker:hover { background: var(--surface-2); }
.picker[aria-expanded="true"] { border-color: var(--ink-2); }
.picker .pl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.picker .pl.placeholder { color: var(--muted); font-weight: 400; }
.picker svg { width: 14px; height: 14px; color: var(--muted); margin-left: auto; }
.picker[disabled] { cursor: default; box-shadow: none; }
.picker.bare { border-color: transparent; box-shadow: none; background: transparent; padding-left: 8px; margin-left: -8px; }
.picker.bare:hover, .picker.bare[aria-expanded="true"] { background: var(--surface-2); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, transparent); flex: none; }
.dot.hollow { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }

/* popover */
#pop {
  position: fixed; z-index: 60; min-width: 232px; max-width: min(320px, calc(100vw - 24px)); max-height: min(380px, 60vh); overflow: auto;
  padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-2);
  opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top left; transition: opacity .14s ease, transform .18s var(--ease);
}
#pop.in { opacity: 1; transform: none; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 9px;
  background: none; text-align: left; font-size: 14px; color: var(--ink);
}
.opt:hover, .opt:focus-visible { background: var(--surface-2); outline: none; }
.opt .ol { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .oc { font-family: var(--font-mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.opt svg { width: 15px; height: 15px; color: var(--ink); }
.opt.quiet { color: var(--ink-2); }
.opt.quiet svg { color: var(--muted); }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-head { padding: 8px 10px 6px; }
.swatches { display: grid; grid-template-columns: repeat(4, 36px); gap: 6px; padding: 6px; }
.swatch-opt { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; }
.swatch-opt::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--dot); transition: transform .15s var(--ease); }
.swatch-opt:hover, .swatch-opt:focus-visible { background: var(--surface-2); }
.swatch-opt:hover::before { transform: scale(1.12); }
.swatch-opt[aria-selected="true"]::before { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--dot); }

/* ---------- the document (next up) ---------- */
.doc {
  position: relative; isolation: isolate; overflow: hidden; border-radius: 20px; background: var(--doc); color: var(--doc-ink);
  border: 1px solid var(--doc-line); box-shadow: var(--shadow-1), var(--doc-shadow);
}
.doc canvas.guill { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.doc-top { display: flex; justify-content: space-between; gap: 12px; padding: 20px 26px 0; }
.doc-top .label { color: var(--doc-muted); }
.doc-top .label b { color: var(--doc-ink); font-weight: 500; }
.doc-grid { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 26px; padding: 18px 26px 4px; align-items: start; }
.doc-date {
  /* styled after Apple's Calendar icon: red weekday over a big date */
  border-radius: 24px; text-align: center; padding: 12px 4px 13px; background: var(--cal-bg);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 10px 26px -14px rgba(15, 25, 50, .45);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.dd-dow { font-family: var(--font-ui); font-size: 12px; font-weight: 600; color: var(--cal-red); letter-spacing: 0; white-space: nowrap; }
.dd-day { font-family: var(--font-ui); font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.05em; color: var(--cal-ink); margin-left: -0.05em; font-variant-numeric: lining-nums; }
.dd-mon { font-family: var(--font-ui); font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.doc-date.tbd .dd-day { color: var(--faint); }
.doc-main { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.doc h2 {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 46px); line-height: 1; letter-spacing: -0.015em;
  margin: 0; text-wrap: balance; overflow-wrap: anywhere;
}
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 14px 22px; margin: 8px 0 0; }
.fields div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fields dt { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--doc-muted); }
.fields dd { margin: 0; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 7px; min-width: 0; }
.fields dd span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fields dd.time { color: var(--gold); }
.fields dd.late { color: var(--danger); }
.doc-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 26px 0; }
.doc .btn:not(.primary):not(.ghost) { background: color-mix(in srgb, var(--surface) 70%, transparent); border-color: var(--doc-line); color: var(--doc-ink); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.doc .btn.ghost { color: var(--doc-ink-2); }
.doc .btn.ghost:hover { background: color-mix(in srgb, var(--doc-ink) 8%, transparent); color: var(--doc-ink); }
.mrz {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.75; letter-spacing: .2em; color: var(--doc-muted);
  white-space: pre; overflow: hidden; padding: 22px 26px 18px; user-select: none; opacity: .85;
}
.doc-idle { padding: 18px 26px 0; display: flex; flex-direction: column; gap: 10px; max-width: 580px; }
.doc-idle h2 { font-size: clamp(36px, 7vw, 52px); }
.doc-idle h2 em { font-style: italic; }
.doc-idle p { margin: 0; color: var(--doc-ink-2); }
.doc-title-btn { all: unset; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: 1px; text-underline-offset: 7px; transition: text-decoration-color .2s; }
.doc-title-btn:hover { text-decoration-color: color-mix(in srgb, var(--doc-ink) 35%, transparent); }
.doc-title-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 6px; }
.fp.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 45%, transparent); border-color: var(--gold); } 100% { box-shadow: 0 0 0 3px transparent; } }

/* the stub: tear-off section holding the checklist */
.stub { position: relative; background: var(--surface); color: var(--ink); padding: 22px 26px 24px; border-top: 1.5px dashed var(--doc-line); }
.stub::before, .stub::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--doc-line); }
.stub::before { left: -11px; } .stub::after { right: -11px; }
.hero-stamp { position: absolute; right: 30px; top: 52px; z-index: 3; pointer-events: none; }

/* ---------- checklist ---------- */
.cl { display: flex; flex-direction: column; gap: 12px; }
.cl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cl-title { font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -0.01em; }
.cl-prog { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cl-bar { width: 84px; height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.cl-bar i { display: block; height: 100%; background: var(--done); border-radius: inherit; transition: width .5s var(--ease); }
.steps { list-style: none; margin: 0 -8px; padding: 0; display: flex; flex-direction: column; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; min-height: 40px; padding: 4px 6px 4px 8px; border-radius: 10px; transition: background .12s; }
.step:hover { background: var(--surface-2); }
.sbox { width: 20px; height: 20px; padding: 0; border-radius: 6px; border: 1.5px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s, color .15s; }
.sbox svg { width: 12px; height: 12px; }
.sbox:hover { border-color: var(--done); color: color-mix(in srgb, var(--done) 55%, transparent); }
.sbox[disabled] { cursor: default; }
.step.done .sbox { background: var(--done); border-color: var(--done); color: var(--on-done); }
.stext { font-size: 14.5px; overflow-wrap: anywhere; line-height: 1.4; transition: color .2s; }
.step.done .stext { color: var(--faint); text-decoration: line-through; text-decoration-thickness: 1px; }
.step .sdel { opacity: 0; transition: opacity .12s; }
.step:hover .sdel, .step:focus-within .sdel { opacity: 1; }
@media (hover: none) { .step .sdel { opacity: 1; } }
.step-add { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line-2); border-radius: 11px; padding: 0 5px 0 12px; height: 42px; transition: border-color .15s, background .15s; }
.step-add:focus-within { border-style: solid; border-color: var(--ink-2); background: var(--surface); }
.step-add > svg { width: 15px; height: 15px; color: var(--muted); }
.step-add input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 100%; font-size: 14px; }
.step-add input::placeholder { color: var(--faint); }
.ideas { display: flex; flex-wrap: wrap; gap: 6px; }
.idea { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); transition: background .15s, border-color .15s; }
.idea:hover { background: var(--surface); border-color: var(--line-2); color: var(--ink); }

/* ---------- composer ---------- */
/* two rows: what to add on top, its category and the Add button underneath */
.composer {
  display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  box-shadow: var(--shadow-1); transition: border-color .15s, box-shadow .2s;
}
.composer:focus-within { border-color: var(--line-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 12%, transparent), var(--shadow-1); }
.composer-top { display: flex; align-items: center; gap: 10px; padding: 7px 14px 5px 16px; }
.composer-top > svg { width: 18px; height: 18px; color: var(--muted); }
.composer input { flex: 1 1 auto; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; font-size: 16px; }
.composer input::placeholder { color: var(--faint); }
.composer-bottom { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-top: 1px solid var(--line); }
.composer .picker { flex: 0 1 auto; min-width: 0; max-width: 280px; }
.composer-hint { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--faint); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer-bottom .btn { flex: none; }
.composer:focus-within .kbd { display: none; }
@media (hover: none) { .kbd { display: none; } }
.paste { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 10px; margin-top: -16px; }
.paste-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.paste-head strong { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.paste-head span { font-size: 13px; color: var(--muted); }
.paste ol { margin: 0; padding-left: 22px; color: var(--ink-2); font-size: 14px; display: grid; gap: 2px; }
.paste ol li::marker { font-family: var(--font-mono); font-size: 11px; color: var(--faint); }
.paste .more { list-style: none; margin-left: -22px; color: var(--muted); }
.paste-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: -12px; scroll-margin-top: 16px; }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-3); }
.seg-ind { position: absolute; left: 0; top: 3px; bottom: 3px; width: 0; border-radius: 9px; background: var(--surface); box-shadow: var(--shadow-1), 0 0 0 1px color-mix(in srgb, var(--line) 60%, transparent); transition: transform .38s var(--ease), width .38s var(--ease); }
.seg.no-anim .seg-ind { transition: none; }
.seg button { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 14px; border: 0; background: none; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--muted); transition: color .2s; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { color: var(--ink); }
.seg button[disabled] { cursor: default; }
.seg .n { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.seg button[aria-selected="true"] .n { color: var(--muted); }

/* ---------- list ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-1); }
#list .card { overflow: hidden; }
.rows { list-style: none; margin: 0; padding: 6px 0; }
.row { position: relative; touch-action: pan-y; }
.row-inner { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 4px; padding: 0 10px 0 16px; background: var(--surface); transition: transform .34s var(--ease); }
.row + .row::before { content: ""; position: absolute; z-index: 2; pointer-events: none; top: 0; left: 60px; right: 18px; height: 1px; background: var(--line); transition: opacity .12s; }
/* swipe left to delete, like Apple's lists */
.swipe-actions { position: absolute; inset: 0; display: flex; justify-content: flex-end; background: var(--swipe-red); visibility: hidden; }
.row.swiping .swipe-actions, .row.swiped .swipe-actions, .row.swipe-gone .swipe-actions { visibility: visible; }
.swipe-del { width: max(88px, var(--reveal, 88px)); height: 100%; border: 0; background: none; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12.5px; font-weight: 600; transition: width .12s; }
.swipe-del svg { width: 19px; height: 19px; }
.row.swipe-full .swipe-del { align-items: flex-start; padding-left: 24px; }
.row.swiped .row-inner { transform: translateX(-88px); }
.row.swipe-gone .row-inner { transform: translateX(-100%) !important; transition: transform .24s ease-in; }
.row.swipe-gone { overflow: hidden; animation: rowOut .3s cubic-bezier(.4, 0, .2, 1) .2s both; }
.row-plan {
  flex: none; align-self: center; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 8px 0 11px; margin-left: 2px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 13px; font-weight: 500;
  transition: background .15s, border-color .15s, color .15s;
}
.row-plan svg { width: 14px; height: 14px; }
.row-plan svg:first-child { color: var(--muted); }
.row-plan:hover { background: var(--surface-2); border-color: var(--line-2); color: var(--ink); }
.row:hover + .row::before, .row:hover::before { opacity: 0; }
.cb { flex: none; width: 34px; height: 34px; margin-top: 8px; display: grid; place-items: center; border: 0; padding: 0; background: none; border-radius: 50%; color: var(--line-2); }
.cb svg { width: 23px; height: 23px; overflow: visible; }
.cb .ring { fill: transparent; stroke: currentColor; stroke-width: 1.5; transition: fill .2s, stroke .2s; }
.cb .tick { fill: none; stroke: var(--done); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset .25s var(--ease), stroke .2s; }
.cb:hover { color: var(--done); }
.cb:hover .tick { stroke-dashoffset: 0; stroke: color-mix(in srgb, var(--done) 55%, transparent); }
.cb.on { color: var(--done); }
.cb.on .ring { fill: var(--done); }
.cb.on .tick { stroke: var(--on-done); stroke-dashoffset: 0; }
.cb.pop { animation: cbPop .45s cubic-bezier(.2, 1.6, .4, 1) var(--t, 0ms) both; }
.cb.pop .tick { animation: tickDraw .3s var(--ease) calc(var(--t, 0ms) + 90ms) both; }
.cb[disabled] { cursor: default; }
@keyframes cbPop { 0% { transform: scale(.82); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }
@keyframes tickDraw { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }
.row-open {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; text-align: left; border: 0; background: none;
  padding: 14px 8px 14px 6px; border-radius: 12px; color: inherit; transition: background .12s;
}
.row:hover .row-open { background: var(--surface-2); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-title { align-self: flex-start; max-width: 100%; font-size: 15.5px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; transition: color .3s; }
.row.is-done .row-title { color: var(--muted); }
.row-meta { display: flex; align-items: center; gap: 5px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); min-width: 0; }
.row-meta > span { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.row-meta .note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; display: block; }
.row-meta svg { width: 13px; height: 13px; }
.row-end { flex: none; display: flex; align-items: center; gap: 12px; color: var(--faint); }
.row-end > svg { width: 16px; height: 16px; opacity: 0; transform: translateX(-4px); transition: opacity .15s, transform .2s var(--ease); }
.row:hover .row-end > svg { opacity: 1; transform: none; }
.when { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.when b { font-size: 11.5px; font-weight: 500; letter-spacing: .1em; color: var(--ink); }
.when span { font-size: 10.5px; color: var(--gold); letter-spacing: .02em; }
.when.late span { color: var(--danger); }
.when.tbd b { color: var(--muted); }
.av { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; background: var(--surface-3); flex: none; }
.row.leaving { overflow: hidden; animation: rowOut .42s cubic-bezier(.4, 0, .2, 1) calc(var(--t, 0ms) + 640ms) both; }
@keyframes rowOut { from { max-height: 180px; opacity: 1; } to { max-height: 0; opacity: 0; } }
.mini-stamp { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-c, var(--done)); border: 1.5px solid currentColor; border-radius: 4px; padding: 3px 6px; transform: rotate(-4deg); white-space: nowrap; mix-blend-mode: var(--stamp-blend); }

.empty { padding: 56px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty strong { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.1; }
.empty span { color: var(--muted); font-size: 14px; max-width: 42ch; }
.link { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover { text-decoration-color: currentColor; }
.sk { display: block; border-radius: 6px; background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- stamps (done page) ---------- */
.stamps { list-style: none; margin: 0; padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 4px; }
.stamp-card { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 0; background: none; border-radius: 14px; padding: 20px 18px 18px; color: inherit; transition: background .15s; }
.stamp-card:hover { background: var(--surface-2); }
.stamps > li { position: relative; }
.sc-undo {
  position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0;
  border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); box-shadow: var(--shadow-1);
  opacity: 0; transform: translateY(-2px); transition: opacity .15s, transform .2s var(--ease), background .15s, color .15s;
}
.sc-undo svg { width: 15px; height: 15px; }
.stamps > li:hover .sc-undo, .sc-undo:focus-visible { opacity: 1; transform: none; }
.sc-undo:hover { background: var(--surface-2); color: var(--ink); }
@media (hover: none) { .sc-undo { opacity: 1; transform: none; } }
.stamp-card .stamp { margin-bottom: 12px; }
.sc-title { font-size: 15px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.sc-memory { font-family: var(--font-display); font-style: italic; font-size: 17px; line-height: 1.3; color: var(--ink-2); overflow-wrap: anywhere; }
.sc-meta { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-top: auto; padding-top: 4px; }
.stamp {
  --ink: var(--done); position: relative; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  color: var(--ink); font-family: var(--font-mono); text-transform: uppercase; line-height: 1.2;
  border: 2px solid currentColor; outline: 1px solid currentColor; outline-offset: -6px;
  transform: rotate(var(--rot, -6deg)); filter: url(#ink); mix-blend-mode: var(--stamp-blend); opacity: .9;
}
.stamp.circle { width: 104px; height: 104px; border-radius: 50%; padding: 14px; }
.stamp.oval { width: 128px; height: 82px; border-radius: 50%; padding: 10px 18px; outline-offset: -5px; }
.stamp.rect { min-width: 118px; height: 74px; border-radius: 7px; padding: 8px 14px; outline-offset: -5px; }
.stamp .s1 { font-size: 7.5px; letter-spacing: .18em; max-width: 86px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stamp .s2 { font-size: 13px; font-weight: 500; letter-spacing: .06em; margin: 4px 0 3px; white-space: nowrap; }
.stamp .s3 { font-size: 7.5px; letter-spacing: .32em; padding-left: .32em; }
.stamp.big { width: 140px; height: 140px; padding: 18px; outline-offset: -8px; border-width: 2.5px; }
.stamp.big .s1 { font-size: 9px; max-width: 110px; } .stamp.big .s2 { font-size: 17px; } .stamp.big .s3 { font-size: 9px; }
.stamp.fresh { animation: thunk .55s cubic-bezier(.2, 1.5, .4, 1) var(--t, 0ms) both; }
@keyframes thunk { from { transform: rotate(calc(var(--rot, -6deg) - 16deg)) scale(1.9); opacity: 0; } to { transform: rotate(var(--rot, -6deg)) scale(1); opacity: .9; } }

/* ---------- dialog / sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); backdrop-filter: blur(4px) saturate(1.1); -webkit-backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; opacity: 0; transition: opacity .22s ease; }
.scrim.open { opacity: 1; }
.sheet {
  width: min(600px, 100%); max-height: min(88vh, 900px); display: flex; flex-direction: column; background: var(--surface);
  border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-3); outline: none;
  transform: translateY(14px) scale(.98); transition: transform .32s var(--ease);
}
.scrim.open .sheet { transform: none; }
.sheet.narrow { width: min(520px, 100%); }
.grab { display: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 6px 26px; }
.sheet-head.tall { align-items: flex-start; padding-top: 22px; }
.sheet-eyebrow { display: inline-flex; align-items: center; gap: 8px; }
.sheet-eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.sheet-eyebrow[data-st="planned"] i { background: var(--gold); }
.sheet-eyebrow[data-st="done"] i { background: var(--done); }
.sheet-body { overflow: auto; overscroll-behavior: contain; padding: 14px 26px 26px; display: flex; flex-direction: column; gap: 22px; }
/* scroll instead of squeezing: without this the title shrinks to a sliver when the calendar makes the sheet taller than the screen */
.sheet-body > * { flex-shrink: 0; }
.sheet-foot { border-top: 1px solid var(--line); padding: 12px 16px 12px 26px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); min-height: 57px; }
.sheet-foot .who { display: inline-flex; align-items: center; gap: 8px; }
.foot-confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; color: var(--ink-2); }
.foot-actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; margin-left: auto; }
.foot-actions #sheet-save { margin-left: 6px; }
.save-hint { font-size: 12.5px; color: var(--gold); margin-left: 8px; }
.dlg-title { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1; margin: 0 0 6px; }
.dlg-sub { margin: 0; color: var(--muted); font-size: 13.5px; }
.title-input {
  display: block; width: calc(100% + 16px); margin: 0 -8px; padding: 4px 8px; border: 0; border-radius: 10px; background: transparent; resize: none; overflow: hidden;
  font-family: var(--font-display); font-size: clamp(30px, 6vw, 38px); line-height: 1.08; letter-spacing: -0.015em; color: var(--ink); transition: background .15s;
}
.title-input:hover:not([readonly]), .title-input:focus { outline: none; background: var(--surface-2); }
.props { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 16px 18px; margin: 0; align-items: center; }
.props dt { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.props dt.top { align-self: start; padding-top: 9px; }
.props dd { margin: 0; min-width: 0; }
.fp {
  display: block; width: calc(100% + 16px); margin: 0 -8px; padding: 6px 8px; border: 1px solid transparent; border-radius: 9px;
  background: transparent; font-size: 14.5px; color: var(--ink); transition: background .15s, border-color .15s, box-shadow .15s; min-height: 34px;
}
.fp::placeholder { color: var(--faint); }
.fp:hover:not([readonly]) { background: var(--surface-2); }
.fp:focus { outline: none; background: var(--surface); border-color: var(--line-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 14%, transparent); }
textarea.fp { resize: none; overflow: hidden; line-height: 1.5; }
.dp-trigger { display: inline-flex; align-items: center; gap: 8px; width: auto; text-align: left; cursor: pointer; font-weight: 500; margin-right: 0; }
.dp-trigger svg { width: 15px; height: 15px; color: var(--cal-red); }
.dp-trigger.is-empty { color: var(--faint); font-weight: 400; }
.dp-trigger[aria-expanded="true"] { background: var(--surface-2); }
.dp-trigger[disabled] { cursor: default; }
/* month calendar styled after Apple Calendar */
.dp-cal { margin-top: 10px; padding: 14px 12px 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-1); max-width: 340px; animation: calIn .22s var(--ease); }
@keyframes calIn { from { opacity: 0; transform: translateY(-4px); } }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px 8px; }
.cal-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.cal-title span { font-weight: 400; color: var(--muted); }
.cal-nav { display: flex; align-items: center; gap: 2px; }
.cal-nav button { border: 0; background: none; color: var(--cal-red); height: 32px; min-width: 32px; padding: 0 8px; border-radius: 9px; font-size: 14px; font-weight: 500; display: grid; place-items: center; }
.cal-nav button:hover { background: color-mix(in srgb, var(--cal-red) 10%, transparent); }
.cal-nav svg { width: 18px; height: 18px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; }
.cal-dow { text-align: center; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; color: var(--faint); padding-bottom: 6px; }
.cal-day { justify-self: center; width: 100%; max-width: 38px; height: auto; aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; background: none; font-size: 16px; font-variant-numeric: tabular-nums; color: var(--ink); display: grid; place-items: center; transition: background .12s, color .12s; }
.cal-day:hover { background: var(--surface-3); }
.cal-day.today { color: var(--cal-red); font-weight: 600; }
.cal-day.sel { background: var(--cal-red); color: #fff; font-weight: 600; }
.cal-day:disabled { opacity: .3; cursor: default; background: none; }
.date-row { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.date-row .fp { margin-right: 0; }
.qd { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
.qd:hover { border-color: var(--line-2); background: var(--surface); color: var(--ink); }
.sheet-cl { border-top: 1px solid var(--line); padding-top: 20px; }

/* category manager */
.mgr { list-style: none; margin: 0 -8px; padding: 0; display: flex; flex-direction: column; }
.mgr-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 28px; align-items: center; gap: 6px 10px; padding: 4px 8px; border-radius: 12px; }
.mgr-row:hover { background: var(--surface-2); }
.mgr-row .fp:hover:not([readonly]) { background: var(--surface); }
.swatch { width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
.swatch::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot) 18%, transparent); }
.swatch:hover { background: var(--surface); }
.swatch[disabled] { cursor: default; background: transparent; }
.mgr-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mgr-confirm { grid-column: 2 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 2px 0 8px; }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; align-items: center; gap: 16px;
  background: var(--toast-bg); color: var(--toast-ink); padding: 11px 12px 11px 18px; border-radius: 14px; font-size: 14px; box-shadow: var(--shadow-2);
  max-width: min(92vw, 520px); transform: translate(-50%, 16px); opacity: 0; transition: transform .3s var(--ease), opacity .2s ease;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast span { min-width: 0; }
.toast button { border: 0; background: none; color: var(--toast-act); font-weight: 600; font-size: 13.5px; padding: 4px 8px; border-radius: 8px; }
.toast button:hover { background: color-mix(in srgb, var(--toast-ink) 10%, transparent); }

/* what the other person changed while you were away */
.changes { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-1); padding: 12px 8px 6px; display: flex; flex-direction: column; gap: 2px; }
.ch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px 2px 12px; }
.ch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ch-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border: 0; border-radius: 11px; background: none; text-align: left; color: var(--ink-2); font-size: 14px; line-height: 1.4; }
button.ch-row:hover { background: var(--surface-2); }
.ch-row .av { width: 24px; height: 24px; }
.ch-text { flex: 1; min-width: 0; display: block; overflow-wrap: anywhere; }
.ch-text::first-letter { text-transform: uppercase; }
.ch-text b { color: var(--ink); font-weight: 500; }
.ch-time { flex: none; font-size: 12px; color: var(--faint); white-space: nowrap; }
.ch-more { align-self: flex-start; margin: 2px 12px 8px; font-size: 13.5px; }

/* ---------- motion: title morph, stamp moment, shuffle ---------- */
/* while a view transition captures the panel, it shows its end state at once */
html.vt-snap .scrim, html.vt-snap .sheet { transition: none !important; }

}

@keyframes inkRing { 0% { opacity: .5; transform: scale(.72); } 100% { opacity: 0; transform: scale(1.45); } }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } }

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const LKEYS = { activities: "bucketlist.items.v1", categories: "bucketlist.categories.v1" };
  // Starter categories for the browser-only copy. The shared list keeps its categories in the database.
  const LOCAL_STARTER_CATS = [["Travel", 1], ["Food and Drinks", 3], ["Outdoors", 4], ["Adventure", 2], ["Culture & Events", 5], ["Learn Something", 7], ["Just for Fun", 6]];
  const STEP_IDEAS = ["Book tickets", "Pick a Date", "Make Reservation"];
  const COLORS = 8;
  const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const S = 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  const ICON = {
    check: `<svg viewBox="0 0 16 16" ${S.replace('1.5"', '2.2"')}><path d="M3.5 8.5l3 2.8 6-6.3"/></svg>`,
    x: `<svg viewBox="0 0 16 16" ${S}><path d="M4 4l8 8M12 4l-8 8"/></svg>`,
    chev: `<svg viewBox="0 0 16 16" ${S}><path d="M4.5 6.5L8 10l3.5-3.5"/></svg>`,
    right: `<svg viewBox="0 0 16 16" ${S}><path d="M6.5 4L10.5 8l-4 4"/></svg>`,
    left: `<svg viewBox="0 0 16 16" ${S}><path d="M9.5 4L5.5 8l4 4"/></svg>`,
    plus: `<svg viewBox="0 0 16 16" ${S}><path d="M8 3.5v9M3.5 8h9"/></svg>`,
    trash: `<svg viewBox="0 0 16 16" ${S}><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>`,
    cal: `<svg viewBox="0 0 16 16" ${S}><rect x="2.5" y="3.5" width="11" height="10" rx="2"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></svg>`,
    steps: `<svg viewBox="0 0 16 16" ${S}><path d="M2.5 4.5l1.2 1.2L6 3.5M2.5 10.5l1.2 1.2L6 9.5M8.5 4.8h5M8.5 10.8h5"/></svg>`,
    dice: `<svg viewBox="0 0 16 16" ${S}><rect x="2.5" y="2.5" width="11" height="11" rx="3"/><circle cx="5.8" cy="5.8" r=".6" fill="currentColor"/><circle cx="10.2" cy="10.2" r=".6" fill="currentColor"/><circle cx="8" cy="8" r=".6" fill="currentColor"/></svg>`,
    gear: `<svg viewBox="0 0 16 16" ${S}><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"/><circle cx="11" cy="4.5" r="1.5"/><circle cx="5" cy="11.5" r="1.5"/></svg>`,
    info: `<svg viewBox="0 0 16 16" ${S}><circle cx="8" cy="8" r="6.25"/><path d="M8 7.2V11M8 5v.01"/></svg>`,
    undo: `<svg viewBox="0 0 16 16" ${S}><path d="M5.5 3.5l-3 3 3 3"/><path d="M2.5 6.5h7a3.5 3.5 0 010 7H7"/></svg>`,
  };
  const CB_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="10.25"/><path class="tick" d="M7.6 12.4l3 2.9 5.9-6.2"/></svg>';

  const state = {
    mode: "loading",          // loading | db | local | unavailable
    items: [], cats: [], catsLoaded: false,
    canWrite: true, me: null,
    filter: safeGet("bucketlist.filter") || "todo",
    catFilter: safeGet("bucketlist.cat") || "",     // "" all, "none" uncategorized, or a category id
    composerCat: "",
    paste: null,               // lines waiting to be added from a paste
    sheet: null,
    changes: { events: [], seenAt: null, dismissed: false, all: false, hiddenAt: 0 },  // "While you were away"
    manager: false, managerReturn: null, catConfirm: null,
    dialogFresh: false,
    pop: null,                 // { kind, anchor, cat }
    suggestion: null,
    linger: new Map(),         // id -> { from, t0 }: just-completed rows that stay a moment before leaving
    fresh: new Map(),          // id -> t0: just-completed, for the check and stamp animations
    heroStamp: null, heroT0: 0,
    cal: { open: null, y: 0, m: 0 },  // month calendar open in the details panel
    swipeOpen: null, swipeGone: new Set(),
  };
  if (!["todo", "planned", "done", "all"].includes(state.filter)) state.filter = "todo";
  let dbNs = null, userNs = null, toastTimer = null, undoFn = null;
  const profiles = {};

  /* ---------- helpers ---------- */
  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function iso(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function todayISO() { return iso(new Date()); }
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function validISO(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function daysUntil(s) { return Math.round((parseISO(s) - parseISO(todayISO())) / 86400000); }
  function fmtDate(s, opts = {}) {
    const d = parseISO(s), sameYear = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString(undefined, { weekday: opts.day ? "short" : undefined, day: "numeric", month: "short", year: sameYear && !opts.year ? undefined : "numeric" });
  }
  function countdown(s) {
    const n = daysUntil(s);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    return n > 0 ? `In ${n} days` : `${-n} days ago`;
  }
  function shortCount(s) { const n = daysUntil(s); return n === 0 ? "today" : n === 1 ? "tomorrow" : n > 0 ? `in ${n}d` : `${-n}d ago`; }
  function stampDate(s) { const d = parseISO(s); return `${pad(d.getDate())} ${MON[d.getMonth()]}`; }
  function hash(s) { let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function cleanLine(l) { return l.replace(/^\s*(?:[-*•–—]|\d+[.)]|\[[ xX]?\])\s*/, "").replace(/^\[[ xX]?\]\s*/, "").trim(); }
  function statusOf(x) { return x.status === "done" ? "done" : x.status === "planned" ? "planned" : "todo"; }
  function byCreated(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); }
  function byPlanned(a, b) {
    const ap = validISO(a.plannedFor), bp = validISO(b.plannedFor);
    if (ap && bp) return a.plannedFor.localeCompare(b.plannedFor) || byCreated(a, b);
    return ap ? -1 : bp ? 1 : byCreated(a, b);
  }
  function byDone(a, b) { return String(b.doneOn || "").localeCompare(String(a.doneOn || "")) || (b.doneAt || 0) - (a.doneAt || 0); }
  function newId() { return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36) + Math.random().toString(36).slice(2); }
  function taskId() { return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function find(id) { return state.items.find((x) => x && x.id === id); }
  function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }

  /* ---------- categories ---------- */
  function sortedCats() {
    return state.cats.filter((c) => c && typeof c.name === "string" && c.name.trim())
      .sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
  }
  function colorIndex(c) { const n = Number(c && c.color); return n >= 1 && n <= COLORS ? Math.round(n) : COLORS; }
  function hashColor(name) { return (hash(name.toLowerCase()) % COLORS) + 1; }
  function catVar(c) { return `var(--k${c.legacy ? hashColor(c.name) : colorIndex(c)})`; }
  function catById(id) { return id ? state.cats.find((c) => c && c.id === id && typeof c.name === "string") : null; }
  function catByName(name) { const n = name.trim().toLowerCase(); return state.cats.find((c) => c && typeof c.name === "string" && c.name.trim().toLowerCase() === n); }
  // Activities point at a category by id. Older ones may still carry a plain name.
  function resolveCat(item) {
    if (!item) return null;
    if (item.categoryId) { const c = catById(item.categoryId); if (c) return c; }
    if (typeof item.category === "string" && item.category.trim()) return catByName(item.category) || { id: null, name: item.category.trim(), legacy: true };
    return null;
  }
  function matchesCat(item) {
    if (!state.catFilter) return true;
    const c = resolveCat(item);
    return state.catFilter === "none" ? !c : !!c && c.id === state.catFilter;
  }

  /* ---------- checklist ---------- */
  function tasksOf(item) {
    const cl = item.checklist;
    if (!cl || typeof cl !== "object" || Array.isArray(cl)) return [];
    return Object.entries(cl)
      .filter(([, t]) => t && typeof t === "object" && typeof t.text === "string" && t.text.trim())
      .map(([id, t]) => ({ ...t, id }))
      .sort((a, b) => (a.order || 0) - (b.order || 0));
  }

  /* ---------- storage: shared db when available, this browser otherwise ---------- */
  function listOf(coll) { return coll === "activities" ? state.items : state.cats; }
  function readLocal(coll) { try { const v = JSON.parse(localStorage.getItem(LKEYS[coll])); return Array.isArray(v) ? v : null; } catch { return null; } }
  function writeLocal(coll, list, quiet) {
    try { localStorage.setItem(LKEYS[coll], JSON.stringify(list)); } catch {}
    if (coll === "activities") { state.items = list; checkNew(list, false); } else state.cats = list;
    if (!quiet) render();
  }
  // Same rule as the shared store: nested objects merge, everything else replaces.
  function merge(a, b) {
    const out = { ...a };
    for (const [k, v] of Object.entries(b)) {
      const cur = out[k];
      out[k] = v && typeof v === "object" && !Array.isArray(v) && cur && typeof cur === "object" && !Array.isArray(cur) ? merge(cur, v) : v;
    }
    return out;
  }
  async function guarded(fn) {
    if (!state.canWrite) { toast("You can view this list but not change it."); return false; }
    try { await fn(); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === "unavailable") {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        try { await fn(); return true; } catch {}
        toast("Couldn't save just now. Check your connection and try again.");
      } else if (code === "invalid_argument") {
        // Either this person can't edit, or what they saved was just changed or deleted by someone else.
        const can = userNs ? await userNs.can("data.write") : null;
        if (can === false) {
          state.canWrite = false; render();
          toast("You can view this list but not change it. Ask the owner to share it with you as an Editor.");
        } else toast("Couldn't save that. Someone may have just changed or deleted it.");
      } else if (code === "not_found") {
        toast("That was just deleted, so the change wasn't saved.");
      } else if (code === "quota_exceeded") {
        toast("The list is full. Delete a few old activities to make room.");
      } else {
        toast("Couldn't save that change. Try again in a moment.");
      }
      return false;
    }
  }
  // Changes to activities are also noted in the "events" log, so the other person sees them later.
  const add = async (coll, data) => {
    const id = newId();
    const ok = await guarded(async () => {
      if (dbNs) await dbNs.collection(coll).doc(id).set(data);
      else writeLocal(coll, [...listOf(coll), { id, ...data }]);
    });
    if (ok && coll === "activities") logEvent("add", id, data.title);
    return ok;
  };
  const setDoc = async (coll, id, data) => {
    const ok = await guarded(async () => {
      if (dbNs) await dbNs.collection(coll).doc(id).set(data);
      else writeLocal(coll, [...listOf(coll).filter((x) => x.id !== id), { ...data, id }]);
    });
    if (ok && coll === "activities") logEvent("add", id, data.title);  // e.g. undoing a delete
    return ok;
  };
  const update = async (coll, id, patch) => {
    const prev = coll === "activities" ? find(id) : null;
    const ok = await guarded(async () => {
      if (dbNs) await dbNs.collection(coll).doc(id).update(patch);
      else writeLocal(coll, listOf(coll).map((x) => (x.id === id ? merge(x, patch) : x)));
    });
    const c = ok && prev && describeChange(prev, patch);
    if (c) logEvent(c.type, id, patch.title || prev.title, c.date, c.from);
    return ok;
  };
  const remove = async (coll, id) => {
    const prev = coll === "activities" ? find(id) : null;
    const ok = await guarded(async () => {
      if (dbNs) await dbNs.collection(coll).doc(id).delete();
      else writeLocal(coll, listOf(coll).filter((x) => x.id !== id));
    });
    if (ok && prev) logEvent("delete", id, prev.title);
    return ok;
  };

  /* ---------- what changed: a short log of who did what ---------- */
  const EVENT_TYPES = new Set(["add", "plan", "move", "done", "unplan", "unstamp", "delete"]);
  const INVERSE = { done: "unstamp", unstamp: "done", plan: "unplan", unplan: "plan", delete: "add", add: "delete" };
  // A change reversed within this long never shows up in the log.

    const date = `${pad(d.getDate())} ${MON[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`;
    const t0 = opts.t0 || state.fresh.get(item.id);
    return `<span class="stamp ${shape}${opts.big ? " big" : ""}${t0 ? " fresh" : ""}" style="--ink:${c ? catVar(c) : "var(--done)"};--rot:${rot}deg;--t:-${t0 ? Date.now() - t0 : 0}ms" aria-hidden="true">
      <span class="s1">${esc(c ? c.name : "Bucket list")}</span><span class="s2">${date}</span><span class="s3">Done</span></span>`;
  }
  function mrzLines(a, b) {
    const clean = (s) => String(s || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Z0-9]+/g, "<").replace(/^<+|<+$/g, "");
    return esc([clean(a), clean(b)].map((s) => (s + "<".repeat(44)).slice(0, 44)).join("\n"));
  }

  /* ---------- checklist component ---------- */
  function checklistHTML(item, where) {
    const w = state.canWrite, id = esc(item.id);
    const tasks = tasksOf(item), done = tasks.filter((t) => t.done).length;
    if (!w && !tasks.length) return "";
    const have = new Set(tasks.map((t) => t.text.trim().toLowerCase()));
    const ideas = STEP_IDEAS.filter((s) => !have.has(s.toLowerCase()));
    const steps = tasks.map((t) => {
      const tid = esc(t.id);
      return `<li class="step${t.done ? " done" : ""}">
        <button type="button" class="sbox" ${w ? "" : "disabled"} data-act="task-toggle" data-id="${id}" data-task="${tid}" aria-pressed="${!!t.done}" aria-label="${t.done ? "Mark step not done" : "Mark step done"}: ${esc(t.text)}">${ICON.check}</button>
        <span class="stext">${esc(t.text)}</span>
        ${w ? `<button type="button" class="icon-btn sm danger sdel" data-act="task-del" data-id="${id}" data-task="${tid}" aria-label="Remove step: ${esc(t.text)}">${ICON.x}</button>` : "<span></span>"}
      </li>`;
    }).join("");
    return `<div class="cl">
      <div class="cl-head"><span class="cl-title">Before we go</span>${tasks.length ? `<span class="cl-prog">${done}/${tasks.length}<span class="cl-bar" aria-hidden="true"><i style="width:${Math.round((done / tasks.length) * 100)}%"></i></span></span>` : ""}</div>
      ${tasks.length ? `<ul class="steps">${steps}</ul>` : ""}
      ${w ? `<label class="step-add">${ICON.plus}<input data-key="task:${where}:${id}" maxlength="140" placeholder="${tasks.length ? "Add a step" : "Add the first step"}" aria-label="Add a step to ${esc(item.title)}"><button type="button" class="btn sm ghost" data-act="task-add" data-id="${id}" data-where="${where}">Add</button></label>` : ""}
      ${w && tasks.length < 3 && ideas.length ? `<div class="ideas">${ideas.slice(0, 5).map((s) => `<button type="button" class="idea" data-act="task-suggest" data-id="${id}" data-text="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
    </div>`;
  }

  /* ---------- the document ---------- */
  function renderNext(c) {
    const el = $("#next");
    const w = state.canWrite;
    const no = c.by.done.length + 1;
    const top = (left, right) => `<div class="doc-top"><span class="label">${left}</span><span class="label">${right}</span></div>`;
    let html;
    if (state.mode === "loading") {
      html = `<article class="doc"><canvas class="guill" aria-hidden="true"></canvas>${top("Next up", "")}<div class="doc-idle"><span class="sk" style="height:44px;width:70%"></span><span class="sk" style="height:14px;width:45%"></span></div><div class="mrz" aria-hidden="true">${mrzLines("", "")}</div></article>`;
    } else {
      const stamped = state.heroStamp && find(state.heroStamp);
      const next = stamped || c.by.planned[0];
      if (next) {
        const dated = validISO(next.plannedFor), d = dated ? parseISO(next.plannedFor) : null;
        const late = dated && daysUntil(next.plannedFor) < 0 && !stamped;
        const cat = resolveCat(next);
        const tasks = tasksOf(next), td = tasks.filter((t) => t.done).length;
        const more = c.by.planned.filter((x) => x.id !== next.id).length;
        const cl = stamped ? "" : checklistHTML(next, "hero");
        html = `<article class="doc">
          <canvas class="guill" aria-hidden="true"></canvas>
          ${top("Next up", `Adventure <b>Nº ${pad(stamped ? no - 1 : no)}</b>`)}
          <div class="doc-grid">
            ${dated ? `<div class="doc-date"><span class="dd-dow">${esc(d.toLocaleDateString(undefined, { weekday: "long" }))}</span><span class="dd-day">${d.getDate()}</span><span class="dd-mon">${esc(d.toLocaleDateString(undefined, d.getFullYear() !== new Date().getFullYear() ? { month: "short", year: "numeric" } : { month: "long" }))}</span></div>`
                    : `<div class="doc-date tbd"><span class="dd-dow">No date</span><span class="dd-day">–</span><span class="dd-mon">To be set</span></div>`}
            <div class="doc-main">
              <h2><button type="button" class="doc-title-btn" data-act="open-sheet" data-id="${esc(next.id)}">${esc(next.title)}</button></h2>
              <dl class="fields">
                <div><dt>Departs</dt><dd><span>${dated ? esc(fmtDate(next.plannedFor, { day: true })) : "To be decided"}</span></dd></div>
                ${dated ? `<div><dt>Countdown</dt><dd class="${late ? "late" : "time"}"><span>${countdown(next.plannedFor)}</span></dd></div>` : ""}
                ${cat ? `<div><dt>Category</dt><dd><i class="dot" style="--dot:${catVar(cat)}"></i><span>${esc(cat.name)}</span></dd></div>` : ""}
                ${tasks.length ? `<div><dt>Prepared</dt><dd><span>${td} of ${plural(tasks.length, "step", "steps")}</span></dd></div>` : ""}
              </dl>
            </div>
          </div>
          ${(w && !stamped) || more ? `<div class="doc-actions">
            ${w && !stamped ? `<button type="button" class="btn primary" data-act="hero-done" data-id="${esc(next.id)}">${ICON.check} We did it</button>
            <button type="button" class="btn" data-act="reschedule" data-id="${esc(next.id)}">${ICON.cal} ${dated ? "Reschedule" : "Pick a date"}</button>` : ""}
            ${more ? `<button type="button" class="btn ghost" data-act="tab" data-v="planned">${plural(more, "more plan", "more plans")}</button>` : ""}
          </div>` : ""}
          <div class="mrz" aria-hidden="true">${mrzLines("BL " + next.title, `${pad(no)} ${dated ? `${pad(d.getDate())}${MON[d.getMonth()]}${String(d.getFullYear()).slice(2)}` : "TBD"} ${cat ? cat.name : ""}`)}</div>
          ${stamped ? `<div class="hero-stamp" style="--ring:${cat ? catVar(cat) : "var(--done)"}">${stampHTML(next, { big: true, shape: "circle", rot: -12, t0: state.heroT0 })}</div>` : ""}
          ${cl ? `<div class="stub">${cl}</div>` : ""}
        </article>`;
      } else {
        const todo = c.by.todo.filter(matchesCat);
        const sug = state.suggestion && todo.find((x) => x.id === state.suggestion);
        const fc = state.catFilter && state.catFilter !== "none" ? catById(state.catFilter) : null;
        if (sug) {
          const cat = resolveCat(sug);
          html = `<article class="doc">
            <canvas class="guill" aria-hidden="true"></canvas>
            ${top("A suggestion", `<b>${todo.length}</b> to choose from${fc ? ` in ${esc(fc.name)}` : ""}`)}
            <div class="doc-idle">
              ${state.shuffle ? `<h2 class="reel" aria-label="${esc(sug.title)}"><span class="reel-track" style="--n:${state.shuffle.names.length - 2}" aria-hidden="true">${state.shuffle.names.map((n) => `<span>${esc(n)}</span>`).join("")}</span></h2>` : `<h2>${esc(sug.title)}</h2>`}
              ${sug.notes ? `<p>${esc(sug.notes)}</p>` : ""}
              ${cat ? `<dl class="fields"><div><dt>Category</dt><dd><i class="dot" style="--dot:${catVar(cat)}"></i><span>${esc(cat.name)}</span></dd></div></dl>` : ""}
            </div>
            ${w ? `<div class="doc-actions">
              <button type="button" class="btn primary" data-act="plan-pick" data-id="${esc(sug.id)}">${ICON.cal} Plan this one</button>
              ${todo.length > 1 ? `<button type="button" class="btn" data-act="pick">${ICON.dice} Another</button>` : ""}
              <button type="button" class="btn ghost" data-act="clear-pick">Not now</button>
            </div>` : ""}
            <div class="mrz" aria-hidden="true">${mrzLines("BL HOW ABOUT " + (state.shuffle ? "" : sug.title), "")}</div>
          </article>`;
        } else {
          let title, msg, action = "";
          if (!c.total) { title = "Start <em>your</em> list"; msg = "Add the first thing you want to do together below. Plan one, and it lands here with a countdown and a checklist."; }
          else if (!c.by.todo.length) { title = "Every stamp <em>collected</em>"; msg = "You've done everything on the list. Time to dream up more."; }
          else if (!todo.length) { title = "Where <em>to</em> next?"; msg = "Nothing left to do in this category. Show all categories to pick from everything."; }
          else {
            title = "Where <em>to</em> next?";
            msg = `${plural(todo.length, "activity is", "activities are")} waiting for a date. Plan one and it lands here.`;
            if (w) action = `<div class="doc-actions"><button type="button" class="btn primary" data-act="pick">${ICON.dice} Pick one for us</button></div>`;
          }
          html = `<article class="doc">
            <canvas class="guill" aria-hidden="true"></canvas>
            ${top("Next up", `Adventure <b>Nº ${pad(no)}</b>`)}
            <div class="doc-idle"><h2>${title}</h2><p>${msg}</p></div>
            ${action}
            <div class="mrz" aria-hidden="true">${mrzLines("BL WHERE TO NEXT", pad(no))}</div>
          </article>`;
        }
      }
    }
    // Motion classes, timed from when each moment started so a redraw picks up mid-way.
    const since = (t) => Date.now() - t;
    let cls = "", t = 0;
    const stamping = state.heroStamp && find(state.heroStamp);
    if (stamping && state.heroLeave) { cls = "doc-leave"; t = since(state.heroLeave); }
    else if (stamping) { cls = "stamping"; t = since(state.heroT0); }
    else if (state.shuffle) { cls = "shuffling"; t = since(state.shuffle.t0); }
    else if (state.landedAt && since(state.landedAt) < 450) { cls = "landed"; t = since(state.landedAt); }
    else if (state.docEnter && since(state.docEnter) < 500) { cls = "doc-enter"; t = since(state.docEnter); }
    if (cls && html) html = html.replace('<article class="doc">', `<article class="doc ${cls}" style="--t:-${t}ms">`);
    el.innerHTML = html;
    const cv = $("canvas.guill", el);
    if (cv) { if (guillRO) { guillRO.disconnect(); guillRO.observe(cv); } else drawGuilloche(cv); }
  }

  /* ---------- list ---------- */
  function rowHTML(item) {
    const w = state.canWrite, id = esc(item.id), st = statusOf(item);
    const lg = state.linger.get(item.id);
    const checked = st === "done" || !!lg;
    const t0 = lg ? lg.t0 : state.fresh.get(item.id);
    const cat = resolveCat(item), tasks = tasksOf(item), td = tasks.filter((x) => x.done).length;
    const meta = [];
    if (cat) meta.push(`<span><i class="dot" style="--dot:${catVar(cat)}"></i>${esc(cat.name)}</span>`);
    if (st === "planned" && tasks.length) meta.push(`<span>${ICON.steps}${td}/${tasks.length}</span>`);
    if (st === "done" && item.memory) meta.push(`<span class="note">“${esc(item.memory)}”</span>`);
    else if (item.notes) meta.push(`<span class="note">${esc(item.notes.split("\n")[0])}</span>`);
    let end = "";
    if (st === "planned" && !lg) {
      end = validISO(item.plannedFor)
        ? `<span class="when${daysUntil(item.plannedFor) < 0 ? " late" : ""}"><b>${stampDate(item.plannedFor)}</b><span>${shortCount(item.plannedFor)}</span></span>`
        : `<span class="when tbd"><b>TBD</b></span>`;
    } else if (st === "done") {
      end = `<span class="mini-stamp" style="--ink-c:${cat ? catVar(cat) : "var(--done)"}">${validISO(item.doneOn) ? stampDate(item.doneOn) : "Done"}</span>`;
    } else if (item.addedBy) end = avatar(item.addedBy, "Added by {name}");
    const leaving = lg && state.filter !== "all";
    const planBtn = w && st === "todo" && !lg;
    const cls = `row${checked ? " is-done" : ""}${leaving ? " leaving" : ""}${state.swipeOpen === item.id ? " swiped" : ""}${state.swipeGone.has(item.id) ? " swipe-gone" : ""}`;
    return `<li class="${cls}" data-row="${id}" style="--t:-${t0 ? Date.now() - t0 : 0}ms">
      ${w ? `<div class="swipe-actions"><button type="button" class="swipe-del" data-act="swipe-delete" data-id="${id}" tabindex="-1" aria-label="Delete ${esc(item.title)}">${ICON.trash}Delete</button></div>` : ""}
      <div class="row-inner">
        <button type="button" class="cb${checked ? " on" : ""}${t0 ? " pop" : ""}" ${w ? "" : "disabled"} data-act="${checked ? "uncomplete" : "complete"}" data-id="${id}" aria-label="${checked ? "Mark as not done" : "Mark as done"}: ${esc(item.title)}">${CB_SVG}</button>
        <button type="button" class="row-open" data-act="open-sheet" data-id="${id}">
          <span class="row-main"><span class="row-title">${esc(item.title)}</span>${meta.length ? `<span class="row-meta">${meta.join("")}</span>` : ""}</span>
          <span class="row-end">${end}${planBtn ? "" : ICON.right}</span>
        </button>
        ${planBtn ? `<button type="button" class="row-plan" data-act="plan-row" data-id="${id}" aria-label="Plan ${esc(item.title)}">${ICON.cal}<span>Plan</span>${ICON.right}</button>` : ""}
      </div>
    </li>`;
  }
  function stampCardHTML(item) {
    const who = item.doneBy ? avatar(item.doneBy, "Ticked off by {name}") : "";
    return `<li><button type="button" class="stamp-card" data-act="open-sheet" data-id="${esc(item.id)}">
      ${stampHTML(item)}
      <span class="sc-title">${esc(item.title)}</span>
      ${item.memory ? `<span class="sc-memory">“${esc(item.memory)}”</span>` : ""}
      <span class="sc-meta">${who}${validISO(item.doneOn) ? esc(fmtDate(item.doneOn, { year: true })) : ""}</span>
    </button>${state.canWrite ? `<button type="button" class="sc-undo" data-act="unstamp" data-id="${esc(item.id)}" title="Remove stamp" aria-label="Remove stamp from ${esc(item.title)}">${ICON.undo}</button>` : ""}</li>`;
  }
  function renderList(c) {
    const el = $("#list");
    if (state.mode === "loading") {
      el.innerHTML = `<div class="card"><ul class="rows">${[62, 48, 56].map((w) => `<li class="row" style="display:flex;padding:18px 20px;gap:16px"><span class="sk" style="width:22px;height:22px;border-radius:50%"></span><span class="sk" style="height:14px;width:${w}%;margin-top:4px"></span></li>`).join("")}</ul></div>`;
      return;
    }
    const inTab = (x, tab) => (statusOf(x) === tab || (state.linger.get(x.id) || {}).from === tab) && matchesCat(x);
    const f = state.filter;
    let body;
    if (f === "done") {
      const list = c.by.done.filter(matchesCat);
      body = list.length ? `<ul class="stamps">${list.map(stampCardHTML).join("")}</ul>` : emptyHTML(c);
    } else {
      const list = f === "todo" ? c.items.filter((x) => inTab(x, "todo")).sort(byCreated)
        : f === "planned" ? c.items.filter((x) => inTab(x, "planned")).sort(byPlanned)
        : [...c.by.planned, ...c.by.todo, ...c.by.done].filter(matchesCat);
      body = list.length ? `<ul class="rows">${list.map(rowHTML).join("")}</ul>` : emptyHTML(c);
    }
    el.innerHTML = `<div class="card">${body}</div>`;
  }
  function emptyHTML(c) {
    let t, s;
    if (!c.total) { t = "Nothing on the list yet"; s = "Type your first idea above, or paste a whole list to add everything at once."; }
    else if (state.catFilter) {
      const name = state.catFilter === "none" ? "without a category" : `in ${esc((catById(state.catFilter) || {}).name || "this category")}`;
      t = `Nothing here ${name}`; s = `Try another tab, or <button type="button" class="link" data-act="clear-cat">show all categories</button>.`;
    }
    else if (state.filter === "todo") { t = "All caught up"; s = "Everything is planned or done."; }
    else if (state.filter === "planned") { t = "No plans yet"; s = "Open any activity and set it to Planned to give it a date and a checklist."; }
    else if (state.filter === "done") { t = "No stamps yet"; s = "Tick off your first activity and its stamp lands here."; }
    else { t = "Nothing here"; s = ""; }
    return `<div class="empty"><strong>${t}</strong>${s ? `<span>${s}</span>` : ""}</div>`;
  }

  /* ---------- dialogs ---------- */
  // Shown above the name in the details sheet.
  const SHEET_EYEBROW = { todo: "To Do", planned: "Plan", done: "Completed" };
  function sheetParts(item) {
    const w = state.canWrite, ro = w ? "" : "readonly", id = esc(item.id), st = statusOf(item);
    const cat = resolveCat(item), tasks = tasksOf(item);
    const added = item.createdAt ? fmtDate(iso(new Date(item.createdAt)), { year: true }) : "";
    const who = item.addedBy && userNs
      ? `<span class="who">${avatar(item.addedBy, "Added by {name}")}Added by <span data-name-for="${esc(item.addedBy)}">${esc(personName(item.addedBy))}</span>${added ? ` · ${esc(added)}` : ""}</span>`
      : `<span class="who">${added ? `Added ${esc(added)}` : ""}</span>`;
    const head = `<span class="label sheet-eyebrow" id="sheet-eyebrow" data-st="${st}"><i aria-hidden="true"></i><span>${SHEET_EYEBROW[st]}</span></span>
      <button type="button" class="icon-btn" data-act="close-dialog" aria-label="Close">${ICON.x}</button>`;
    const body = `
      <textarea class="title-input autogrow" rows="1" maxlength="200" data-key="s:title" data-field="title" aria-label="Activity name" ${ro}>${esc(item.title)}</textarea>
      <dl class="props">
        <dt>Category</dt>
        <dd><button type="button" class="picker bare" data-act="pop" data-kind="sheet-cat" data-pop-anchor="sheet-cat" aria-haspopup="listbox" aria-expanded="false" ${w ? "" : "disabled"}>${catLabel(cat, "No category")}${w ? ICON.chev : ""}</button></dd>
        ${st === "planned" ? `
        <dt class="top">Date</dt>
        <dd><div class="date-row">${dpHTML("plannedFor", item.plannedFor, "Planned date", !w)}
          ${w ? `<button type="button" class="qd" data-act="quick-date" data-v="weekend">This weekend</button><button type="button" class="qd" data-act="quick-date" data-v="month">In a month</button>${validISO(item.plannedFor) ? `<button type="button" class="qd" data-act="quick-date" data-v="clear">No date</button>` : ""}` : ""}</div><div class="dp-cal" data-cal-for="plannedFor" hidden></div></dd>` : ""}
        ${st === "done" ? `
        <dt class="top">Done on</dt>
        <dd><div class="date-row">${dpHTML("doneOn", item.doneOn, "Done on", !w, todayISO())}</div><div class="dp-cal" data-cal-for="doneOn" hidden></div></dd>
        <dt class="top">Memory</dt>
        <dd><textarea class="fp autogrow" rows="1" maxlength="300" data-key="s:memory" data-field="memory" placeholder="A line to remember it by" aria-label="Memory" ${ro}>${esc(item.memory || "")}</textarea></dd>` : ""}
        <dt class="top">Notes</dt>
        <dd><textarea class="fp autogrow" rows="1" maxlength="1000" data-key="s:notes" data-field="notes" placeholder="Ideas, links, costs…" aria-label="Notes" ${ro}>${esc(item.notes || "")}</textarea></dd>
      </dl>
      ${st === "planned" || tasks.length ? `<section class="sheet-cl">${checklistHTML(item, "sheet")}</section>` : ""}`;
    const reverse = st === "todo" ? `<button type="button" class="btn sm ghost" data-act="set-status" data-v="planned">${ICON.cal} Plan this</button>`
      : st === "planned" ? `<button type="button" class="btn sm ghost" data-act="cancel-plan" data-id="${id}">${ICON.x} Cancel plan</button>`
      : st === "done" ? `<button type="button" class="btn sm ghost" data-act="unstamp" data-id="${id}">${ICON.undo} Remove stamp</button>` : "";
    const foot = `${who}${w ? (state.sheetLeave
      ? `<span class="foot-confirm">Save your changes?<button type="button" class="btn sm ghost" data-act="sheet-discard">Discard</button><button type="button" class="btn sm primary" data-act="sheet-save" data-close="1">Save</button></span>`
      : `<span class="foot-actions">${reverse}<span class="save-hint" id="save-hint" hidden>Unsaved changes</span><button type="button" class="btn sm primary" id="sheet-save" data-act="sheet-save" disabled>Save</button></span>`) : ""}`;
    return { head, body, foot, status: st };
  }
  function managerParts(c) {
    const w = state.canWrite, cats = sortedCats();
    const counts = {};
    for (const it of c.items) { const k = resolveCat(it); if (k && k.id) counts[k.id] = (counts[k.id] || 0) + 1; }
    const rows = cats.map((k) => {
      const id = esc(k.id), n = counts[k.id] || 0;
      return `<li class="mgr-row">
        <button type="button" class="swatch" style="--dot:${catVar(k)}" data-act="pop" data-kind="color" data-pop-anchor="color:${id}" data-cat="${id}" aria-haspopup="listbox" aria-expanded="false" aria-label="Change color of ${esc(k.name)}" ${w ? "" : "disabled"}></button>
        <input class="fp" data-key="cat:${id}" data-cat-name="${id}" value="${esc(k.name)}" maxlength="40" aria-label="Category name" ${w ? "" : "readonly"}>
        <span class="mgr-count">${plural(n, "activity", "activities")}</span>
        ${w ? `<button type="button" class="icon-btn sm danger" data-act="cat-del" data-cat="${id}" aria-label="Delete ${esc(k.name)}">${ICON.trash}</button>` : "<span></span>"}
        ${state.catConfirm === k.id ? `<div class="mgr-confirm">Delete “${esc(k.name)}”?${n ? ` ${plural(n, "activity", "activities")} will have no category.` : ""}<button type="button" class="btn sm ghost" data-act="cat-keep">Keep</button><button type="button" class="btn sm danger" data-act="cat-confirm-del" data-cat="${id}">Delete</button></div>` : ""}
      </li>`;
    }).join("");
    const head = `<div><h2 class="dlg-title" id="dlg-title">Categories</h2><p class="dlg-sub">Shared by both of you. Click a color to change it, or a name to rename it.</p></div>
      <button type="button" class="icon-btn" data-act="close-dialog" aria-label="Close">${ICON.x}</button>`;
    const body = `${cats.length ? `<ul class="mgr">${rows}</ul>` : `<p class="dlg-sub">No categories yet. Add your first one below.</p>`}
      ${w ? `<label class="step-add">${ICON.plus}<input id="cat-new" data-key="cat:new" maxlength="40" placeholder="New category, e.g. Road Trips" aria-label="New category name"><button type="button" class="btn sm ghost" data-act="cat-add">Add</button></label>` : ""}`;
    return { head, body, foot: null };
  }
  function renderDialog(c) {
    const root = $("#dialog-root");
    if (state.sheet && !find(state.sheet)) state.sheet = null;
